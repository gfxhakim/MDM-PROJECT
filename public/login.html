<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MDM Express — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700&display=swap">
<style>
:root{--red:#DC2626;--red-500:#EF4444;--ink:#111827;--ink3:#374151;--muted:#6B7280;--line:#E5E7EB;--bg:#F4F6F8;--surface:#fff;--r:8px;--r-lg:12px;
  --ui:'Inter','Cairo',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;display:grid;place-items:center;padding:16px}
html.lang-ar body{font-family:Cairo,Inter,system-ui,sans-serif}
.card{width:100%;max-width:380px;background:var(--surface);border-radius:var(--r-lg);box-shadow:0 12px 32px rgba(16,24,40,.14);padding:28px}
.logo{display:flex;flex-direction:column;line-height:.86;user-select:none;margin-bottom:22px}
.logo-word{font-weight:800;font-style:italic;font-size:30px;letter-spacing:-2px}
.logo-word .r{color:var(--red-500)} .logo-word .k{color:#111}
.logo-sub{font-weight:800;font-style:italic;font-size:11px;letter-spacing:1.8px;padding-left:2px}
h1{font-size:18px;margin:0 0 4px} p{margin:0 0 18px;color:var(--muted)}
label{display:block;font-size:12px;font-weight:600;color:var(--ink3);margin:12px 0 5px}
input{width:100%;height:38px;border:1px solid var(--line);border-radius:var(--r);padding:0 11px;font:inherit}
input:focus{outline:2px solid #3B82F6;outline-offset:0}
button{font:inherit;cursor:pointer;border:0}
.go{width:100%;height:40px;margin-top:18px;border-radius:var(--r);background:var(--red);color:#fff;font-weight:700}
.go:disabled{opacity:.6;cursor:wait}
.err{margin-top:12px;padding:9px 11px;border-radius:var(--r);background:#FEF2F2;color:#991B1B;font-size:13px;display:none}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:12px;color:var(--muted)}
.lang{background:none;color:var(--ink3);font-weight:600;font-family:Cairo,Inter,sans-serif}
</style>
</head>
<body>
<form class="card" id="f" novalidate>
  <div class="logo"><span class="logo-word"><span class="r">M</span><span class="k">D</span><span class="r">M</span></span><span class="logo-sub">EXPRESS</span></div>
  <h1>Sign in</h1>
  <p>Onboarding and Account Management consoles</p>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username" required>
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" required>
  <button class="go" id="go" type="submit">Sign in</button>
  <div class="err" id="err" role="alert"></div>
  <div class="foot"><span>Your role decides which console opens.</span><span id="lang"></span></div>
</form>
<script src="/assets/api.js"></script>
<script src="/assets/i18n.js"></script>
<script src="/assets/i18n-ar.js"></script>
<script>
  window.render = function () {
    document.getElementById('lang').innerHTML = I18N.toggleHTML();
    I18N.apply(document.body);
  };
  const s = API.session();
  if (s && s.user) location.replace(API.homeFor(s.user.role));
  render();
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const go = document.getElementById('go'); const err = document.getElementById('err');
    go.disabled = true; err.style.display = 'none';
    try {
      const user = await API.login(document.getElementById('email').value.trim(), document.getElementById('password').value);
      location.href = API.homeFor(user.role);
    } catch (x) {
      err.textContent = I18N.t(x.message || 'Sign-in failed.'); err.style.display = 'block'; go.disabled = false;
    }
  });
</script>
</body>
</html>
