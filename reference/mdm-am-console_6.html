<script>
/* =============== My Day =============== */
function prioRank(t){ return ({urgent:0,high:1,normal:2,low:3})[t.prio] ?? 3; }
function myQueue(){
  const out=[];
  book().forEach(s=>s.tasks.filter(t=>!t.done).forEach(t=>out.push({s,t})));
  return out.sort((a,b)=> (days(a.t.dueAt)-days(b.t.dueAt)) || (prioRank(a.t)-prioRank(b.t)) || (health(a.s)-health(b.s)));
}
function capCard(){
  const c=capacity(ME), pct=Math.round(c.util*100);

  const seg=n=>tot?Math.round(n/tot*100):0;
  return `<div class="card">
    <div class="card-h">${ic('gauge',16)}<h3>This week</h3><span class="sp"></span>

      <i class="bk-onb" style="width:${seg(c.mix.onb)}%"></i>
      <i class="bk-crit" style="width:${seg(c.mix.crit)}%"></i>
      <i class="bk-risk" style="width:${seg(c.mix.risk)}%"></i>
      <i class="bk-steady" style="width:${seg(c.mix.steady)}%"></i>
      <i class="bk-free" style="width:${Math.max(0,100-seg(c.mix.onb)-seg(c.mix.crit)-seg(c.mix.risk)-seg(c.mix.steady))}%"></i>
    </div>
    <div class="legend-t">
      <span><i style="background:#7C3AED"></i>Onboarding ${Math.round(c.mix.onb/60)}h</span>
      <span><i style="background:#DC2626"></i>Critical ${Math.round(c.mix.crit/60)}h</span>
      <span><i style="background:#F59E0B"></i>At risk ${Math.round(c.mix.risk/60)}h</span>
      <span><i style="background:#22C55E"></i>Steady ${Math.round(c.mix.steady/60)}h</span>
    </div>
    <div style="margin-top:14px">
      <div class="kv"><span class="k">Assignable time</span><span class="v num">${Math.round(c.assignable/60)} h <span class="muted tiny">(${CFG.workDays}×${CFG.shiftMin/60}h less ${CFG.reservedPct}% reserved)</span></span></div>
      <div class="kv"><span class="k">Unplanned messaging</span><span class="v num">${Math.round(c.baseline/60)} h</span></div>
      <div class="kv"><span class="k">Contact cadence</span><span class="v num">${Math.round(c.cadence/60)} h <span class="muted tiny">every ${CFG.cadRisk}–${CFG.cadThriving} d by band</span></span></div>
      <div class="kv"><span class="k">Booked tasks</span><span class="v num">${Math.round(c.taskMins/60)} h <span class="muted tiny">${c.openTasks} due this week</span></span></div>
      <div class="kv"><span class="k">Committed</span><span class="v num">${Math.round(c.committed/60)} h · ${pct}%</span></div>
      <div class="kv"><span class="k">Book</span><span class="v num">${c.book.length} of ${CFG.maxBook} sellers</span></div>
      <div class="kv"><span class="k">Room for</span><span class="v num">${c.slots} more seller${c.slots===1?'':'s'}</span></div>
    </div>
    <div class="banner ${c.free<=0?'bn-red':c.state==='tight'?'bn-amber':'bn-green'}" style="margin-top:12px">
      ${ic(c.free<=0?'warn':'spark',15)}
      <div><b>${c.binding==='time'?'Time is the binding constraint':'The book ceiling is the binding constraint'}.</b>

      ${c.binding==='time'
        ? `You have ${Math.round(c.free/60)} h uncommitted and ${c.headroom} seat${c.headroom===1?'':'s'} free — the hours run out first, at ${c.slots} more seller${c.slots===1?'':'s'}.`
        : `You have ${Math.round(c.free/60)} h uncommitted, enough for ${c.slotsByTime} more, but only ${c.headroom} seat${c.headroom===1?'':'s'} left under the ${CFG.maxBook}-seller ceiling.`}</div>

function distBar(list){
  const n=list.length||1;

  const seg=[['critical','#DC2626'],['risk','#F59E0B'],['healthy','#3B82F6'],['thriving','#2B8A3E']];
  return `<div class="dist">${seg.map(([k,c])=>{const v=g(k); if(!v) return '';
    return `<span style="background:${c};width:${v/n*100}%" title="${band({critical:10,risk:50,healthy:70,thriving:90}[k]).label}: ${v}">${v/n>0.07?v:''}</span>`;}).join('')}</div>
    <div class="legend-t">${seg.map(([k,c])=>`<span><i style="background:${c}"></i>${BANDS.find(b=>b.k===k).label} ${g(k)}</span>`).join('')}</div>`;

}

            ${avatar(s)}

/* =============== Portfolio =============== */
function sortSellers(list){
  const f={health:(a,b)=>health(a)-health(b),
    name:(a,b)=>a.biz.localeCompare(b.biz),
    orders:(a,b)=>thisWeek(b)-thisWeek(a),
    contact:(a,b)=>new Date(a.lastContactAt)-new Date(b.lastContactAt),
    tasks:(a,b)=>openTasks(b).length-openTasks(a).length,
    stage:(a,b)=>lifeIx(a.stage)-lifeIx(b.stage)}[S.sort] || ((a,b)=>health(a)-health(b));
  return list.slice().sort(f);
}

  if(S.q){ const q=S.q.toLowerCase();

  <div class="tbl-wrap"><div class="tbl-scroll"><table class="data">
    <thead><tr>
      <th>Seller</th><th>Health</th><th>Stage</th><th>Orders · 8 weeks</th>
      <th>Delivery</th><th>Returns</th><th>Last contact</th><th>Open tasks</th>${showAM?'<th>AM</th>':''}
    </tr></thead>
    <tbody>${list.length?list.map(s=>{const own=mine(s), ot=openTasks(s), b=band(health(s));
      return `<tr class="${own?'own-me':'ro'}" onclick="go('#/seller/${s.id}')">
        <td><div class="cell-name">${avatar(s)}
          <div><div class="nm">${esc(s.biz)}</div>
            <div class="tiny muted">${esc(s.owner)} · ${place(s)}</div></div></div></td>
        <td><div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:17px;font-weight:800;color:${b.color};font-variant-numeric:tabular-nums">${health(s)}</span>
          ${hbPill(s)}</div></td>
        <td>${stagePill(s)}</td>
        <td><div style="display:flex;align-items:center;gap:9px">${sparkline(s)}
          <div><div class="num" style="font-weight:700">${thisWeek(s)}</div>${trendChip(s)}</div></div></td>
        <td>${s.totalOrders===0?'<span class="muted tiny">no parcels yet</span>'
          :`<div class="meter"><div class="track"><i style="width:${Math.min(100,s.deliveryRate/50*100)}%;background:${s.deliveryRate>=CFG.deliveryTarget?'#2B8A3E':'#F59E0B'}"></i></div>
          <span class="v">${s.deliveryRate}%</span></div>`}</td>
        <td>${rateCell(s,s.returnRate,s.returnRate>CFG.returnAlertPct?'#B42318':s.returnRate>CFG.returnTarget?'#B45309':'#2B8A3E')}</td>
        <td><span class="tiny ${ago(s.lastContactAt)>=14?'':'muted'}" style="${ago(s.lastContactAt)>=14?'color:#B45309;font-weight:600':''}">${ago(s.lastContactAt)===0?'Today':ago(s.lastContactAt)+' d ago'}</span></td>
        <td>${ot.length?`<span class="chip" style="background:${ot.some(t=>days(t.dueAt)<0)?'var(--red-soft2)':'var(--line2)'};color:${ot.some(t=>days(t.dueAt)<0)?'#B42318':'#374151'}">${ot.length} open</span>`:`<span class="muted tiny">—</span>`}</td>
        ${showAM?`<td>${amAvatar(s.amId)}</td>`:''}
      </tr>`;}).join('')
      :`<tr><td colspan="9"><div class="empty">${ic('search',26)}<div style="margin-top:8px">No sellers match this view.</div></div></td></tr>`}
    </tbody></table></div>
    <div class="tbl-foot">${ic('shield',13)} Sellers outside your book are read-only — you can open them and add an internal note, nothing more.
      <span style="flex:1"></span>${list.length} of ${S.sellers.length}</div>
  </div>`;
}
function runSweep(){ let n=0; S.sellers.forEach(s=>{ n+=runRules(s).length; }); save(); render();
  toast(n?`${n} task${n===1?'':'s'} opened by the rule engine`:'Rules ran — nothing new to open','ok'); }
</script>
<script>
/* =============== seller workspace =============== */
function viewSeller(id){
  const s=seller(id); if(!s) return `<div class="empty">Seller not found.</div>`;
  const own=canEdit(s), h=healthOf(s), ot=openTasks(s);
  return `
  <div class="page-head">
    <button class="back-btn" onclick="history.back()">${ic('back',15)}</button>
    <div><h1 class="page-title">${esc(s.biz)}</h1>
      <div class="page-sub">${esc(s.code)} · ${esc(s.owner)} · ${place(s)} · ${esc(s.cat)}</div></div>
    <span class="head-sp"></span>
    ${winChip(s)}
    ${act('Log a call','phone',`callNow('${s.id}')`,own,'You can only log activity on sellers in your own book.')}
    ${act('Open task','plus',`newTask('${s.id}')`,own,'Only the owning account manager can open a task on this seller.')}
  </div>

  ${own?'':`<div class="lockbar" style="margin-bottom:14px">${ic('shield',15)}
    <div><b>${esc(am(s.amId).name)}</b> owns this account. You can read everything and leave an internal note — replies, tasks and lifecycle changes belong to the owner.</div>
    <span style="flex:1"></span>
    <button class="btn btn-ghost btn-sm" onclick="requestTransfer('${s.id}')">${ic('swap',12)} Request transfer</button></div>`}

  <div class="split">
    <div>
      <div class="card" style="margin-bottom:16px">
        <div class="shead">
          ${ring(s)}
          <div class="idb">
            <h2>${esc(s.biz)}</h2>
            <div class="sub">${hbPill(s)} ${stagePill(s)}
              <span class="chip">${ic('phone',10)} ${esc(s.phone)}</span></div>
            <div class="tiny muted" style="margin-top:8px">${esc(band(h.score).act)} · account manager ${esc(am(s.amId).name)} · day ${ageDays(s)}</div>
          </div>
        </div>
        <div class="lcrail" style="margin-top:16px">
          ${LIFE.filter(l=>l.k!=='churned'||s.stage==='churned').map(l=>{
            const i=lifeIx(l.k), c=lifeIx(s.stage);
            const cls=l.k===s.stage?(l.k==='atrisk'?'bad':l.k==='churned'?'churn':'now'):i<c?'done':'';
            return `<div class="lcs ${cls}" title="${esc(l.note)} (${l.dur})">
              <span class="b">${i<c?ic('check',11):l.k===s.stage?ic('target',11):''}</span>
              <span class="l">${l.label}</span></div>`;}).join('')}
        </div>
        <div class="banner bn-slate tiny" style="margin-top:12px">${ic('shield',14)}
          <div>${esc(life(s.stage).note)} Typical duration ${life(s.stage).dur}.
          ${s.stage==='pending'?'':`Lifecycle is derived from orders and health — it is not a field anyone types into.`}</div></div>
      </div>

      <div class="card" style="margin-bottom:16px">
        <div class="card-h">${ic('gauge',16)}<h3>Health ${h.score} — ${band(h.score).label}</h3><span class="sp"></span>
          <span class="tiny muted">recomputed daily 02:00 UTC</span></div>
        ${h.comps.map(c=>`<div class="hcomp ${c.off?'off':''}">
          <span class="w num">${c.w}%</span>
          <div class="nm">${c.label}<div class="why">${esc(c.why)}</div></div>
          <div class="track"><i style="width:${c.off?100:c.score}%;background:${c.off?'':band(c.score).color}"></i></div>
          <span class="sc" style="color:${c.off?'var(--muted2)':band(c.score).color}">${c.off?'n/a':c.score}</span>
        </div>`).join('')}
        ${!CFG.engagementLive?`<div class="banner bn-amber tiny" style="margin-top:12px">${ic('warn',14)}
          <div><b>Running on the fallback weighting.</b> Seller Activity Tracking (F5) is not live, so Engagement has no data source.
          Its ${CFG.wEngagement} points are redistributed to Order Activity and Delivery, exactly as the specification requires — the score is never computed on a partial denominator.</div></div>`:''}
      </div>

      <div class="card" style="margin-bottom:16px">
        <div class="card-h">${ic('chart',16)}<h3>The numbers</h3><span class="sp"></span>
          <span class="tiny muted">last 8 weeks</span></div>
        <div class="mg">
          <div><div class="k">This week</div><div class="v num">${thisWeek(s)}</div><div class="s">${trendChip(s)} vs 4 wks</div></div>
          <div><div class="k">Last 30 days</div><div class="v num">${recent4(s)}</div><div class="s">was ${prior4(s)}</div></div>
          <div><div class="k">Lifetime</div><div class="v num">${s.totalOrders.toLocaleString('en-US')}</div><div class="s">orders</div></div>
          <div><div class="k">Delivery</div><div class="v num ${s.deliveryRate>=CFG.deliveryTarget?'good':s.deliveryRate>=CFG.deliveryTarget-8?'warn':'bad'}">${s.deliveryRate}%</div><div class="s">target ${CFG.deliveryTarget}%</div></div>
          <div><div class="k">Returns</div><div class="v num ${s.returnRate<=CFG.returnTarget?'good':s.returnRate>CFG.returnAlertPct?'bad':'warn'}">${s.returnRate}%</div><div class="s">target ${CFG.returnTarget}%</div></div>
          <div><div class="k">Cancelled</div><div class="v num ${s.cancelRate<=CFG.cancelTarget?'good':'warn'}">${s.cancelRate}%</div><div class="s">target ${CFG.cancelTarget}%</div></div>
          <div><div class="k">Wallet</div><div class="v num ${s.wallet<0?'bad':''}">${money(s.wallet)}</div><div class="s">${s.wallet<0?s.walletNegDays+' d negative':'settled'}</div></div>
          <div><div class="k">Catalogue</div><div class="v num">${s.products}</div><div class="s">${s.markets.length} market${s.markets.length>1?'s':''}</div></div>
          <div><div class="k">Open tickets</div><div class="v num ${s.openTickets>=CFG.ticketAlert?'bad':''}">${s.openTickets}</div><div class="s">support</div></div>
        </div>
        <div class="tiny muted" style="margin-top:10px">${ic('shield',12)} Read-only. Orders, parcels and wallet come from the platform — the Account Manager role has no write access to any of them.</div>
      </div>

      ${ageDays(s)<=45 || pbProgress(s).done<PB.length ? pbCard(s,own):''}

      <div class="card" style="margin-bottom:16px">
        <div class="card-h">${ic('list',16)}<h3>Open work</h3>
          <span class="chip">${ot.length}</span><span class="sp"></span>
          ${act('New task','plus',`newTask('${s.id}')`,own,'Only the owner can open a task.')}</div>
        ${ot.length? ot.map(t=>sellerTask(s,t,own)).join('')
          : `<div class="empty tiny">${ic('check',22)}<div style="margin-top:6px">No open work on this account.</div></div>`}
        ${s.tasks.filter(t=>t.done).length?`<details style="margin-top:10px"><summary class="tiny muted" style="cursor:pointer">
          ${s.tasks.filter(t=>t.done).length} completed</summary>
          <div style="margin-top:9px">${s.tasks.filter(t=>t.done).slice(0,6).map(t=>`
            <div class="task done p-${t.prio}"><span class="ti">${ic('check',15)}</span>
              <div><div class="t">${esc(t.title)}</div>
                <div class="s">Completed ${rel(t.doneAt||t.createdAt).toLowerCase()}${t.outcome?` — ${esc(t.outcome)}`:''}</div></div></div>`).join('')}
          </div></details>`:''}
      </div>

      <div class="card">
        <div class="card-h">${ic('clock',16)}<h3>Account history</h3></div>
        <div class="tl">${s.tl.slice(0,12).map(e=>`<div class="tl-item">
          <span class="tl-dot ${e.type==='call'?'green':e.type==='task'?'blue':e.type==='churn'?'red':''}">${ic(tlIco(e.type),11)}</span>
          <div class="tl-t">${esc(e.title)}</div>
          ${e.body?`<div class="tl-b">${esc(e.body)}</div>`:''}
          <div class="tl-m">${fmtT(e.at)}${e.by?' · '+esc(e.by):''}</div></div>`).join('')}</div>
      </div>
    </div>

    ${convPane(s,own)}
  </div>`;
}
const tlIco = t => ({assign:'user',call:'phone',qbr:'chart',task:'list',note:'file',msg:'chat',churn:'warn',stage:'target',escalate:'up'})[t]||'spark';

function sellerTask(s,t,own){
  const T=TASKTYPE[t.type], n=days(t.dueAt);
  const A=t.alertKey?ALERTS[t.alertKey]:null;
  return `<div class="task p-${t.prio}">
    <span class="ti">${ic(T.ico,15)}</span>
    <div style="flex:1;min-width:0">
      <div class="t">${esc(t.title)}</div>
      <div class="s">${esc(t.why)}</div>
      <div class="m">
        <span class="ttype ${T.cls}">${T.label}</span>${dueChip(t)}
        <span class="chip">${T.mins} min</span>
        ${t.escalated?`<span class="chip" style="background:var(--red-soft2);color:#B42318">${ic('up',10)} escalated</span>`:''}
      </div>
      ${A?`<div class="esc" style="margin-top:8px">${ic('shield',12)} Escalation:
        ${A.esc.map((e,i)=>`<span class="escstep ${i&&n<0?'hot':''}">${esc(e)}</span>`).join(ic('chev',10))}</div>`:''}
      <div class="comp-row" style="margin-top:9px">
        ${act('Complete','check',`completeTask('${s.id}','${t.id}')`,own,'Only the owner can close this task.','btn-green')}
        ${act('Escalate','up',`escalateTask('${s.id}','${t.id}')`,own&&!t.escalated,t.escalated?'Already escalated.':'Only the owner can escalate.')}
        ${act('Push 1 day','clock',`snoozeTask('${s.id}','${t.id}')`,own,'Only the owner can reschedule.')}
      </div>
    </div>
  </div>`;
}

function pbCard(s,own){
  const st=pbState(s), p=pbProgress(s), age=ageDays(s);
  return `<div class="card" style="margin-bottom:16px">
    <div class="card-h">${ic('book',16)}<h3>First 30 days</h3>
      <span class="chip">day ${age}</span><span class="sp"></span>
      <span class="tiny muted">${p.done} of ${p.total}${p.late?` · ${p.late} late`:''}</span></div>
    <div class="bar" style="margin-bottom:12px"><i style="width:${p.done/p.total*100}%;background:${p.late?'#F59E0B':'#2B8A3E'}"></i></div>
    ${st.map(x=>`<div class="pbrow ${x.done?'done':''} ${x.late?'late':''} ${x.now&&!x.done?'now':''}"
        onclick="${own?`togglePb('${s.id}','${x.k}')`:`toast('Only the owning account manager can tick a playbook step')`}">
      <span class="dn"><span class="d">Day</span><span class="v">${x.day}</span></span>
      <span class="bx">${x.done?ic('check',12):''}</span>
      <div style="flex:1;min-width:0">
        <div class="t">${x.t}</div><div class="s">${x.s}</div>
        ${x.gateLbl?`<span class="gate ${x.gateOk?'ok':'no'}">${ic(x.gateOk?'check':'x',10)} ${x.gateLbl}${x.gateOk?' met':' not met'}</span>`:''}
        ${x.late&&!x.done?`<span class="gate no" style="margin-left:5px">${ic('warn',10)} ${age-x.day} days late</span>`:''}
      </div>
    </div>`).join('')}
    <div class="banner bn-blue tiny" style="margin-top:10px">${ic('spark',14)}
      <div>Each step opens its own task on the day it comes due — rule <code>r10</code>. The gates are read from the seller's own record, so a step cannot be ticked into looking complete when the underlying number says otherwise.</div></div>
  </div>`;
}
</script>
<script>
/* =============== conversation — the OmniDesk thread, docked =============== */
function convPane(s,own){
  const st=winState(s), shut=st==='shut';
  const collide = s.id===S.sellers.filter(x=>x.amId!==ME)[3]?.id;
  return `<div class="pane">
    <div class="pane-h">
      <span class="chdot ${CHAN[s.channel].cls}">${ic(CHAN[s.channel].ico,10)}</span>
      <h3>Conversation ${esc(s.code.replace('MDM-S','MDM-C'))}</h3>
      <span class="chip">${CHAN[s.channel].label}</span>
      <span class="sp"></span>
      <button class="btn btn-ghost btn-sm" onclick="toast('Opens this same conversation in the full OmniDesk workspace — one conversation, two views')">
        ${ic('link',12)} Open in OmniDesk</button>
    </div>
    <div class="collide" style="background:#EEF2FF;color:#3730A3;border-color:#C7D2FE">
      ${ic('phone',13)} Your business number <b style="margin:0 4px">${esc(am(s.amId).number)}</b> — every seller in this book messages the same line, so the thread is continuous.
    </div>
    ${collide?`<div class="collide">${ic('users',13)} ${esc(am(s.amId).name)} is viewing this conversation right now.</div>`:''}
    <div class="conv">
      <div style="padding:10px 13px 0">
        <div class="winbar ${shut?'shut':'open'}">
          ${ic(shut?'clock':'wa',15)}
          <span>${shut?'WhatsApp window closed — free-form replies are blocked. Approved templates only.'
                     :`WhatsApp window open — ${winText(s)}. Free-form replies allowed.`}</span>
          <span class="sp"></span>
          ${shut&&own?`<button class="btn btn-sm" style="background:#78350F;color:#fff" onclick="openTemplates('${s.id}')">Choose a template</button>`:''}
        </div>
      </div>
      <div class="thread" id="thread">
        ${s.msgs.length?threadHTML(s):`<div class="empty tiny">No messages yet on this conversation.</div>`}
      </div>
      ${composer(s,own,shut)}
    </div>
  </div>`;
}
function threadHTML(s){
  let out='', lastDay=null;
  s.msgs.slice().sort((a,b)=>new Date(a.at)-new Date(b.at)).forEach(m=>{
    const dk=new Date(m.at).toDateString();
    if(dk!==lastDay){ lastDay=dk; out+=`<div class="daysep">${days(m.at)===0?'Today':days(m.at)===-1?'Yesterday':fmt(m.at)}</div>`; }
    out+=msgHTML(s,m);
  });
  return out;
}
function msgHTML(s,m){
  if(m.kind==='note') return `<div class="msg note"><div><div class="bubble">${ic('file',11)} <b>Internal note</b> — ${esc(m.body)}</div>
    <div class="meta">${fmtHM(m.at)} · ${esc(am(s.amId).name)} · not visible to the seller</div></div></div>`;
  if(m.kind==='call') return `<div class="msg call"><div><div class="bubble">${ic('phone',12)} ${esc(m.body)}</div>
    <div class="meta">${fmtHM(m.at)} · Yeastar</div></div></div>`;
  if(m.kind==='sys') return `<div class="msg sys"><div class="bubble">${esc(m.body)}</div></div>`;
  const isTpl=m.kind==='tpl';
  const body=isTpl?renderTpl(m.body,s):m.body;
  const ar=/[؀-ۿ]/.test(body);
  const st={sent:'Sent',delivered:'Delivered',read:'Read',failed:'Failed'}[m.state]||'';
  return `<div class="msg ${m.dir}">
    ${chDot(m.ch)}
    <div><div class="bubble">${isTpl?`<span class="tplmark">${ic('file',9)} template · ${esc(m.body)}</span><br>`:''}
      <span ${ar?'class="ar" dir="rtl"':''}>${esc(body)}</span></div>
      <div class="meta">${fmtHM(m.at)}${m.dir==='out'?` · ${st}${isTpl?' · billable':''}`:''}</div></div>
  </div>`;
}
function composer(s,own,shut){
  if(!own) return `<div class="composer">
    <div class="comp-tabs"><button class="on">Internal note</button></div>
    <div class="comp-box note">You can add an internal note on any seller. Replies belong to the owning account manager.</div>
    <div class="comp-row"><span class="sp"></span>
      <button class="btn btn-ghost btn-sm" onclick="addNote('${s.id}')">${ic('file',12)} Add note</button></div></div>`;
  const isNote=S.compTab==='note';
  return `<div class="composer">
    <div class="comp-tabs">
      <button class="${isNote?'':'on'}" onclick="S.compTab='reply';render()">Reply to seller</button>
      <button class="${isNote?'on':''}" onclick="S.compTab='note';render()">Internal note</button>
    </div>
    ${isNote?`<div class="comp-box note">Visible to the account management team only — never to the seller.</div>
      <div class="comp-row"><span class="tiny muted">${ic('shield',11)} Notes are excluded from every seller-facing view by construction.</span>
        <span class="sp"></span><button class="btn btn-dark btn-sm" onclick="addNote('${s.id}')">${ic('file',12)} Save note</button></div>`
    : shut?`<button class="tplbtn" onclick="openTemplates('${s.id}')">${ic('file',14)} Window closed — pick an approved template</button>
        <div class="comp-row"><span class="tiny muted">${ic('shield',11)} The block is enforced server-side, not just in this composer.</span>
          <span class="sp"></span><button class="btn btn-ghost btn-sm" onclick="callNow('${s.id}')">${ic('phone',12)} Call instead</button></div>`
    :`<div class="comp-box ${S.draft?'filled':''}" contenteditable="true" role="textbox" aria-label="Reply"
         oninput="S.draft=this.textContent">${esc(S.draft)||'Write a reply…'}</div>
      <div class="comp-row">
        <button class="btn btn-ghost btn-sm" onclick="openMacros('${s.id}')">${ic('spark',12)} Macro</button>
        <button class="btn btn-ghost btn-sm" onclick="callNow('${s.id}')">${ic('phone',12)} Call</button>
        <span class="sp"></span>
        <span class="tiny muted">${winText(s)}</span>
        <button class="btn btn-red btn-sm" onclick="sendReply('${s.id}')">${ic('check',12)} Send</button>
      </div>`}
  </div>`;
}

/* =============== actions =============== */
function sendReply(id){ const s=seller(id), body=(S.draft||'').trim();
  if(!body) return toast('Nothing to send');
  addMsg(s,{dir:'out',ch:s.channel,kind:'text',body,state:'sent'});
  push(s,'msg','Reply sent on '+CHAN[s.channel].label, body.slice(0,90));
  S.draft=''; save(); render(); toast('Sent — undo available for 10 seconds','ok'); }

function addNote(id){ openModal(`<div class="modal-h">${ic('file',18)}<h3>Internal note</h3><span style="flex:1"></span>
    <button class="tb-btn" onclick="closeModal()">${ic('x',16)}</button></div>
  <div class="modal-b"><textarea class="fi" id="m-note" placeholder="What you learned, what you promised…" style="min-height:110px"></textarea>
    <div class="banner bn-slate tiny" style="margin-top:12px">${ic('shield',14)}<div>Never shown to the seller. Searchable by the team.</div></div></div>
  <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-dark" onclick="saveNote('${id}')">Save note</button></div>`); }
function saveNote(id){ const s=seller(id), v=(document.getElementById('m-note')||{}).value||'';
  if(v.trim()){ addMsg(s,{dir:'out',ch:'note',kind:'note',body:v.trim()});
    push(s,'note','Internal note added',v.slice(0,90)); save(); }
  closeModal(); render(); toast('Note saved','ok'); }

function callNow(id){ const s=seller(id), ot=openTasks(s);
  openModal(`<div class="modal-h">${ic('phone',18)}<h3>Call ${esc(s.owner)}</h3><span style="flex:1"></span>
      <button class="tb-btn" onclick="closeModal()">${ic('x',16)}</button></div>
    <div class="modal-b">
      <div class="banner bn-blue" style="margin-bottom:14px">${ic('phone',15)}
        <div>Click-to-call dials <b class="num">${esc(s.phone)}</b> from your line <b class="num">${esc(am(s.amId).number)}</b> through Yeastar.
        The call attaches to this conversation automatically and its minutes come off your week.</div></div>
      ${ot.length?`<label class="fl">Which task is this call for</label>
        <select class="fi" id="m-task">
          <option value="">Not against a task</option>
          ${ot.map(t=>`<option value="${t.id}">${esc(t.title)} · ${TASKTYPE[t.type].label} · ${TASKTYPE[t.type].mins} min</option>`).join('')}
        </select>`:''}
      <div class="eyebrow" style="margin:16px 0 8px">Outcome</div>
      ${opt('choice','done','Answered — objective met','Closes the selected task and logs the minutes.')}
      ${opt('choice','partial','Answered — needs a follow-up','Task stays open, due date moves to tomorrow.')}
      ${opt('choice','no_answer','No answer','Task stays open, retry tomorrow.')}
      ${opt('choice','escalate','Answered — beyond what I can fix','Escalates to the next owner on the ladder.')}
      <label class="fl">Wrap-up note</label>
      <textarea class="fi" id="m-note" placeholder="What was said, what you promised…"></textarea>
    </div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-red" id="modal-go" disabled onclick="saveCall('${id}')">Log outcome</button></div>`);
  M={choice:null}; }
function saveCall(id){ const s=seller(id), note=(document.getElementById('m-note')||{}).value||'';
  const tid=(document.getElementById('m-task')||{}).value||'', o=M.choice;
  const t=tid?s.tasks.find(x=>x.id===tid):null;
  const mins=t?TASKTYPE[t.type].mins:20;
  addMsg(s,{dir:'out',ch:'voice',kind:'call',
    body:o==='no_answer'?'Outbound call · 0:00 · no answer':`Outbound call · ${mins}:00 · answered`});
  if(note) addMsg(s,{dir:'out',ch:'note',kind:'note',body:note});
  s.lastContactAt=iso(new Date());
  if(o==='no_answer'){ push(s,'call','Call — no answer','Retry tomorrow.');
    if(t) t.dueAt=iso(d(1));
    toast('No answer logged — retry set for tomorrow','warn'); }
  else if(o==='done'){ push(s,'call','Call completed',note||'Objective met.');
    if(t) finish(s,t,'Resolved on the call');
    if(!s.welcomeCallAt && ['new','onboarding'].includes(s.stage)){ s.welcomeCallAt=iso(new Date()); s.pb.d1=true; s.pb.d0=true;
      if(s.stage==='new') s.stage='onboarding';
      push(s,'stage','Welcome call logged — stage moved to Onboarding',`Within ${Math.round(ago(s.assignedAt)*24)} h of assignment, SLA is ${CFG.welcomeCallH} h.`); }
    toast('Call logged','ok'); }
  else if(o==='partial'){ push(s,'call','Call completed — follow-up needed',note||'');
    if(t) t.dueAt=iso(d(1));
    toast('Follow-up set for tomorrow','ok'); }
  else { push(s,'call','Call completed — escalated',note||'');
    if(t) doEscalate(s,t); toast('Escalated','warn'); }
  save(); closeModal(); render(); }

function completeTask(sid,tid){ const s=seller(sid), t=s.tasks.find(x=>x.id===tid);
  M={ready:()=>true};
  openModal(`<div class="modal-h">${ic('check',18)}<h3>Complete task</h3><span style="flex:1"></span>
      <button class="tb-btn" onclick="closeModal()">${ic('x',16)}</button></div>
    <div class="modal-b">
      <div class="banner bn-slate" style="margin-bottom:14px">${ic('list',15)}
        <div><b>${esc(t.title)}</b><br><span class="tiny">${esc(t.why)}</span></div></div>
      <label class="fl">What happened</label>
      <textarea class="fi" id="m-note" placeholder="One line — this is what the next person reads."></textarea>
      <div class="banner bn-blue tiny" style="margin-top:12px">${ic('shield',14)}
        <div>Closing this releases ${TASKTYPE[t.type].mins} minutes back into your week. If the underlying condition is still true, the rule reopens the task on the next sweep — closing it does not hide the problem.</div></div>
    </div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-green" onclick="doComplete('${sid}','${tid}')">Complete</button></div>`); }
function doComplete(sid,tid){ const s=seller(sid), t=s.tasks.find(x=>x.id===tid);
  const note=(document.getElementById('m-note')||{}).value||'';
  finish(s,t,note); closeModal(); save(); render(); toast('Task completed','ok'); }
function finish(s,t,outcome){ t.done=true; t.doneAt=iso(new Date()); t.outcome=outcome||'';
  if(t.ruleId&&t.ruleId.startsWith('pb_')) s.pb[t.ruleId.slice(3)]=true;
  if(t.type==='qbr') s.lastQbrAt=iso(new Date());
  if(t.type==='welcome'&&!s.welcomeCallAt) s.welcomeCallAt=iso(new Date());
  push(s,'task','Task completed — '+t.title, outcome||''); }

function escalateTask(sid,tid){ const s=seller(sid), t=s.tasks.find(x=>x.id===tid);
  const A=t.alertKey?ALERTS[t.alertKey]:null;
  openModal(`<div class="modal-h">${ic('up',18)}<h3>Escalate</h3><span style="flex:1"></span>
      <button class="tb-btn" onclick="closeModal()">${ic('x',16)}</button></div>
    <div class="modal-b">
      <div class="banner bn-amber" style="margin-bottom:14px">${ic('warn',15)}
        <div>Escalation moves ownership of the <b>problem</b>, not of the seller. You stay the account manager and the seller keeps messaging your line.</div></div>
      ${A?`<div class="eyebrow" style="margin-bottom:8px">Ladder for ${A.label}</div>
        <div class="esc" style="margin-bottom:14px">${A.esc.map((e,i)=>`<span class="escstep ${i?'hot':''}">${esc(e)}</span>`).join(ic('chev',10))}</div>`:''}
      <label class="fl">Why this is beyond the account manager</label>
      <textarea class="fi" id="m-note" placeholder="Be specific — the next owner reads only this."></textarea>
    </div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-red" onclick="doEscalateUI('${sid}','${tid}')">Escalate</button></div>`); }
function doEscalateUI(sid,tid){ const s=seller(sid), t=s.tasks.find(x=>x.id===tid);
  doEscalate(s,t,(document.getElementById('m-note')||{}).value||''); closeModal(); save(); render(); toast('Escalated — the next owner is notified','warn'); }
function doEscalate(s,t,why){ t.escalated=true; t.prio='urgent';
  const A=t.alertKey?ALERTS[t.alertKey]:null;
  push(s,'escalate','Escalated — '+(A?A.esc[1]||A.esc[0]:'next owner'), why||'');
  AUDIT.unshift({at:iso(new Date()), who:am(ME).name, what:`escalated <code>${s.code}</code> — ${esc(t.title)}`}); }

function snoozeTask(sid,tid){ const s=seller(sid), t=s.tasks.find(x=>x.id===tid);
  t.dueAt=iso(d(days(t.dueAt)+1)); push(s,'task','Task pushed one day — '+t.title,'');
  save(); render(); toast('Pushed to '+fmt(t.dueAt)); }

function newTask(sid){ const s=seller(sid); M={choice:null,prio:'normal',ready:()=>!!M.choice};
  openModal(`<div class="modal-h">${ic('plus',18)}<h3>Open a task on ${esc(s.biz)}</h3><span style="flex:1"></span>
      <button class="tb-btn" onclick="closeModal()">${ic('x',16)}</button></div>
    <div class="modal-b">
      <div class="banner bn-blue" style="margin-bottom:14px">${ic('shield',15)}
        <div>This is the same <code>am_task</code> ticket type the rules open. Everything the account management team used to keep in a separate tracker lives here, on the seller it belongs to.</div></div>
      <div class="eyebrow" style="margin-bottom:8px">Type</div>
      ${Object.entries(TASKTYPE).map(([k,t])=>opt('choice',k,t.label,`${t.mins} minutes booked against your week.`)).join('')}
      <label class="fl">Title</label>
      <input class="fi" id="m-title" placeholder="What needs doing">
      <label class="fl">Why</label>
      <textarea class="fi" id="m-why" placeholder="Context for whoever picks this up"></textarea>
      <label class="fl">Due in</label>
      <select class="fi" id="m-due">
        <option value="0">Today</option><option value="1">Tomorrow</option>
        <option value="3">3 days</option><option value="7" selected>A week</option><option value="14">Two weeks</option>
      </select>
      <label class="fl">Priority</label>
      <div class="slots">${Object.entries(PRIO).map(([k,l])=>
        `<button class="slot" data-g="prio" data-v="${k}" onclick="pick('prio','${k}')">${l}</button>`).join('')}</div>
    </div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-red" id="modal-go" disabled onclick="saveTask('${sid}')">Open task</button></div>`);
  setTimeout(()=>pick('prio','normal'),0); }
function saveTask(sid){ const s=seller(sid);
  const title=(document.getElementById('m-title')||{}).value||TASKTYPE[M.choice].label+' — '+s.biz;
  const why=(document.getElementById('m-why')||{}).value||'Opened by '+am(ME).name+'.';
  const due=+(document.getElementById('m-due')||{}).value||0;
  s.tasks.unshift({id:'T'+(++TASKSEQ), type:M.choice, title, why, prio:M.prio||'normal',
    createdAt:iso(new Date()), dueAt:iso(d(due)), done:false, ruleId:null});
  push(s,'task','Task opened — '+title,why);
  closeModal(); save(); render(); toast('Task opened','ok'); }

function togglePb(sid,k){ const s=seller(sid), st=pbState(s).find(x=>x.k===k);
  if(!s.pb[k] && !st.gateOk && st.gateLbl)
    return toast(`Cannot tick “${st.t}” — ${st.gateLbl} is not met on this account`,'warn');
  s.pb[k]=!s.pb[k];
  if(k==='d1'&&s.pb[k]&&!s.welcomeCallAt) s.welcomeCallAt=iso(new Date());
  push(s,'task',(s.pb[k]?'Playbook step completed — ':'Playbook step reopened — ')+st.t,'');
  save(); render(); }

function requestTransfer(id){ const s=seller(id);
  openModal(`<div class="modal-h">${ic('swap',18)}<h3>Request transfer</h3><span style="flex:1"></span>
      <button class="tb-btn" onclick="closeModal()">${ic('x',16)}</button></div>
    <div class="modal-b">
      <div class="banner bn-amber" style="margin-bottom:14px">${ic('warn',15)}
        <div>Reassigning an account breaks a relationship the seller has already built. It needs the Head of Account Management, and it is never automatic — even when the rule engine can see that the books are unbalanced.</div></div>
      <div class="kv"><span class="k">Seller</span><span class="v">${esc(s.biz)} · ${esc(s.code)}</span></div>
      <div class="kv"><span class="k">Current owner</span><span class="v">${esc(am(s.amId).name)}</span></div>
      <div class="kv"><span class="k">Your book</span><span class="v">${book().length} of ${CFG.maxBook}</span></div>
      <label class="fl">Reason</label>
      <textarea class="fi" id="m-note" placeholder="Language, market, existing relationship…"></textarea>
    </div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-red" onclick="closeModal();toast('Transfer request sent to the Head of Account Management','ok')">Send request</button></div>`); }
</script>
<script>
/* =============== templates & macros =============== */
function openTemplates(id){ const s=seller(id); M={choice:null,ready:()=>!!M.choice};
  openModal(`<div class="modal-h">${ic('file',18)}<h3>Approved templates</h3><span style="flex:1"></span>
      <button class="tb-btn" onclick="closeModal()">${ic('x',16)}</button></div>
    <div class="modal-b">
      <div class="banner bn-amber" style="margin-bottom:14px">${ic('clock',15)}
        <div>The 24-hour window on this conversation is closed, so only a Meta-approved template can leave the platform.
        Each send is billed by Meta, so the template list is short on purpose.</div></div>
      ${TEMPLATES.map(t=>`<div class="tpl-item" data-g="choice" data-v="${t.key}" onclick="pick('choice','${t.key}')">
        <span class="radio" style="width:18px;height:18px;flex:0 0 18px;border:2px solid #CBD5E1;border-radius:50%;margin-top:2px"></span>
        <div style="flex:1"><div class="t" style="font-size:13px;font-weight:600">${esc(t.title)}</div>
          <div class="k">${esc(t.key)} · ${esc(t.cat)}</div>
          <div class="tpl-body">${esc(renderTpl(t.key,s))}</div></div></div>`).join('')}
    </div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-red" id="modal-go" disabled onclick="sendTemplate('${id}')">Send template</button></div>`,true); }
function sendTemplate(id){ const s=seller(id), k=M.choice;
  addMsg(s,{dir:'out',ch:'whatsapp',kind:'tpl',body:k,state:'sent'});
  push(s,'msg','Template sent — '+k, renderTpl(k,s).slice(0,90));
  closeModal(); save(); render(); toast('Template sent — billable','ok'); }

function openMacros(id){ const s=seller(id); M={choice:null,ready:()=>!!M.choice};
  openModal(`<div class="modal-h">${ic('spark',18)}<h3>Macros</h3><span style="flex:1"></span>
      <button class="tb-btn" onclick="closeModal()">${ic('x',16)}</button></div>
    <div class="modal-b">
      <div class="banner bn-slate tiny" style="margin-bottom:14px">${ic('shield',14)}
        <div>A macro applies internal changes and writes a note. It never sends anything to the seller by itself — that is what templates and replies are for.</div></div>
      ${MACROS.map(m=>`<div class="macro" data-g="choice" data-v="${m.key}" onclick="pick('choice','${m.key}')">
        <span class="mi">${ic(m.ico,15)}</span>
        <div style="flex:1"><div class="t">${esc(m.title)}</div>
          <div class="does">${m.does.map(x=>`<span>${esc(x)}</span>`).join('')}</div></div>
        <span class="radio" style="width:18px;height:18px;flex:0 0 18px;border:2px solid #CBD5E1;border-radius:50%;margin-top:6px"></span></div>`).join('')}
    </div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-dark" id="modal-go" disabled onclick="applyMacro('${id}')">Apply macro</button></div>`,true); }
function applyMacro(id){ const s=seller(id), m=MACROS.find(x=>x.key===M.choice);
  addMsg(s,{dir:'out',ch:'note',kind:'note',body:m.note});
  push(s,'note','Macro — '+m.title, m.note);
  const t=openTasks(s)[0];
  if(m.key==='x_welcome_done'){ s.welcomeCallAt=iso(new Date()); s.pb.d0=true; s.pb.d1=true;
    if(s.stage==='new') s.stage='onboarding';
    const w=openTasks(s).find(x=>x.type==='welcome'); if(w) finish(s,w,'Welcome call completed'); }
  if(m.key==='x_intervention'){ const i=openTasks(s).find(x=>x.type==='intervention'); if(i) finish(s,i,'Intervention call completed'); }
  if(m.key==='x_coach_returns'){ const c=openTasks(s).find(x=>x.type==='coach'); if(c) finish(s,c,'Coaching delivered'); }
  if(m.key==='x_save_offer'){ const c=openTasks(s).find(x=>x.type==='save'); if(c) finish(s,c,'Save offer extended'); }
  if(m.key==='x_escalate'&&t) doEscalate(s,t,'Escalated by macro');
  if(m.key==='x_no_answer'&&t) t.dueAt=iso(d(1));
  closeModal(); save(); render(); toast(m.title,'ok'); }

/* =============== Tasks =============== */
function viewTasks(){
  const all=[]; book().forEach(s=>s.tasks.forEach(t=>all.push({s,t})));
  const F={open:x=>!x.t.done, over:x=>!x.t.done&&days(x.t.dueAt)<0, today:x=>!x.t.done&&days(x.t.dueAt)===0,
    week:x=>!x.t.done&&days(x.t.dueAt)>=0&&days(x.t.dueAt)<=6, done:x=>x.t.done};
  let list=all.filter(F[S.taskF]||F.open).sort((a,b)=>(days(a.t.dueAt)-days(b.t.dueAt))||(prioRank(a.t)-prioRank(b.t)));
  const byType={}; all.filter(x=>!x.t.done).forEach(x=>byType[x.t.type]=(byType[x.t.type]||0)+1);
  const c=capacity(ME);
  return `
  <div class="page-head">
    <div><h1 class="page-title">Tasks</h1>
      <div class="page-sub">Every piece of account management work is an <code>am_task</code> ticket on the seller it belongs to</div></div>
    <span class="head-sp"></span>
    <button class="btn btn-ghost" onclick="runSweep()">${ic('refresh',13)} Run rules now</button>
  </div>

  <div class="seg">
    ${[['open','All open'],['over','Overdue'],['today','Due today'],['week','This week'],['done','Completed']]
      .map(([k,l])=>`<button class="${S.taskF===k?'on':''}" onclick="S.taskF='${k}';render()">${l}
        <span class="c num">${all.filter(F[k]).length}</span></button>`).join('')}
  </div>

  <div class="grid2">
    <div>${list.length? list.map(({s,t})=>taskCard(s,t)).join('')
      : `<div class="card"><div class="empty">${ic('check',26)}<div style="margin-top:8px">Nothing here.</div></div></div>`}</div>
    <div>
      <div class="card" style="margin-bottom:16px">
        <div class="card-h">${ic('clock',16)}<h3>What this costs you</h3></div>
        <table class="mini"><thead><tr><th>Type</th><th>Open</th><th>Minutes</th></tr></thead><tbody>
          ${Object.entries(TASKTYPE).filter(([k])=>byType[k]).map(([k,t])=>`<tr>
            <td><span class="ttype ${t.cls}">${t.label}</span></td>
            <td class="num">${byType[k]}</td>
            <td class="num">${byType[k]*t.mins}</td></tr>`).join('')}
          <tr><td><b>Total</b></td><td class="num"><b>${sum(Object.values(byType))}</b></td>
            <td class="num"><b>${sum(Object.entries(byType).map(([k,n])=>n*TASKTYPE[k].mins))}</b></td></tr>
        </tbody></table>
        <div class="banner bn-slate tiny" style="margin-top:12px">${ic('gauge',14)}
          <div>Booked minutes plus a ${CFG.wrapPct}% wrap-up allowance are what fill your week — ${Math.round(c.committed/60)} h of ${Math.round(c.assignable/60)} h.
          Handle time is derived from what is on the record, never from a stopwatch and never self-reported.</div></div>
      </div>
      ${capCard()}
    </div>
  </div>`;
}

/* =============== Alerts =============== */
function viewAlerts(){
  const A=[]; book().forEach(s=>alertsFor(s).forEach(a=>A.push(a)));
  A.sort((a,b)=>new Date(b.at)-new Date(a.at));
  const list=S.alertF==='all'?A:A.filter(a=>a.key===S.alertF);
  const cnt=k=>A.filter(a=>a.key===k).length;
  return `
  <div class="page-head">
    <div><h1 class="page-title">Alerts</h1>
      <div class="page-sub">Every alert opens a task. Nothing here is a notification you can only read and forget.</div></div>
    <span class="head-sp"></span>
    <button class="btn btn-ghost" onclick="markAllRead()">${ic('check',13)} Mark all read</button>
  </div>

  <div class="vrail">
    <button class="${S.alertF==='all'?'on':''}" onclick="S.alertF='all';render()">All<span class="c num">${A.length}</span></button>
    <span class="sep"></span>
    ${Object.entries(ALERTS).filter(([k])=>cnt(k)).map(([k,a])=>
      `<button class="${S.alertF===k?'on':''}" onclick="S.alertF='${k}';render()">${a.label}<span class="c num">${cnt(k)}</span></button>`).join('')}
  </div>

  <div class="grid2">
    <div class="tbl-wrap">
      ${list.length? list.map(a=>{const s=a.seller, A2=a.def;
        return `<div class="alertrow ${a.read?'':'unread'}" onclick="openAlert('${s.id}','${a.task.id}')">
          ${a.read?'<span style="width:7px;flex:0 0 7px"></span>':'<span class="newdot"></span>'}
          <span class="ai ${A2.cls}" style="background:${A2.cls==='al-red'?'#FCA5A5':A2.cls==='al-amber'?'#FCD34D':'#BFDBFE'};color:${A2.cls==='al-red'?'#7F1D1D':A2.cls==='al-amber'?'#78350F':'#1E3A8A'}">${ic(A2.ico,15)}</span>
          <div style="flex:1;min-width:0">
            <div class="t">${esc(A2.label)} — ${esc(s.biz)}</div>
            <div class="s">${esc(a.task.why)}</div>
            <div class="m" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center">
              <span class="ttype ${TASKTYPE[a.task.type].cls}">${TASKTYPE[a.task.type].label} opened</span>
              ${dueChip(a.task)}<span class="chip chip-out">${esc(a.key)}</span></div>
          </div>
          <span onclick="event.stopPropagation()">${ring(s,true)}</span>
        </div>`;}).join('')
        : `<div class="empty">${ic('check',26)}<div style="margin-top:8px">No alerts on your book.</div></div>`}
    </div>
    <div>
      <div class="card">
        <div class="card-h">${ic('spark',16)}<h3>What fires an alert</h3></div>
        ${Object.entries(ALERTS).map(([k,a])=>`<div class="lrow">
          <span class="ai" style="width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:grid;place-items:center;background:${a.cls==='al-red'?'#FEE2E2':a.cls==='al-amber'?'#FEF3C7':'#DBEAFE'};color:${a.cls==='al-red'?'#B42318':a.cls==='al-amber'?'#B45309':'#1D4ED8'}">${ic(a.ico,14)}</span>
          <div class="grow"><div class="t">${esc(a.label)}</div>
            <div class="s">Opens a <b>${TASKTYPE[a.task].label.toLowerCase()}</b> at ${PRIO[a.prio].toLowerCase()} priority</div>
            <div class="esc" style="margin-top:5px">${a.esc.map((e,i)=>`<span class="escstep ${i?'hot':''}">${esc(e)}</span>`).join(ic('chev',10))}</div></div>
          <span class="chip">${cnt(k)}</span></div>`).join('')}
      </div>
    </div>
  </div>`;
}
function openAlert(sid,tid){ const s=seller(sid); if(!s.readAlerts.includes(tid)) s.readAlerts.push(tid); save(); go('#/seller/'+sid); }
function markAllRead(){ book().forEach(s=>s.tasks.forEach(t=>{ if(t.alertKey&&!s.readAlerts.includes(t.id)) s.readAlerts.push(t.id); }));
  save(); render(); toast('All alerts marked read','ok'); }
</script>
<script>
/* =============== Playbooks =============== */
const PLAYBOOKS=[
  {k:'onboarding', ico:'spark', title:'Seller onboarding — the first 30 days',
   sub:'Eight steps from handover to a seller who can run without you. Every step opens its own task.', mins:'8 steps · 30 days'},
  {k:'churn', ico:'heart', title:'Churn prevention',
   sub:'Six triggers, what you do about each one, and who it goes to when you cannot fix it alone.', mins:'6 triggers'},
  {k:'expansion', ico:'globe', title:'Cross-market expansion',
   sub:'Taking a seller from one market to two, in five phases with a real gate at each one.', mins:'5 phases · 4–6 weeks'},
];
function viewPlaybooks(){
  return `
  <div class="page-head">
    <div><h1 class="page-title">Playbooks</h1>
      <div class="page-sub">The account management method, written down. Each playbook is wired to rules that open the work.</div></div>
  </div>
  <div class="hub-grid" style="margin-bottom:20px">
    ${PLAYBOOKS.map(p=>`<div class="hub-card" onclick="go('#/playbooks/${p.k}')">
      <span class="ic">${ic(p.ico,17)}</span>
      <h4>${esc(p.title)}</h4><p>${esc(p.sub)}</p>
      <span class="chip" style="align-self:flex-start;margin-top:auto">${esc(p.mins)}</span></div>`).join('')}
    <div class="hub-card" onclick="openMacrosIndex()">
      <span class="ic" style="background:var(--slate-soft);color:#475569">${ic('spark',17)}</span>
      <h4>Macros</h4><p>The six internal shortcuts. They change the record and write a note; they never message a seller by themselves.</p>
      <span class="chip" style="align-self:flex-start;margin-top:auto">6 macros</span></div>

<script>

/* Seeded only where the platform cannot yet derive the number. Everything marked
   "derived" is computed from the book in front of you. */
const PERF_SEED = {
  am1:{dq0:29, cq0:41, nrr:112, upgrades:11, expansions:2, csat:8.4, respH:2.6, qbrDone:4, qbrDue:5},
  am2:{dq0:27, cq0:39, nrr:104, upgrades:9,  expansions:1, csat:7.9, respH:5.1, qbrDone:3, qbrDue:6},
  am3:{dq0:31, cq0:42, nrr:118, upgrades:16, expansions:4, csat:8.8, respH:3.2, qbrDone:6, qbrDue:6},
};
function perfOf(id){
  const B=S.sellers.filter(s=>s.amId===id), P=PERF_SEED[id]||PERF_SEED.am1;
  const active=B.filter(s=>s.stage!=='churned');
  const churned=B.filter(s=>s.stage==='churned').length;
  const dNow=active.length?Math.round(sum(active.map(s=>s.deliveryRate))/active.length):0;
  const cNow=active.length?Math.round(sum(active.map(s=>s.cancelRate))/active.length):0;
  const rNow=active.length?Math.round(sum(active.map(s=>s.returnRate))/active.length):0;
  const welc=B.filter(s=>s.welcomeCallAt);
  const onTime=welc.filter(s=>(new Date(s.welcomeCallAt)-new Date(s.assignedAt))/HOUR<=CFG.welcomeCallH+0.01).length;
  const activated=B.filter(s=>s.totalOrders>0).length;
  return {
    book:B.length, active:active.length, churned,
    retention: B.length?Math.round((1-churned/B.length)*100):100,
    nrr:P.nrr,
    activation: B.length?Math.round(activated/B.length*100):0,
    welcomeSla: welc.length?Math.round(onTime/welc.length*100):100,
    delivery:dNow, deliveryDelta:dNow-P.dq0,
    cancel:cNow, cancelDelta:cNow-P.cq0,
    returns:rNow,
    upgrades:P.upgrades, upgradePct:B.length?Math.round(P.upgrades/B.length*100):0,
    expansions:P.expansions, csat:P.csat, respH:P.respH,
    qbr: P.qbrDue?Math.round(P.qbrDone/P.qbrDue*100):100,
    avgHealth: active.length?Math.round(sum(active.map(health))/active.length):0,
  };
}

/* =============== ops rollup =============== */
function ops(){
  const A=[]; S.sellers.forEach(s=>alertsFor(s).forEach(a=>A.push(a)));
  const active=S.sellers.filter(s=>s.stage!=='churned');
  const T=[].concat(...S.sellers.map(openTasks));
  return {
    alerts:A.length, unread:A.filter(a=>!a.read).length,
    openConv:S.sellers.filter(s=>winState(s)!=='shut').length,
    convs:S.sellers.filter(s=>s.msgs.length).length,
    sellers:S.sellers.length, active:active.length,
    churned:S.sellers.filter(s=>s.stage==='churned').length,
    critical:active.filter(s=>health(s)<CFG.healthCritical).length,
    tasks:T.length, overdue:T.filter(t=>days(t.dueAt)<0).length,
    escalated:T.filter(t=>t.escalated).length,
    avgHealth:active.length?Math.round(sum(active.map(health))/active.length):0,
    delivery:active.length?Math.round(sum(active.map(s=>s.deliveryRate))/active.length):0,
    returns:active.length?Math.round(sum(active.map(s=>s.returnRate))/active.length):0,
    cancel:active.length?Math.round(sum(active.map(s=>s.cancelRate))/active.length):0,
    unassigned:0,
  };
}

}

<script>

function statTile(cls,ico,lbl,val,sub){
  return `<div class="stat ${cls}"><span class="ico">${ic(ico,20)}</span>
    <div><div class="lbl">${lbl}</div><div class="val num">${val}</div>${sub?`<div class="tiny" style="opacity:.9">${sub}</div>`:''}</div></div>`;
}
function meter(v,max,color,label){
  return `<div class="meter"><div class="track"><i style="width:${clamp(v/max*100)}%;background:${color}"></i></div>
    <span class="v">${label??v}</span></div>`;
}
function trendChart(series,{w=560,h=170,target,unit='%',label=''}={}){
  const n=series.length, pad=28, iw=w-pad-8, ih=h-26;
  const vals=series.map(p=>p.v), mn=Math.min(...vals,target??Infinity), mx=Math.max(...vals,target??-Infinity);
  const lo=Math.floor(mn-3), hi=Math.ceil(mx+3), sp=hi-lo||1;
  const X=i=>pad+i/(n-1)*iw, Y=v=>10+ih-((v-lo)/sp)*ih;
  const line=series.map((p,i)=>`${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  return `<div class="chartwrap"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    ${[0,.25,.5,.75,1].map(f=>{const y=10+ih*f, v=(hi-sp*f).toFixed(0);
      return `<line x1="${pad}" y1="${y}" x2="${w-8}" y2="${y}" stroke="#EEF1F4"/>
        <text x="${pad-6}" y="${y+3}" text-anchor="end" font-size="9" fill="#9CA3AF">${v}</text>`;}).join('')}
    ${target!=null?`<line x1="${pad}" y1="${Y(target)}" x2="${w-8}" y2="${Y(target)}" stroke="#94A3B8" stroke-dasharray="4 4"/>
      <text x="${w-10}" y="${Y(target)-5}" text-anchor="end" font-size="9" fill="#64748B">target ${target}${unit}</text>`:''}
    <polyline points="${line}" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${series.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.v)}" r="3" fill="#DC2626"><title>${esc(p.k)}: ${p.v}${unit}</title></circle>`).join('')}
    ${series.map((p,i)=>i%2?'':`<text x="${X(i)}" y="${h-4}" text-anchor="middle" font-size="9" fill="#9CA3AF">${esc(p.k)}</text>`).join('')}
  </svg>${label?`<div class="legendline"><span><i></i>${label}</span><span><i class="dash"></i>Quarter target</span></div>`:''}</div>`;
}

<script>

      return `<div class="hcomp ${c.off?'off':''}">
        <span class="w num">${c.w}%</span>
        <div class="nm">${c.label}<div class="why">${c.off?'No data source — weight redistributed.':`Weighted contribution ${Math.round((avg*c.w)/100)} of ${c.w} points.`}</div></div>
        <div class="track"><i style="width:${c.off?100:avg}%;background:${c.off?'':band(avg).color}"></i></div>
        <span class="sc" style="color:${c.off?'var(--muted2)':band(avg).color}">${c.off?'n/a':avg}</span></div>`;}).join('')}
    <div class="banner bn-blue tiny" style="margin-top:12px">${ic('spark',14)}
      <div>Delivery Performance is the component the account management team can move fastest — it responds to product photos,
      confirmation calls and pricing, all of which are coaching. Order Activity mostly follows it a few weeks later.</div></div>
  </div>

  <div class="grid3" style="margin-bottom:16px">
    <div class="card"><div class="card-h">${ic('truck',15)}<h3>Delivery rate</h3><span class="sp"></span>
      <span class="chip">target ${CFG.deliveryTarget}%</span></div>
      ${trendChart(seriesOf('delivery'),{w:420,h:150,target:CFG.deliveryTarget})}</div>
    <div class="card"><div class="card-h">${ic('refresh',15)}<h3>Return rate</h3><span class="sp"></span>
      <span class="chip">target ${CFG.returnTarget}%</span></div>
      ${trendChart(seriesOf('returns'),{w:420,h:150,target:CFG.returnTarget})}</div>
    <div class="card"><div class="card-h">${ic('x',15)}<h3>Cancellation rate</h3><span class="sp"></span>
      <span class="chip">target ${CFG.cancelTarget}%</span></div>
      ${trendChart(seriesOf('cancel'),{w:420,h:150,target:CFG.cancelTarget})}</div>
  </div>

  <div class="grid2">
    <div class="card">
      <div class="card-h">${ic('list',16)}<h3>Health by lifecycle stage</h3></div>
      <div class="tbl-scroll"><table class="adm-t"><thead><tr>
        <th>Stage</th><th>Sellers</th><th>Critical</th><th>At Risk</th><th>Healthy</th><th>Thriving</th><th>Average</th>
      </tr></thead><tbody>
        ${byStage.filter(x=>x.list.length).map(({l,list})=>{
          const g=k=>list.filter(s=>band(health(s)).k===k).length;
          const avg=Math.round(sum(list.map(health))/list.length);
          return `<tr><td><b>${l.label}</b><br><span class="tiny muted">${l.dur}</span></td>
            <td class="num">${list.length}</td>
            <td>${hmCell(g('critical'),list.length,true)}</td>
            <td>${hmCell(g('risk'),list.length,true)}</td>
            <td>${hmCell(g('healthy'),list.length)}</td>
            <td>${hmCell(g('thriving'),list.length)}</td>
            <td><span class="hb ${band(avg).cls}">${avg}</span></td></tr>`;}).join('')}
      </tbody></table></div>
      <div class="banner bn-slate tiny" style="margin-top:12px">${ic('shield',14)}
        <div>Lifecycle stage is derived from age, orders and health together — not a field an account manager sets.
        A seller cannot be moved out of At Risk by editing a dropdown.</div></div>
    </div>

    <div class="card">
      <div class="card-h">${ic('warn',16)}<h3>Lowest health across the platform</h3><span class="sp"></span>
        <span class="tiny muted">every account manager</span></div>
      <div class="tbl-scroll"><table class="adm-t"><thead><tr>
        <th>Seller</th><th>Health</th><th>Dragging</th><th>AM</th><th>Open</th></tr></thead><tbody>
        ${worst.map(s=>{const h=healthOf(s), w=h.comps.filter(c=>c.w>0).sort((a,b)=>a.score-b.score)[0];
          return `<tr style="cursor:pointer" onclick="go('#/seller/${s.id}')">
            <td><b>${esc(s.biz)}</b><br><span class="tiny muted">${flagInline(s.country)} · ${life(s.stage).label}</span></td>
            <td><span class="hb ${h.band.cls}">${h.score}</span></td>
            <td><span class="tiny"><b>${esc(w.label)}</b> ${w.score}<br>${esc(w.why)}</span></td>
            <td>${amAvatar(s.amId)}</td>
            <td class="num">${openTasks(s).length}</td></tr>`;}).join('')}
      </tbody></table></div>
    </div>
  </div>`;
}

/* =============== Team Performance =============== */
function viewTeamPerf(){
  const rows=TEAM.map(t=>({t,p:perfOf(t.id),c:capacity(t.id)}));
  const bonusRows=KPIS.filter(r=>r.bonus);
  const attain=p=>sum(bonusRows.map(r=>{const v=p[r.k]; return kpiOk(r,v)?r.bonus:Math.round(r.bonus*kpiPct(r,v)/100*0.6);}));
  const cohorts=[['Mar','May',96,88,79,71],['Apr','Jun',94,85,77,0],['May','Jul',97,90,0,0],['Jun','Aug',95,0,0,0]];
  const loss=[['Capacity on the seller side — went back to a physical shop only',9],
    ['Return rate never came down',7],['Cash flow — could not fund stock',5],
    ['Moved to a competitor on price',4],['Unresolved support experience',3],['Unreachable — no response to the save campaign',6]];
  return `
  <div class="page-head">
    <div><h1 class="page-title">Team Performance</h1>
      <div class="page-sub">Quarter to date · ${TEAM.length} account managers · ${S.sellers.length} sellers</div></div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-h">${ic('award',16)}<h3>Scorecards</h3><span class="sp"></span>
      <span class="tiny muted">bonus weights: ${bonusRows.map(r=>r.bonus+'% '+r.label.toLowerCase()).join(' · ')}</span></div>
    <div class="tbl-scroll"><table class="adm-t"><thead><tr>
      <th>Account manager</th><th>Book</th><th>Retention</th><th>NRR</th><th>Delivery Δ</th><th>Activation</th>
      <th>Expansions</th><th>Welcome SLA</th><th>Response</th><th>Attainment</th>
    </tr></thead><tbody>
      ${rows.map(({t,p})=>`<tr>
        <td><div class="cell-name">${amAvatar(t.id,'')}
          <div><div class="nm">${esc(t.name)}</div><div class="tiny muted">${flagInline(t.country)}</div></div></div></td>
        <td class="num">${p.book}</td>
        <td>${meter(p.retention,100,p.retention>=85?'#2B8A3E':'#DC2626',p.retention+'%')}</td>
        <td><span class="hm" style="background:${p.nrr>=110?'#DCFCE7':'#FEF3C7'}">${p.nrr}%</span></td>
        <td><span class="hm" style="background:${p.deliveryDelta>=5?'#DCFCE7':'#FEF3C7'}">${p.deliveryDelta>0?'+':''}${p.deliveryDelta}</span></td>
        <td>${meter(p.activation,100,p.activation>=70?'#2B8A3E':'#F59E0B',p.activation+'%')}</td>
        <td><span class="hm" style="background:${p.expansions>=3?'#DCFCE7':'#FEE2E2'}">${p.expansions}</span></td>
        <td><span class="hm" style="background:${p.welcomeSla>=100?'#DCFCE7':'#FEE2E2'}">${p.welcomeSla}%</span></td>
        <td><span class="hm" style="background:${p.respH<=CFG.responseH?'#DCFCE7':'#FEE2E2'}">${p.respH} h</span></td>
        <td><b class="num">${attain(p)}%</b></td>
      </tr>`).join('')}
    </tbody></table></div>
    <div class="banner bn-blue tiny" style="margin-top:12px">${ic('shield',14)}
      <div>Seller activation is deliberately shared with the Onboarding Agent role at 15% of both bonuses. A seller who is
      qualified badly and a seller who is onboarded badly fail the same way, so neither role gets to blame the other for it.</div></div>
  </div>

  <div class="grid2">
    <div class="card">
      <div class="card-h">${ic('users',16)}<h3>Retention by activation cohort</h3><span class="sp"></span>
        <span class="tiny muted">% still ordering</span></div>
      <div class="tbl-scroll"><table class="adm-t"><thead><tr>
        <th>Activated</th><th>Month 1</th><th>Month 2</th><th>Month 3</th><th>Month 4</th></tr></thead><tbody>
        ${cohorts.map(c=>`<tr><td><b>${c[0]}</b></td>
          ${c.slice(2).map(v=>`<td>${v?hmCell(v,100):'<span class="muted tiny">—</span>'}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div>
      <div class="banner bn-amber tiny" style="margin-top:12px">${ic('warn',14)}
        <div>The drop happens between month two and month three, not at the start — which is exactly when the 30-day playbook stops
        and nothing structured replaces it. A day-60 review is the obvious next step and does not exist yet.</div></div>
    </div>

    <div class="card">
      <div class="card-h">${ic('heart',16)}<h3>Why sellers churned</h3><span class="sp"></span>
        <span class="chip">${sum(loss.map(l=>l[1]))} this quarter</span></div>
      ${loss.sort((a,b)=>b[1]-a[1]).map(([t,n])=>`<div class="lrow">
        <div class="grow"><div class="t" style="font-weight:500">${esc(t)}</div>
          <div class="bar" style="margin-top:6px"><i style="width:${n/Math.max(...loss.map(l=>l[1]))*100}%;background:#DC2626"></i></div></div>
        <span class="num" style="font-weight:800">${n}</span></div>`).join('')}
      <div class="banner bn-slate tiny" style="margin-top:12px">${ic('shield',14)}
        <div>Captured on the save-campaign task when it closes. Two of the six reasons — returns and support experience — are
        things the platform controls, and together they are ${Math.round((loss.find(l=>l[0].includes('Return'))[1]+loss.find(l=>l[0].includes('support'))[1])/sum(loss.map(l=>l[1]))*100)}% of the churn.</div></div>
    </div>
  </div>`;
}
</script>
<script>
/* =============== All Sellers (admin) =============== */
S.sel = S.sel || [];
function selAll(on){ const list=admList(); S.sel = on ? list.map(s=>s.id) : []; render(); }
function togSel(id){ const i=S.sel.indexOf(id); if(i<0) S.sel.push(id); else S.sel.splice(i,1); render(); }
function admList(){
  let list=S.sellers.filter(viewDef(S.view).f);
  if(S.q){ const q=S.q.toLowerCase();
    list=list.filter(s=>[s.biz,s.owner,s.code,s.city,s.cat,s.phone,am(s.amId).name].join(' ').toLowerCase().includes(q)); }
  return sortSellers(list);
}
function viewAllSellers(){
  const list=admList(), cnt=k=>S.sellers.filter(viewDef(k).f).length;
  const grp=g=>VIEWS.filter(x=>x.g===g&&x.k!=='mine'&&x.k!=='action'&&x.k!=='silent'&&x.k!=='expand')
    .map(x=>`<button class="${S.view===x.k?'on':''}" onclick="S.view='${x.k}';S.sel=[];render()">${x.label}<span class="c num">${cnt(x.k)}</span></button>`).join('');
  return `
  <div class="page-head">
    <div><h1 class="page-title">All Sellers</h1>
      <div class="page-sub">${list.length} of ${S.sellers.length} · ${viewDef(S.view).label}</div></div>
    <span class="head-sp"></span>
    <button class="btn btn-ghost" onclick="runSweep()">${ic('refresh',13)} Run rule sweep</button>
  </div>

  <div class="vrail">${grp('sys')}<span class="sep"></span>${grp('team')}</div>

  <div class="searchbar">
    <div class="search-input">${ic('search',15)}
      <input value="${esc(S.q)}" placeholder="Business, owner, code, city, account manager…" oninput="S.q=this.value;clearTimeout(window._t);window._t=setTimeout(render,220)">
      ${S.q?`<button class="icon-btn grey" style="width:28px;height:28px" onclick="S.q='';render()">${ic('x',13)}</button>`:''}
    </div>
    <select class="fi" style="width:auto" onchange="S.sort=this.value;render()">
      ${[['health','Lowest health first'],['tasks','Most open tasks'],['contact','Longest since contact'],['orders','Orders this week'],['stage','Lifecycle stage'],['name','Business name']]
        .map(([k,l])=>`<option value="${k}" ${S.sort===k?'selected':''}>${l}</option>`).join('')}
    </select>
  </div>

  ${S.sel.length?`<div class="pending" style="background:#EEF2FF;color:#3730A3">
    ${ic('check',16)} <b>${S.sel.length} selected</b><span class="sp"></span>
    <button class="btn btn-dark btn-sm" onclick="bulkReassign()">${ic('swap',12)} Reassign</button>
    <button class="btn btn-ghost btn-sm" onclick="bulkTask()">${ic('plus',12)} Open a task on each</button>
    <button class="btn btn-ghost btn-sm" onclick="S.sel=[];render()">Clear</button>
  </div>`:''}

  <div class="tbl-wrap"><div class="tbl-scroll"><table class="data">
    <thead><tr>
      <th style="width:34px"><span class="chk" style="padding:0" onclick="selAll(${S.sel.length<list.length})">
        <span class="box ${S.sel.length&&S.sel.length>=list.length?'on':''}" style="${S.sel.length&&S.sel.length>=list.length?'background:var(--green);border-color:var(--green);color:#fff':''}">${S.sel.length&&S.sel.length>=list.length?ic('check',11):''}</span></span></th>
      <th>Seller</th><th>Health</th><th>Stage</th><th>Orders</th><th>Delivery</th><th>Returns</th><th>Wallet</th><th>Open</th><th>AM</th>
    </tr></thead>
    <tbody>${list.length?list.map(s=>{const on=S.sel.includes(s.id), b=band(health(s));
      return `<tr class="${on?'own-me':''}">
        <td onclick="event.stopPropagation();togSel('${s.id}')"><span class="chk" style="padding:0">
          <span class="box ${on?'on':''}" style="${on?'background:var(--green);border-color:var(--green);color:#fff':''}">${on?ic('check',11):''}</span></span></td>
        <td onclick="go('#/seller/${s.id}')"><div class="cell-name">${avatar(s)}
          <div><div class="nm">${esc(s.biz)}</div>
            <div class="tiny muted">${esc(s.code)} · ${esc(s.owner)} · ${place(s)}</div></div></div></td>
        <td onclick="go('#/seller/${s.id}')"><span style="font-size:16px;font-weight:800;color:${b.color}" class="num">${health(s)}</span></td>
        <td onclick="go('#/seller/${s.id}')">${stagePill(s)}</td>
        <td onclick="go('#/seller/${s.id}')"><div style="display:flex;align-items:center;gap:8px">${sparkline(s,58,20)}<span class="num" style="font-weight:700">${thisWeek(s)}</span></div></td>
        <td onclick="go('#/seller/${s.id}')" class="num">${s.deliveryRate}%</td>
        <td onclick="go('#/seller/${s.id}')" class="num" style="${s.returnRate>CFG.returnAlertPct?'color:#B42318;font-weight:700':''}">${s.returnRate}%</td>
        <td onclick="go('#/seller/${s.id}')" class="num" style="${s.wallet<0?'color:#B42318':''}">${money(s.wallet)}</td>
        <td onclick="go('#/seller/${s.id}')" class="num">${openTasks(s).length||'—'}</td>
        <td onclick="go('#/seller/${s.id}')">${amAvatar(s.amId)}</td>
      </tr>`;}).join('')
      :`<tr><td colspan="10"><div class="empty">No sellers match.</div></td></tr>`}
    </tbody></table></div>
    <div class="tbl-foot">${ic('shield',13)} Reassignment is the one bulk action that touches a relationship — it is logged to the audit trail with the reason.
      <span style="flex:1"></span>${list.length} rows</div>
  </div>`;
}

function bulkReassign(){ M={choice:null,ready:()=>!!M.choice};
  const caps=TEAM.map(t=>({t,c:capacity(t.id)}));
  openModal(`<div class="modal-h">${ic('swap',18)}<h3>Reassign ${S.sel.length} seller${S.sel.length===1?'':'s'}</h3><span style="flex:1"></span>
      <button class="tb-btn" onclick="closeModal()">${ic('x',16)}</button></div>
    <div class="modal-b">
      <div class="banner bn-amber" style="margin-bottom:14px">${ic('warn',15)}
        <div>The seller keeps their conversation history but starts talking to a different number and a different person.
        Do this for market or language fit, or when a book is genuinely unworkable — not to level the numbers.</div></div>
      ${caps.map(({t,c})=>opt('choice',t.id,`${t.name} · ${t.country}`,
        `${c.book.length} of ${CFG.maxBook} sellers, ${Math.round(c.util*100)}% booked${c.book.length+S.sel.length>CFG.maxBook?` — would exceed the ceiling by ${c.book.length+S.sel.length-CFG.maxBook}`:` — room for ${c.slots}`}`)).join('')}
      <label class="fl">Reason for the audit trail</label>
      <input class="fi" id="m-note" placeholder="Market fit, language, workload…">
    </div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-red" id="modal-go" disabled onclick="doReassign()">Reassign</button></div>`,true); }
function doReassign(){ const to=M.choice, why=(document.getElementById('m-note')||{}).value||'no reason given';
  const n=S.sel.length;
  S.sel.forEach(id=>{ const s=seller(id); const from=s.amId; s.amId=to;
    push(s,'assign',`Reassigned to ${am(to).name}`,`Previously ${am(from).name}. ${why}`);
    AUDIT.unshift({at:iso(new Date()),who:'Layla Mansour',
      what:`reassigned <code>${s.code}</code> from ${esc(am(from).name)} to ${esc(am(to).name)} — ${esc(why)}`}); });
  S.sel=[]; closeModal(); save(); render(); toast(`${n} seller${n===1?'':'s'} reassigned to ${am(to).name}`,'ok'); }

function bulkTask(){ M={choice:null,ready:()=>!!M.choice};
  openModal(`<div class="modal-h">${ic('plus',18)}<h3>Open a task on ${S.sel.length} seller${S.sel.length===1?'':'s'}</h3><span style="flex:1"></span>
      <button class="tb-btn" onclick="closeModal()">${ic('x',16)}</button></div>
    <div class="modal-b">
      <div class="banner bn-blue" style="margin-bottom:14px">${ic('gauge',15)}
        <div>Bulk work still costs real minutes. Each task lands on the owning account manager's week and shows up in their capacity immediately.</div></div>
      ${Object.entries(TASKTYPE).map(([k,t])=>opt('choice',k,t.label,`${t.mins} minutes each — ${S.sel.length*t.mins} minutes across this selection.`)).join('')}
      <label class="fl">Title</label><input class="fi" id="m-title" placeholder="What needs doing">
      <label class="fl">Why</label><textarea class="fi" id="m-why" placeholder="Context for the account manager"></textarea>
      <label class="fl">Due in</label>
      <select class="fi" id="m-due"><option value="1">Tomorrow</option><option value="3">3 days</option>
        <option value="7" selected>A week</option><option value="14">Two weeks</option></select>
    </div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-red" id="modal-go" disabled onclick="doBulkTask()">Open tasks</button></div>`,true); }
function doBulkTask(){ const type=M.choice;
  const title=(document.getElementById('m-title')||{}).value||TASKTYPE[type].label;
  const why=(document.getElementById('m-why')||{}).value||'Opened by the Head of Account Management.';
  const due=+(document.getElementById('m-due')||{}).value||7, n=S.sel.length;
  S.sel.forEach(id=>{ const s=seller(id);
    s.tasks.unshift({id:'T'+(++TASKSEQ), type, title:`${title} — ${s.biz}`, why, prio:'normal',
      createdAt:iso(new Date()), dueAt:iso(d(due)), done:false, ruleId:null});
    push(s,'task','Task opened by the Head of Account Management',title); });
  AUDIT.unshift({at:iso(new Date()),who:'Layla Mansour',what:`opened <code>${type}</code> tasks on ${n} sellers — ${esc(title)}`});
  S.sel=[]; closeModal(); save(); render(); toast(`${n} task${n===1?'':'s'} opened`,'ok'); }
</script>
<script>
/* =============== Automation =============== */
function toggleRule(id){ const r=RULES.find(x=>x.id===id); r.live=!r.live;
  AUDIT.unshift({at:iso(new Date()),who:'Layla Mansour',what:`${r.live?'enabled':'disabled'} rule <code>${id}</code>`});
  render(); toast(`Rule ${id} ${r.live?'enabled':'disabled'} — takes effect on the next sweep`, r.live?'ok':'warn'); }

function viewAutomation(){
  const live=RULES.filter(r=>r.live).length;
  return `
  <div class="page-head">
    <div><h1 class="page-title">Automation</h1>
      <div class="page-sub">${live} of ${RULES.length} rules live · every rule opens a task, none of them only send a notification</div></div>
    <span class="head-sp"></span>
    <button class="btn btn-red" onclick="runSweep()">${ic('refresh',13)} Run sweep now</button>
  </div>

  <div class="banner bn-blue" style="margin-bottom:18px">${ic('shield',16)}
    <div><b>Rules open work; they never close it and they never message a seller.</b>
    That line matters: an automation that can send a WhatsApp message on its own can burn template budget and damage a relationship
    while nobody is watching. An automation that can only put a task in front of a named person cannot.</div></div>

  ${RULES.map(r=>`<div class="rule">
    <div class="rule-h">
      <span class="chip">${r.id}</span>
      <h4>${esc(r.on)}</h4>
      <span class="sp"></span>
      <span class="tiny muted">${r.live?'live':'off'}</span>
      <span class="sw ${r.live?'on':''}" onclick="toggleRule('${r.id}')" role="switch" aria-checked="${r.live}"></span>
    </div>
    <div class="rule-b">
      <span class="lb">When</span><span>${r.when.map(c=>`<span class="cond trg">${esc(c)}</span>`).join('')}</span>
      <span class="lb">Then</span><span>${r.then.map(c=>`<span class="cond act">${esc(c)}</span>`).join('')}</span>
      <span class="lb">Note</span><span class="tiny muted" style="padding-top:2px">${esc(r.note)}</span>
    </div>
  </div>`).join('')}`;
}

/* =============== Configuration =============== */
const draftVal = k => (k in S.cfgDraft) ? S.cfgDraft[k] : CFG[k];
function setDraft(k,v){ const n=parseFloat(v);
  if(isNaN(n)) delete S.cfgDraft[k];
  else if(n===CFG[k]) delete S.cfgDraft[k];
  else S.cfgDraft[k]=n;
  renderPending(); }
function renderPending(){ const el=document.getElementById('pendbar'); if(el) el.outerHTML=pendingBar(); }
function withCfg(obj,fn){ const bak={...CFG}; Object.assign(CFG,obj); try{ return fn(); } finally { Object.assign(CFG,bak); } }
const dirty = () => Object.keys(S.cfgDraft);

function pendingBar(){
  const D=dirty();
  if(!D.length) return `<div id="pendbar" class="banner bn-slate" style="margin-bottom:16px">${ic('check',15)}
    <div>Live configuration, version ${VERSIONS[0].v}. Change a value below to open a draft — nothing takes effect until it is published.</div></div>`;
  return `<div id="pendbar" class="pending">${ic('warn',16)}
    <b>${D.length} change${D.length===1?'':'s'} in draft</b>
    <span class="tiny">${D.slice(0,4).map(k=>`${CFG_FIELDS[k]?CFG_FIELDS[k][0]:k} ${CFG[k]} → ${S.cfgDraft[k]}`).join(' · ')}${D.length>4?` · +${D.length-4} more`:''}</span>
    <span class="sp"></span>
    <button class="btn btn-ghost btn-sm" onclick="simulate()">${ic('play',12)} Simulate</button>
    <button class="btn btn-ghost btn-sm" onclick="S.cfgDraft={};render()">Discard</button>
    <button class="btn btn-red btn-sm" onclick="publishCfg()">${ic('check',12)} Publish</button></div>`;
}
