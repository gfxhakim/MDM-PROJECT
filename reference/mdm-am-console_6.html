function simulate(){
  const D=Object.assign({},S.cfgDraft);
  const wsum=['wActivity','wDelivery','wEngagement','wFinancial','wGrowth'].reduce((a,k)=>a+draftVal(k),0);
  const before=S.sellers.map(s=>({s, h:health(s), b:band(health(s)).k, t:openTasks(s).length}));
  const after=withCfg(D,()=>S.sellers.map(s=>{
    const h=health(s); const tmp=JSON.parse(JSON.stringify(s)); tmp.tasks=s.tasks.map(t=>({...t}));
    const o=runRules(tmp,true);
    return {h, b:band(h).k, opened:o.length, upgraded:o.upgrades||0}; }));
  const moved=before.map((b,i)=>({...b, nh:after[i].h, nb:after[i].b, opened:after[i].opened, upgraded:after[i].upgraded}))
    .filter(x=>x.b!==x.nb || x.opened || x.upgraded);
  const newTasks=sum(after.map(a=>a.opened));
  const upgraded=sum(after.map(a=>a.upgraded));
  const bandCount=k=>({b:before.filter(x=>x.b===k).length, a:after.filter(x=>x.b===k).length});
  openModal(`<div class="modal-h">${ic('play',18)}<h3>Simulate — ${dirty().length} pending change${dirty().length===1?'':'s'}</h3><span style="flex:1"></span>
      <button class="tb-btn" onclick="closeModal()">${ic('x',16)}</button></div>
    <div class="modal-b">
      ${wsum!==100?`<div class="banner bn-red" style="margin-bottom:14px">${ic('warn',15)}
        <div>Weights total ${wsum}%. This draft cannot be published until they total 100.</div></div>`:''}
      <div class="eyebrow" style="margin-bottom:8px">Band movement across all ${S.sellers.length} sellers</div>
      ${BANDS.slice().reverse().map(b=>{const c=bandCount(b.k), delta=c.a-c.b;
        return `<div class="simrow">
          <i class="hb-dot" style="background:${b.color}"></i>
          <span class="nm">${b.label}</span>
          <span class="from">${c.b}</span>${ic('chev',11)}<span class="to">${c.a}</span>
          ${delta?`<span class="mv ${delta>0?'mv-up':'mv-dn'}">${delta>0?'+':''}${delta}</span>`:'<span class="tiny muted">no change</span>'}</div>`;}).join('')}

      <div class="banner ${newTasks||upgraded?'bn-amber':'bn-green'}" style="margin:16px 0">${ic(newTasks||upgraded?'warn':'check',15)}
        <div><b>${newTasks} new task${newTasks===1?'':'s'}</b> would be opened on the next sweep,
        costing roughly <b>${Math.round(newTasks*22/60*10)/10} hours</b> across ${TEAM.length} account managers.
        ${upgraded?`A further <b>${upgraded}</b> routine check-in${upgraded===1?'':'s'} would be upgraded to an urgent intervention in place, rather than opening a second call on the same seller.`:''}
        ${newTasks>30?'That is most of a working day each — check the team has it before publishing.':''}</div></div>

      ${moved.length?`<div class="eyebrow" style="margin-bottom:8px">Sellers that change (${moved.length})</div>
        <div class="tbl-x"><table class="doc"><thead><tr><th>Seller</th><th>Health</th><th>Band</th><th>Work</th></tr></thead><tbody>
          ${moved.slice(0,18).map(x=>`<tr><td>${esc(x.s.biz)}<br><span class="tiny muted">${esc(am(x.s.amId).name)}</span></td>
            <td class="num">${x.h} → <b>${x.nh}</b></td>
            <td>${x.b!==x.nb?`<span class="hb ${BANDS.find(b=>b.k===x.b).cls}">${BANDS.find(b=>b.k===x.b).label}</span> → <span class="hb ${BANDS.find(b=>b.k===x.nb).cls}">${BANDS.find(b=>b.k===x.nb).label}</span>`:'<span class="muted tiny">same</span>'}</td>
            <td class="tiny">${x.opened?`<b>${x.opened}</b> new`:''}${x.opened&&x.upgraded?' · ':''}${x.upgraded?`${x.upgraded} upgraded to intervention`:''}${!x.opened&&!x.upgraded?'<span class="muted">no change</span>':''}</td></tr>`).join('')}
        </tbody></table></div>${moved.length>18?`<div class="tiny muted" style="margin-top:8px">+ ${moved.length-18} more</div>`:''}`
        :`<div class="banner bn-slate">${ic('check',15)}<div>No seller changes band and no new task opens. This draft is safe to publish.</div></div>`}
    </div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">Keep editing</button>
      <button class="btn btn-red" ${wsum!==100?'disabled':''} onclick="publishCfg()">${ic('check',13)} Publish</button></div>`,true); }

function publishCfg(){
  const D=dirty(); if(!D.length) return toast('Nothing to publish');
  const wsum=['wActivity','wDelivery','wEngagement','wFinancial','wGrowth'].reduce((a,k)=>a+draftVal(k),0);
  if(wsum!==100) return toast(`Weights total ${wsum}% — publishing is blocked until they total 100`,'warn');
  const diff=D.map(k=>[k,CFG[k],S.cfgDraft[k]]);
  D.forEach(k=>CFG[k]=S.cfgDraft[k]);
  VERSIONS.forEach(v=>v.live=false);
  VERSIONS.unshift({v:VERSIONS[0].v+1, at:iso(new Date()), by:'Layla Mansour', live:true,
    diff, state:{...CFG}, note:'Published from the configuration screen.'});
  AUDIT.unshift({at:iso(new Date()),who:'Layla Mansour',
    what:`published configuration v${VERSIONS[0].v} — ${diff.map(([k,a,b])=>`<code>${k}</code> ${a} → ${b}`).join(', ')}`});
  S.cfgDraft={}; closeModal(); save();
  const n=sum(S.sellers.map(s=>runRules(s).length)); save(); render();
  toast(`Version ${VERSIONS[0].v} published — ${n} task${n===1?'':'s'} opened by the new configuration`,'ok'); }

function rollback(v){ const ver=VERSIONS.find(x=>x.v===v); if(!ver) return;
  openModal(`<div class="modal-h">${ic('refresh',18)}<h3>Roll back to version ${v}</h3><span style="flex:1"></span>
      <button class="tb-btn" onclick="closeModal()">${ic('x',16)}</button></div>
    <div class="modal-b">
      <div class="banner bn-amber" style="margin-bottom:14px">${ic('warn',15)}
        <div>This restores the complete configuration snapshot taken when version ${v} was published — every value, not only the ones
        that version changed. Tasks already opened stay open; the rules simply stop opening new ones under the old thresholds.</div></div>
      <div class="tiny muted">${esc(ver.note)}</div>
      <div class="diff" style="margin-top:12px">${Object.keys(CFG).filter(k=>CFG[k]!==ver.state[k]).map(k=>
        `<div class="minus">− ${esc(CFG_FIELDS[k]?CFG_FIELDS[k][0]:k)}: ${CFG[k]}</div><div class="plus">+ ${esc(CFG_FIELDS[k]?CFG_FIELDS[k][0]:k)}: ${ver.state[k]}</div>`).join('')
        ||'<div class="plus">No differences — version '+v+' matches the live configuration.</div>'}</div>
    </div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-red" onclick="doRollback(${v})">Roll back</button></div>`,true); }
function doRollback(v){ const ver=VERSIONS.find(x=>x.v===v);
  const diff=Object.keys(CFG).filter(k=>CFG[k]!==ver.state[k]).map(k=>[k,CFG[k],ver.state[k]]);
  Object.assign(CFG,ver.state);
  VERSIONS.forEach(x=>x.live=false);
  VERSIONS.unshift({v:VERSIONS[0].v+1, at:iso(new Date()), by:'Layla Mansour', live:true,
    diff, state:{...CFG}, note:`Rolled back to version ${v}.`});
  AUDIT.unshift({at:iso(new Date()),who:'Layla Mansour',what:`rolled back to configuration v${v}`});
  S.cfgDraft={}; closeModal(); save(); render(); toast(`Rolled back to version ${v}`,'ok'); }
</script>

            <span class="tiny muted">${ic('shield',11)} Silent monitoring is never silent — the account manager sees that you looked.</span>
            <span class="sp"></span>
            <button class="btn btn-ghost btn-sm" onclick="blockContact('${sel.id}')">${ic('x',12)} Block contact</button>
            <button class="btn btn-dark btn-sm" onclick="takeOver('${sel.id}')">${ic('users',12)} Take over</button>
          </div>
        </div>
      </div>
    </div>`:`<div class="card"><div class="empty">Select a conversation.</div></div>`}
  </div>`;
}
function takeOver(id){ const s=seller(id);
  openModal(`<div class="modal-h">${ic('users',18)}<h3>Take over this conversation</h3><span style="flex:1"></span>
      <button class="tb-btn" onclick="closeModal()">${ic('x',16)}</button></div>
    <div class="modal-b">
      <div class="banner bn-amber" style="margin-bottom:14px">${ic('warn',15)}
        <div><b>${esc(am(s.amId).name)}</b> owns this account. Taking over hands you the reply capability and posts a system
        message on the conversation so the account manager is not left wondering what happened.
        Ownership of the account itself does not move.</div></div>
      <label class="fl">Reason — the account manager reads this</label>
      <textarea class="fi" id="m-note" placeholder="Escalated complaint, absence, quality review…"></textarea>
    </div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-red" onclick="doTakeOver('${id}')">Take over</button></div>`); }
function doTakeOver(id){ const s=seller(id), why=(document.getElementById('m-note')||{}).value||'no reason given';
  addMsg(s,{dir:'out',ch:'note',kind:'sys',body:`Layla Mansour took over this conversation — ${why}`});
  push(s,'escalate','Conversation taken over by the Head of Account Management',why);
  AUDIT.unshift({at:iso(new Date()),who:'Layla Mansour',what:`took over conversation on <code>${s.code}</code> — ${esc(why)}`});
  closeModal(); save(); render(); toast('Taken over — the account manager has been notified','warn'); }
function blockContact(id){ const s=seller(id);
  openModal(`<div class="modal-h">${ic('x',18)}<h3>Block this contact</h3><span style="flex:1"></span>
      <button class="tb-btn" onclick="closeModal()">${ic('x',16)}</button></div>
    <div class="modal-b"><div class="banner bn-red">${ic('warn',15)}
      <div>Blocking stops all inbound and outbound messaging with <b>${esc(s.phone)}</b> across every channel.
      It is for abuse and fraud, not for a difficult seller — and it is visible to everyone in the audit trail.</div></div>
      <label class="fl">Reason</label><input class="fi" id="m-note" placeholder="Required"></div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-red" onclick="closeModal();toast('Block requires a second approver — request sent','warn')">Request block</button></div>`); }

/* =============== Audit & Quality =============== */
function viewAudit(){
  const T=[].concat(...S.sellers.map(s=>s.tasks.filter(t=>!t.done).map(t=>({s,t}))));
  const checks=[
    {t:'Welcome calls inside SLA', v:Math.round(sum(TEAM.map(t=>perfOf(t.id).welcomeSla))/TEAM.length), tgt:100, unit:'%',
     w:'Calls placed within '+CFG.welcomeCallH+' hours of assignment, across the whole team.'},
    {t:'Sellers with no account manager', v:0, tgt:0, unit:'', lower:true,
     w:'Rule r1 assigns on activation. A non-zero number here means the handover from Onboarding is broken.'},
    {t:'Tasks overdue by more than 3 days', v:T.filter(x=>days(x.t.dueAt)<-3).length, tgt:0, unit:'', lower:true,
     w:'Work that has been sitting long enough that the trigger which opened it has probably got worse.'},
    {t:'Escalations with no note', v:0, tgt:0, unit:'', lower:true,
     w:'An escalation without a written reason is a handover the next owner cannot act on.'},
    {t:'Sellers not contacted in 30 days', v:S.sellers.filter(s=>ago(s.lastContactAt)>=30&&s.stage!=='churned').length, tgt:0, unit:'', lower:true,
     w:'A managed seller who has heard nothing for a month is managed in name only.'},
    {t:'Playbook steps ticked without their gate', v:0, tgt:0, unit:'', lower:true,
     w:'Blocked in the interface — a step whose gate reads false on the seller record cannot be ticked.'},
  ];
  return `
  <div class="page-head">
    <div><h1 class="page-title">Audit &amp; Quality</h1>
      <div class="page-sub">Configuration changes, reassignments, escalations and take-overs — every one attributable</div></div>
  </div>

  <div class="grid2">
    <div class="card">
      <div class="card-h">${ic('shield',16)}<h3>Quality checks</h3><span class="sp"></span>
        <span class="chip">${checks.filter(c=>c.lower?c.v<=c.tgt:c.v>=c.tgt).length} of ${checks.length} passing</span></div>
      ${checks.map(c=>{const ok=c.lower?c.v<=c.tgt:c.v>=c.tgt;
        return `<div class="lrow">
          <span class="ai" style="width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:grid;place-items:center;background:${ok?'var(--green-soft)':'var(--red-soft2)'};color:${ok?'var(--green)':'#B42318'}">${ic(ok?'check':'warn',14)}</span>
          <div class="grow"><div class="t">${esc(c.t)}</div><div class="s">${esc(c.w)}</div></div>
          <span class="num" style="font-size:16px;font-weight:800;color:${ok?'var(--green)':'#B42318'}">${c.v}${c.unit}</span></div>`;}).join('')}
    </div>

    <div class="card">
      <div class="card-h">${ic('list',16)}<h3>Audit trail</h3><span class="sp"></span>
        <span class="tiny muted">newest first</span></div>
      ${AUDIT.slice(0,18).map(a=>`<div class="aud">
        <span class="when">${fmtT(a.at)}</span>
        <span><span class="who">${esc(a.who)}</span> <span class="what">${a.what}</span></span></div>`).join('')}
      <div class="banner bn-slate tiny" style="margin-top:12px">${ic('shield',14)}
        <div>Reassignments, escalations, take-overs and configuration publishes are all written here. Nothing in the account
        management section can change a seller's ownership or the platform's behaviour without leaving a line.</div></div>
    </div>
  </div>`;
}
</script>
