<title>MDM Onboarding Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700&display=swap">
<style>
:root{
  --red:#DC2626; --red-500:#EF4444; --red-accent:#FA5252; --red-soft:#FEF2F2; --red-soft2:#FEE2E2;
  --green:#2B8A3E; --green-500:#37B24D; --green-soft:#EBFBEE;
  --blue:#3B82F6; --blue-700:#1D4ED8; --blue-soft:#EFF6FF;
  --amber:#B45309; --amber-500:#F59E0B; --amber-soft:#FEF3C7;
  --pink:#E64980; --pink-soft:#FFF0F6;
  --teal:#0E7490; --teal-soft:#ECFEFF;
  --slate:#475569; --slate-soft:#F1F5F9;
  --ink:#111827; --ink2:#1F2937; --ink3:#374151;
  --muted:#6B7280; --muted2:#9CA3AF;
  --line:#E5E7EB; --line2:#F3F4F6;
  --bg:#F4F6F8; --surface:#FFFFFF; --surface2:#F9FAFB;
  --r-sm:4px; --r:8px; --r-lg:12px; --pill:999px;
  --sh-sm:0 1px 2px rgba(16,24,40,.05);
  --sh:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
  --sh-md:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1);
  --sh-lg:0 12px 32px rgba(16,24,40,.14);
  --ui:'Inter','Cairo',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --ar:'Cairo','Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance;color:var(--ink)}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:var(--r-sm)}
table{border-collapse:collapse;width:100%}
.num{font-variant-numeric:tabular-nums}
.ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:16px;height:56px;padding:0 16px;background:var(--surface2);box-shadow:var(--sh-md)}
.burger{width:34px;height:34px;border-radius:var(--r-sm);background:var(--red-soft2);color:var(--red);display:grid;place-items:center}
.logo{display:flex;flex-direction:column;line-height:.86;user-select:none}
.logo-word{font-weight:800;font-style:italic;font-size:22px;letter-spacing:-1.5px}
.logo-word .r{color:var(--red-500)}
.logo-word .k{color:#111}
.logo-sub{font-weight:800;font-style:italic;font-size:9.5px;letter-spacing:1.6px;color:#111;padding-left:2px}
.topbar-sp{flex:1}
.tb-btn{position:relative;width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--ink3)}
.tb-btn:hover{background:var(--line2)}
.tb-btn.warn{background:#FEF0C7;color:#B45309}
.tb-badge{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:var(--pill);background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface2)}
.me{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:var(--pill);background:var(--red);color:#fff;font-weight:600;font-size:12px}
.me .av{width:26px;height:26px;border-radius:50%;background:#fff;color:var(--red);display:grid;place-items:center;font-size:11px;font-weight:800}

.shell{display:flex;min-height:calc(100vh - 56px);align-items:flex-start}
.sidebar{width:262px;flex:0 0 262px;background:var(--surface);border-right:1px solid var(--line);padding:10px 10px 24px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:#E2E5E9;border-radius:9px}
.nav-item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:var(--r);color:#334155;font-size:13.5px;font-weight:500;width:100%;text-align:left}
.nav-item:hover{background:var(--surface2)}
.nav-ico{width:30px;height:30px;flex:0 0 30px;border-radius:var(--r);background:var(--red-soft);color:var(--red-500);display:grid;place-items:center}
.nav-item .chev{margin-left:auto;color:#0F172A;opacity:.7;transition:transform .18s}
.nav-item.open .chev{transform:rotate(90deg)}
.nav-item.dim{color:#64748B}
.nav-group{border-left:1px solid var(--line);margin:2px 0 6px 24px;padding-left:0}
.sub-item{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 22px;font-size:13px;color:#334155;border-radius:0 var(--r) var(--r) 0;width:100%;text-align:left}
.sub-item:hover{background:var(--surface2)}
.sub-item.active{background:var(--red-soft);color:var(--red);font-weight:600;box-shadow:inset 2px 0 0 var(--red)}
.sub-item .cnt{margin-left:auto;font-size:10.5px;font-weight:700;background:#EEF1F4;color:#475569;padding:1px 7px;border-radius:var(--pill)}
.sub-item.active .cnt{background:var(--red);color:#fff}
.oa-badge{margin-left:auto;font-size:9px;font-weight:800;letter-spacing:.5px;background:var(--green-soft);color:var(--green);padding:2px 6px;border-radius:var(--pill)}
.side-card{margin:14px 4px 6px;padding:10px 12px;border-radius:var(--r-lg);background:var(--green-soft);display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600;color:#14532D}
.dot-live{width:8px;height:8px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.side-sep{height:1px;background:var(--line);margin:10px 6px}

main{flex:1;min-width:0;padding:22px 26px 60px}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.back-btn{width:30px;height:30px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center}
h1.page-title{font-size:20px;font-weight:600;padding-bottom:5px;border-bottom:3px solid var(--red-500);letter-spacing:-.2px}
.page-sub{color:var(--muted);font-size:13px;margin-top:2px}
.head-sp{flex:1}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--r-sm);font-size:12px;font-weight:600;transition:filter .15s,background .15s}
.btn:hover{filter:brightness(.94)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn-red{background:var(--red);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-dark{background:var(--ink2);color:#fff}
.btn-ghost{background:var(--surface);color:var(--ink3);border:1px solid var(--line);box-shadow:var(--sh-sm)}
.btn-ghost:hover{background:var(--surface2);filter:none}
.btn-soft{background:var(--red-soft);color:var(--red)}
.btn-pill{border-radius:var(--pill);padding:9px 20px}
.btn-sm{padding:6px 10px;font-size:11px}
.icon-btn{width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center}
.icon-btn.red{background:var(--red);color:#fff}
.icon-btn.grey{background:#E5E7EB;color:#475569}

.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh);padding:18px}
.card-flat{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--line)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h3{font-size:14px;font-weight:700;letter-spacing:-.1px}
.card-h .sp{flex:1}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted2)}
.muted{color:var(--muted)}
.tiny{font-size:11.5px}
.mono{font-variant-numeric:tabular-nums}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:var(--r-sm);background:var(--line2);color:#374151;font-size:10.5px;font-weight:600;letter-spacing:.2px}
.chip-out{background:transparent;border:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:var(--pill);font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
.pill .n{background:rgba(0,0,0,.22);color:#fff;min-width:16px;height:16px;padding:0 4px;border-radius:var(--pill);display:grid;place-items:center;font-size:10px}
.st-new{background:#E0E7FF;color:#3730A3}
.st-failed{background:#6B7280;color:#fff}
.st-qualified{background:var(--green-500);color:#fff}
.st-prequalified{background:#CFF3FB;color:#0B6E85}
.st-cold{background:#E2E8F0;color:#475569}
.st-junk{background:#FFE3E3;color:#C92A2A}
.st-activated{background:var(--green);color:#fff}
.stage-chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:#475569;background:var(--slate-soft);padding:3px 9px;border-radius:var(--pill)}
.due{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:var(--pill)}
.due-over{background:var(--red-soft2);color:#B42318}
.due-today{background:var(--amber-soft);color:var(--amber)}
.due-soon{background:var(--slate-soft);color:var(--slate)}
.due-none{color:var(--muted2);font-size:11px}

.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:0 0 34px}
.av-sm{width:24px;height:24px;flex:0 0 24px;font-size:9.5px}
.av-lg{width:56px;height:56px;flex:0 0 56px;font-size:19px}

/* segmented tabs */
.seg{display:flex;gap:6px;background:var(--surface);padding:6px;border-radius:var(--r-lg);box-shadow:var(--sh);overflow-x:auto;margin-bottom:14px}
.seg button{flex:1;white-space:nowrap;padding:9px 14px;border-radius:var(--r-sm);font-size:12.5px;font-weight:500;color:#111;display:flex;align-items:center;justify-content:center;gap:7px}
.seg button:hover{background:var(--surface2)}
.seg button.on{background:var(--blue);color:#fff;font-weight:600}
.seg button.on .c{background:rgba(255,255,255,.28);color:#fff}
.seg .c{font-size:10.5px;font-weight:700;background:#EEF1F4;color:#475569;padding:1px 7px;border-radius:var(--pill)}

.searchbar{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh);padding:10px 12px;margin-bottom:14px}
.search-input{flex:1;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:var(--pill);padding:0 6px 0 14px;height:38px}
.search-input input{flex:1;border:0;outline:0;font-size:13px;background:transparent;height:100%}
.search-input input::placeholder{color:var(--muted2)}

/* tables */
.tbl-wrap{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh);overflow:hidden}
.tbl-scroll{overflow-x:auto}
table.data{min-width:1020px}
table.data th{background:var(--surface2);text-align:left;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#475569;padding:13px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data td{padding:14px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.data tbody tr{cursor:pointer;transition:background .12s}
table.data tbody tr:hover{background:#FBFCFD}
table.data tbody tr:last-child td{border-bottom:0}
.cell-name{display:flex;align-items:center;gap:10px}
.cell-name .nm{font-weight:600;font-size:13px;color:var(--ink)}
.cell-contact{display:flex;flex-direction:column;gap:5px}
.cc-row{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#374151}
.wa{width:19px;height:19px;border-radius:50%;background:#25D366;display:grid;place-items:center;flex:0 0 19px}
.tbl-foot{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface2);font-size:12px;color:var(--muted)}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:14px;margin-bottom:18px}
.stat{border-radius:var(--r-lg);padding:16px;color:#fff;display:flex;align-items:center;gap:13px;box-shadow:var(--sh-md);position:relative;overflow:hidden}
.stat .ico{width:42px;height:42px;border-radius:var(--r);background:rgba(255,255,255,.22);display:grid;place-items:center;flex:0 0 42px}
.stat .lbl{font-size:10.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;opacity:.95}
.stat .val{font-size:26px;font-weight:800;line-height:1.1;letter-spacing:-.5px}
.s-red{background:linear-gradient(135deg,#EF4444,#B91C1C)}
.s-green{background:linear-gradient(135deg,#4ADE80,#059669)}
.s-blue{background:linear-gradient(135deg,#60A5FA,#2563EB)}
.s-amber{background:linear-gradient(135deg,#FBBF24,#D97706)}
.s-purple{background:linear-gradient(135deg,#C084FC,#9333EA)}
.s-slate{background:linear-gradient(135deg,#94A3B8,#475569)}
.stat.plain{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.stat.plain .ico{background:var(--red-soft);color:var(--red)}
.stat.plain .lbl{color:var(--muted)}

.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
@media(max-width:1120px){.grid2,.grid3{grid-template-columns:1fr}}

/* list rows */
.lrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line2)}
.lrow:last-child{border-bottom:0}
.lrow .grow{flex:1;min-width:0}
.lrow .t{font-weight:600;font-size:13px}
.lrow .s{font-size:11.5px;color:var(--muted)}

/* cadence tracker */
.cad{display:flex;gap:0;align-items:flex-start;margin:6px 0 4px}
.cad-step{flex:1;text-align:center;position:relative;padding-top:26px}
.cad-step:before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--line)}
.cad-step:first-child:before{display:none}
.cad-step .bub{position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--muted2)}
.cad-step.done .bub{background:#6B7280;border-color:#6B7280;color:#fff}
.cad-step.done:before{background:#6B7280}
.cad-step.now .bub{background:var(--amber-500);border-color:var(--amber-500);color:#fff;box-shadow:0 0 0 4px #FEF3C7}
.cad-step.cold .bub{background:#475569;border-color:#475569;color:#fff}
.cad-step .lb{font-size:10px;font-weight:700;color:#475569;letter-spacing:.2px}
.cad-step .dt{font-size:10px;color:var(--muted2)}
.banner{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:var(--r);font-size:12.5px;line-height:1.45}
.banner b{font-weight:700}
.bn-amber{background:var(--amber-soft);color:#78350F}
.bn-red{background:var(--red-soft2);color:#7F1D1D}
.bn-green{background:var(--green-soft);color:#14532D}
.bn-blue{background:var(--blue-soft);color:#1E3A8A}
.bn-slate{background:var(--slate-soft);color:#334155}

/* timeline */
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 18px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-26px;top:1px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);color:var(--muted)}
.tl-dot.red{background:var(--red-soft);border-color:var(--red-soft2);color:var(--red)}
.tl-dot.green{background:var(--green-soft);border-color:#C3F0CD;color:var(--green)}
.tl-dot.blue{background:var(--blue-soft);border-color:#DBEAFE;color:var(--blue-700)}
.tl-t{font-size:12.5px;font-weight:600}
.tl-b{font-size:12px;color:var(--muted);margin-top:2px}
.tl-m{font-size:10.5px;color:var(--muted2);margin-top:3px}

/* checklist */
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:var(--r);cursor:pointer}
.chk:hover{background:var(--surface2)}
.chk .box{width:19px;height:19px;flex:0 0 19px;border-radius:5px;border:2px solid #CBD5E1;display:grid;place-items:center;margin-top:1px;transition:.15s}
.chk.on .box{background:var(--green);border-color:var(--green);color:#fff}
.chk .t{font-size:12.5px;font-weight:600}
.chk .s{font-size:11.5px;color:var(--muted)}

/* kv */
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted);white-space:nowrap}
.kv .v{font-weight:600;text-align:right}

/* modal */
.ovl{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--sh-lg);width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;animation:pop .18s ease-out}
.modal.wide{max-width:720px}
@keyframes pop{from{transform:translateY(10px);opacity:0}}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:15px;font-weight:700}
.modal-b{padding:18px;overflow-y:auto}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);background:var(--surface2);border-radius:0 0 14px 14px}
.opt{display:flex;gap:11px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:var(--r);cursor:pointer;margin-bottom:9px;transition:.15s}
.opt:hover{border-color:#CBD5E1;background:var(--surface2)}
.opt.on{border-color:var(--red);background:var(--red-soft)}
.opt .radio{width:18px;height:18px;flex:0 0 18px;border-radius:50%;border:2px solid #CBD5E1;margin-top:1px;display:grid;place-items:center}
.opt.on .radio{border-color:var(--red)}
.opt.on .radio:after{content:"";width:9px;height:9px;border-radius:50%;background:var(--red)}
.opt .t{font-size:13px;font-weight:600}
.opt .s{font-size:11.5px;color:var(--muted);margin-top:2px}
label.fl{display:block;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
input.fi,textarea.fi,select.fi{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;font:inherit;font-size:13px;background:var(--surface);color:var(--ink)}
textarea.fi{min-height:74px;resize:vertical}
input.fi:focus,textarea.fi:focus,select.fi:focus{outline:2px solid var(--blue);outline-offset:0;border-color:transparent}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slot{padding:8px 13px;border:1.5px solid var(--line);border-radius:var(--r);font-size:12.5px;font-weight:600;cursor:pointer}
.slot.on{border-color:var(--green);background:var(--green-soft);color:var(--green)}

/* toasts */
#toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:9px;max-width:340px}
.toast{background:var(--ink2);color:#fff;padding:11px 14px;border-radius:var(--r);box-shadow:var(--sh-lg);font-size:12.5px;display:flex;gap:9px;align-items:flex-start;animation:slide .2s ease-out}
.toast.ok{background:var(--green)}
.toast.warn{background:var(--amber)}
@keyframes slide{from{transform:translateX(16px);opacity:0}}

/* ================= v2 — omnichannel integration ================= */
.topsearch{flex:1;max-width:520px;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:var(--pill);height:34px;padding:0 14px}
.topsearch input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:12.5px}
.topsearch kbd{font-size:10px;font-weight:700;color:var(--muted2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--surface2)}
.cap{display:flex;align-items:center;gap:7px;padding:4px 11px;border-radius:var(--pill);background:var(--green-soft);color:#14532D;font-size:11px;font-weight:700}
.cap .bars{display:flex;gap:2px}
.cap .bars i{width:5px;height:12px;border-radius:2px;background:#BBF7D0}
.cap .bars i.on{background:var(--green)}

/* saved-view rail */
.vrail{display:flex;gap:6px;overflow-x:auto;padding:6px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh);margin-bottom:14px}
.vrail button{white-space:nowrap;padding:8px 13px;border-radius:var(--r-sm);font-size:12.5px;color:#111;display:flex;align-items:center;gap:7px;font-weight:500}
.vrail button:hover{background:var(--surface2)}
.vrail button.on{background:var(--blue);color:#fff;font-weight:600}
.vrail button.on .c{background:rgba(255,255,255,.28);color:#fff}
.vrail .c{font-size:10.5px;font-weight:700;background:#EEF1F4;color:#475569;padding:1px 7px;border-radius:var(--pill)}
.vrail .sep{width:1px;background:var(--line);margin:4px 4px;flex:0 0 1px}
.vrail .grp{font-size:9.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted2);align-self:center;padding:0 6px}

/* whatsapp session window */
.wchip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:var(--pill);white-space:nowrap}
.w-open{background:#E7F9EE;color:#1B7F3B}
.w-soon{background:var(--amber-soft);color:var(--amber)}
.w-shut{background:var(--slate-soft);color:var(--slate)}
.winbar{display:flex;align-items:center;gap:10px;padding:9px 13px;font-size:12px;font-weight:600;border-radius:var(--r)}
.winbar.open{background:#E7F9EE;color:#14532D}
.winbar.shut{background:var(--amber-soft);color:#78350F}
.winbar .sp{flex:1}

/* ownership lock */
.lockbar{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--r);background:var(--slate-soft);color:#334155;font-size:12.5px}
.lockbar b{font-weight:700}
.why{font-size:10.5px;color:var(--muted);font-style:normal}
.btn[disabled]+.why{display:inline}

/* split workspace */
.split{display:grid;grid-template-columns:minmax(390px,46fr) minmax(420px,54fr);gap:16px;align-items:start}
@media(max-width:1180px){.split{grid-template-columns:1fr}}
.pane{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh);overflow:hidden}
.pane-h{display:flex;align-items:center;gap:9px;padding:12px 15px;border-bottom:1px solid var(--line);background:var(--surface2)}
.pane-h h3{font-size:13px;font-weight:700}
.pane-h .sp{flex:1}
.pane-b{padding:15px}

/* conversation */
.conv{display:flex;flex-direction:column;height:min(76vh,780px)}
.thread{flex:1;overflow-y:auto;padding:16px;background:linear-gradient(180deg,#FBFCFD,#F7F9FA);display:flex;flex-direction:column;gap:12px}
.thread::-webkit-scrollbar{width:7px}
.thread::-webkit-scrollbar-thumb{background:#DFE3E8;border-radius:9px}
.daysep{text-align:center;font-size:10.5px;font-weight:700;color:var(--muted2);letter-spacing:.6px;text-transform:uppercase;margin:4px 0}
.msg{display:flex;gap:8px;max-width:82%}
.msg.out{align-self:flex-end;flex-direction:row-reverse}
.msg .bubble{padding:9px 12px;border-radius:14px;font-size:13px;line-height:1.55;box-shadow:var(--sh-sm)}
.msg.in .bubble{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.out .bubble{background:#E7F3FF;border:1px solid #CFE4FB;border-bottom-right-radius:5px}
.msg .meta{font-size:10px;color:var(--muted2);margin-top:4px;display:flex;align-items:center;gap:5px}
.msg.out .meta{justify-content:flex-end}
.chdot{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex:0 0 18px;color:#fff}
.ch-whatsapp{background:#25D366}.ch-portal{background:#22B8CF}.ch-voice{background:#F59E0B}.ch-email{background:#8B5CF6}
.msg.note{align-self:center;max-width:92%}
.msg.note .bubble{background:#FFFBEB;border:1px dashed #FDE68A;color:#78350F;font-size:12px;border-radius:10px}
.msg.call .bubble{background:var(--surface2);border:1px solid var(--line);color:var(--ink3);font-size:12.5px;border-radius:10px}
.msg.sys{align-self:center}
.msg.sys .bubble{background:transparent;border:0;box-shadow:none;color:var(--muted2);font-size:11px;padding:2px}
.tplmark{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#7C2D12;background:#FFEDD5;padding:1px 6px;border-radius:4px;margin-bottom:5px}
.collide{display:flex;align-items:center;gap:8px;padding:7px 13px;background:#FFF4E6;color:#9A3412;font-size:11.5px;font-weight:600;border-bottom:1px solid #FFE0B2}

/* composer */
.composer{border-top:1px solid var(--line);background:var(--surface);padding:11px 13px}
.comp-tabs{display:flex;gap:6px;margin-bottom:9px}
.comp-tabs button{padding:5px 12px;border-radius:var(--pill);font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface2)}
.comp-tabs button.on{background:var(--ink2);color:#fff}
.comp-box{border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;min-height:64px;font-size:13px;color:var(--muted2);background:var(--surface)}
.comp-box.note{background:#FFFBEB;border-color:#FDE68A}
.comp-box.filled{color:var(--ink)}
.comp-row{display:flex;gap:8px;align-items:center;margin-top:9px}
.comp-row .sp{flex:1}
.tplbtn{display:flex;align-items:center;gap:7px;padding:8px 12px;border:1px dashed var(--amber-500);border-radius:var(--r);background:var(--amber-soft);color:#78350F;font-size:12px;font-weight:600;width:100%;justify-content:center}
.tpl-item{display:flex;gap:11px;align-items:flex-start;padding:11px;border:1.5px solid var(--line);border-radius:var(--r);cursor:pointer;margin-bottom:8px}
.tpl-item:hover{border-color:#CBD5E1;background:var(--surface2)}
.tpl-item.on{border-color:var(--red);background:var(--red-soft)}
.tpl-item .k{font-size:10.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.tpl-body{background:var(--surface2);border-left:3px solid var(--red-500);padding:9px 12px;border-radius:0 var(--r) var(--r) 0;font-size:12.5px;line-height:1.6;color:var(--ink3);margin-top:7px}
.var{background:#FFEDD5;color:#7C2D12;padding:0 4px;border-radius:3px;font-weight:700;font-size:11.5px}

/* macros */
.macro{display:flex;gap:11px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px;cursor:pointer;background:var(--surface)}
.macro:hover{border-color:#CBD5E1;box-shadow:var(--sh-sm)}
.macro .mi{width:32px;height:32px;flex:0 0 32px;border-radius:var(--r);background:var(--red-soft);color:var(--red);display:grid;place-items:center}
.macro .t{font-size:13px;font-weight:600}
.macro .does{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.does span{font-size:10px;font-weight:600;background:var(--slate-soft);color:#475569;padding:2px 7px;border-radius:var(--pill)}

/* misc v2 */
.own-me{box-shadow:inset 3px 0 0 var(--green)}
.ro{opacity:.72}
.mini-kpi{display:flex;gap:10px;flex-wrap:wrap}
.mk{flex:1;min-width:140px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh);padding:13px}
.mk .lbl{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.mk .val{font-size:22px;font-weight:800;letter-spacing:-.4px;line-height:1.2;margin-top:3px}
.mk .sub{font-size:10.5px;color:var(--muted)}
.claimrow{display:flex;align-items:center;gap:11px;padding:11px;border:1px dashed var(--line);border-radius:var(--r);margin-bottom:9px;background:var(--surface2)}
.qa{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:9px}
.qa .sc{font-size:19px;font-weight:800;letter-spacing:-.4px}

/* ================= admin ================= */
.roleswitch{display:flex;gap:3px;background:var(--line2);border-radius:var(--pill);padding:3px}
.roleswitch button{padding:5px 13px;border-radius:var(--pill);font-size:11.5px;font-weight:700;color:var(--muted)}
.roleswitch button.on{background:var(--ink2);color:#fff}
.adm .nav-ico{background:#EEF2FF;color:#4F46E5}
.adm-badge{margin-left:auto;font-size:9px;font-weight:800;letter-spacing:.5px;background:#EEF2FF;color:#4F46E5;padding:2px 6px;border-radius:var(--pill)}

/* charts */
.chartwrap{position:relative}
.chartwrap svg{max-width:100%;height:auto;display:block}
.ctip{position:absolute;pointer-events:none;background:var(--ink2);color:#fff;font-size:11px;font-weight:600;padding:6px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-135%);opacity:0;transition:opacity .12s;z-index:5}
.ctip.on{opacity:1}
.ctip .s{display:block;font-weight:400;opacity:.75;font-size:10px}
.legendline{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px}
.legendline i{display:inline-block;width:16px;height:2px;background:var(--red);vertical-align:3px;margin-right:5px}
.legendline i.dash{background:repeating-linear-gradient(90deg,#94A3B8 0 4px,transparent 4px 8px);height:2px}

/* meters inside tables */
.meter{display:flex;align-items:center;gap:8px;min-width:120px}
.meter .track{flex:1;height:6px;border-radius:9px;background:var(--line2);overflow:hidden;min-width:52px}
.meter .track i{display:block;height:100%;border-radius:9px}
.meter .v{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
table.adm-t{width:100%;min-width:720px}
table.adm-t th{background:var(--surface2);text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#475569;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.adm-t td{padding:12px;border-bottom:1px solid var(--line2);font-size:12.5px;vertical-align:middle}
table.adm-t tbody tr:hover{background:#FBFCFD}
.hm{display:inline-block;min-width:44px;text-align:center;padding:5px 8px;border-radius:6px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}

/* rules */
.rule{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);margin-bottom:12px;overflow:hidden}
.rule-h{display:flex;align-items:center;gap:10px;padding:13px 15px;background:var(--surface2);border-bottom:1px solid var(--line)}
.rule-h h4{font-size:13px;font-weight:700}
.rule-h .sp{flex:1}
.rule-b{padding:14px 15px;display:grid;grid-template-columns:88px 1fr;gap:9px 14px;align-items:start}
.rule-b .lb{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted2);padding-top:3px}
.cond{display:inline-flex;align-items:center;gap:6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;background:var(--slate-soft);color:#334155;padding:3px 8px;border-radius:5px;margin:0 5px 5px 0}
.cond.act{background:#EEF2FF;color:#3730A3}
.cond.trg{background:var(--amber-soft);color:#78350F}
.sw{width:38px;height:21px;border-radius:var(--pill);background:#CBD5E1;position:relative;flex:0 0 38px;transition:.15s;cursor:pointer}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.15s;box-shadow:var(--sh-sm)}
.sw.on{background:var(--green)}
.sw.on:after{left:19px}

/* config rows */
.cfgrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line2)}
.cfgrow:last-child{border-bottom:0}
.cfgrow .k{flex:1;min-width:180px}
.cfgrow .k .t{font-size:13px;font-weight:600}
.cfgrow .k .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.cfgrow input.num-in{width:76px;text-align:center;border:1px solid var(--line);border-radius:var(--r);padding:7px 8px;font:inherit;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.cfgrow input.num-in.changed{border-color:var(--amber-500);background:var(--amber-soft)}
.pending{display:flex;align-items:center;gap:10px;padding:12px 15px;border-radius:var(--r-lg);background:var(--amber-soft);color:#78350F;font-size:12.5px;margin-bottom:14px;flex-wrap:wrap}
.pending .sp{flex:1}
.diff{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.diff div{padding:5px 11px}
.diff .minus{background:#FEF2F2;color:#B42318}
.diff .plus{background:#ECFDF5;color:#166534}
.ver{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line2)}
.ver .dot{width:24px;height:24px;flex:0 0 24px;border-radius:50%;background:var(--slate-soft);color:#475569;display:grid;place-items:center;font-size:10px;font-weight:800}
.ver.live .dot{background:var(--green);color:#fff}

/* monitor */
.mon{display:grid;grid-template-columns:minmax(300px,34fr) minmax(400px,66fr);gap:16px;align-items:start}
@media(max-width:1180px){.mon{grid-template-columns:1fr}}
.convrow{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-bottom:1px solid var(--line2);cursor:pointer}
.convrow:hover{background:var(--surface2)}
.convrow.on{background:var(--red-soft);box-shadow:inset 3px 0 0 var(--red)}
.convrow .t{font-size:12.5px;font-weight:600}
.convrow .s{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seat{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.seat:last-child{border-bottom:0}
.capbar{display:flex;gap:3px}
.capbar i{width:7px;height:14px;border-radius:2px;background:var(--line2)}
.capbar i.on{background:var(--green)}
.capbar i.full{background:var(--amber-500)}

/* audit */
.aud{display:grid;grid-template-columns:150px 1fr;gap:10px 14px;padding:11px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.aud .when{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.aud .who{font-weight:600}
.aud .what{color:var(--ink3)}
.aud code{background:var(--slate-soft);padding:1px 5px;border-radius:4px;font-size:11.5px}

/* tabs */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{padding:10px 15px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--red);border-bottom-color:var(--red)}
.tabs button:hover{color:var(--ink)}
.alert{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);margin-bottom:9px;font-size:12.5px}
.alert .ai{width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:grid;place-items:center}
.al-red{background:var(--red-soft2)}.al-red .ai{background:#FCA5A5;color:#7F1D1D}
.al-amber{background:var(--amber-soft)}.al-amber .ai{background:#FCD34D;color:#78350F}
.al-blue{background:var(--blue-soft)}.al-blue .ai{background:#BFDBFE;color:#1E3A8A}

/* ================= availability & time model ================= */
.avail{display:flex;align-items:center;gap:10px}
.availbar{flex:1;min-width:90px;height:10px;border-radius:9px;background:var(--line2);overflow:hidden;display:flex}
.availbar i{display:block;height:100%}
.availbar i.wt{background:#7C3AED}
.availbar i.fc{background:#DC2626}
.availbar i.cd{background:#F59E0B}
.availbar i.free{background:#D1FAE5}
.avail .pc{font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;min-width:42px;text-align:right}
.legend-t{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);margin-top:8px}
.legend-t span{display:inline-flex;align-items:center;gap:5px}
.legend-t i{width:9px;height:9px;border-radius:3px;display:inline-block}
.tbreak{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line2);margin:8px 0 6px}
.tbreak i{display:block;height:100%}
.t-msg{background:#3B82F6}.t-call{background:#F59E0B}.t-wt{background:#7C3AED}.t-act{background:#2B8A3E}
.slot{--x:0}
.statechip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--pill);font-size:10.5px;font-weight:700}
.s-free{background:#E7F9EE;color:#1B7F3B}
.s-tight{background:var(--amber-soft);color:var(--amber)}
.s-full{background:var(--red-soft2);color:#B42318}
.s-call{background:#EDE9FE;color:#5B21B6}
.assigned{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:#3730A3;background:#EEF2FF;padding:2px 8px;border-radius:var(--pill)}
.waitcap{background:repeating-linear-gradient(45deg,#FFF7ED 0 8px,#FFEDD5 8px 16px)}

/* ---------- resource hub article (unchanged) ---------- */
.art{max-width:980px}
.art>p,.art>ul,.art .steps,.art .callout,.art h3,.art h4{max-width:70ch}
.art-hero{background:linear-gradient(135deg,#1F2937,#111827);color:#fff;border-radius:var(--r-lg);padding:26px 28px;margin-bottom:22px}
.art-hero h2{color:#fff;font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1.18}
.art-hero p{color:#E2E8F0;font-size:14px;margin:10px 0 0;max-width:62ch}
.art-meta{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:16px;font-size:11.5px;color:#94A3B8}
.art h3{font-size:19px;font-weight:700;letter-spacing:-.3px;margin:34px 0 10px}
.art h4{font-size:14.5px;font-weight:700;margin:22px 0 6px}
.art p{font-size:14.5px;line-height:1.68;color:var(--ink3);margin:0 0 13px}
.art ul{margin:0 0 14px;padding-left:20px}
.art li{font-size:14.5px;line-height:1.62;color:var(--ink3);margin-bottom:7px}
.art strong{color:var(--ink);font-weight:700}
figure{margin:22px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;overflow-x:auto}
figure svg{max-width:100%;height:auto;display:block;margin:0 auto}
figcaption{font-size:12px;color:var(--muted);margin-top:14px;text-align:center;line-height:1.5;max-width:64ch;margin-left:auto;margin-right:auto}
.steps{counter-reset:s;margin:18px 0}
.step{display:flex;gap:14px;padding:15px 0;border-top:1px solid var(--line2)}
.step .n{width:28px;height:28px;flex:0 0 28px;border-radius:8px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;font-weight:800;font-size:12px}
.step h4{margin:0 0 4px}
.step p{margin:0;font-size:13.5px}
.step .when{font-size:11px;font-weight:700;color:var(--green);letter-spacing:.3px;text-transform:uppercase;margin-top:5px}
table.doc{width:100%;font-size:13.5px;margin:16px 0;min-width:520px}
table.doc th{background:var(--surface2);text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#475569;border-bottom:1px solid var(--line)}
table.doc td{padding:11px 12px;border-bottom:1px solid var(--line2);color:var(--ink3);vertical-align:top}
.tbl-x{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg)}
.callout{border-left:4px solid var(--red);background:var(--red-soft);padding:14px 16px;border-radius:0 var(--r) var(--r) 0;margin:18px 0}
.callout.green{border-color:var(--green);background:var(--green-soft)}
.callout h4{margin:0 0 6px;font-size:13.5px}
.callout p{margin:0;font-size:13.5px}
.calc{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;font-size:13px;background:var(--surface);min-width:340px}
.calc-h{background:var(--surface2);padding:10px 14px;font-weight:700;font-size:12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.calc-r{display:flex;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--line2)}
.calc-r.tot{background:var(--red-soft);font-weight:800;border-bottom:0}
.calc-r .k{color:var(--ink3)}
.calc-r .v{font-weight:600;font-variant-numeric:tabular-nums}
.cov{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.cov{grid-template-columns:1fr}}
.cov-c{border:1px solid var(--line);border-radius:var(--r);padding:13px}
.cov-c .cn{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin-bottom:9px}
.bar{height:7px;border-radius:9px;background:var(--line2);overflow:hidden;margin:5px 0 3px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--green-500)}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}
.hub-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:.15s}
.hub-card:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.hub-card .ic{width:36px;height:36px;border-radius:var(--r);display:grid;place-items:center;background:var(--red-soft);color:var(--red)}
.hub-card h4{font-size:13.5px;font-weight:700}
.hub-card p{font-size:12px;color:var(--muted);margin:0;line-height:1.5}
.player{position:relative;border-radius:var(--r-lg);overflow:hidden;background:linear-gradient(135deg,#1E293B,#0F172A);aspect-ratio:16/7;display:grid;place-items:center;color:#fff}
.play-btn{width:62px;height:62px;border-radius:50%;background:var(--red);display:grid;place-items:center;box-shadow:0 8px 24px rgba(220,38,38,.45)}
.chapters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chapter{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:var(--pill);background:var(--slate-soft);color:#334155}
.acc{border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden;background:var(--surface)}
.acc-h{display:flex;gap:10px;align-items:center;padding:13px 15px;width:100%;text-align:left;font-size:13.5px;font-weight:600}
.acc-h:hover{background:var(--surface2)}
.acc-h .ch{margin-left:auto;transition:transform .18s;color:var(--muted)}
.acc.open .acc-h .ch{transform:rotate(90deg)}
.acc-b{padding:0 15px 15px;font-size:13.5px;color:var(--ink3);line-height:1.6}
.acc-b .lbl{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--red);display:block;margin-bottom:5px}
.script{background:var(--surface2);border-left:3px solid var(--red-500);padding:11px 14px;border-radius:0 var(--r) var(--r) 0;margin:9px 0;font-size:13.5px;line-height:1.62;color:var(--ink3)}
.script em{color:var(--muted);font-style:italic}
.kpi-bar{height:8px;border-radius:9px;background:var(--line2);overflow:hidden;position:relative;margin-top:6px}
.kpi-bar i{display:block;height:100%;border-radius:9px}
.kpi-bar .mark{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink2);opacity:.55}

const CHECKS = [
  {k:'real',  t:'Real, reachable person',      s:'Answered at least one call; phone verified'},
  {k:'intent',t:'Real intent',                 s:'Can name what they sell and in which market'},
  {k:'walk',  t:'Walkthrough delivered',       s:'Or explicitly waived by an experienced seller'},
  {k:'docs',  t:'Documents complete',          s:'No pending missing-documents item'},
  {k:'expect',t:'Expectations set',            s:'Can answer "what happens after activation?"'},
];

let tk = 48200, cc = 4100;
function build(x,i){
  const id='L'+(i+1);
  const L={
    id, ticket:'#'+(++tk), contactCode:'CT-'+(++cc), conv:'C-'+(4800+i),
    name:x.n, ar:x.a, country:x.c, city:x.ct, store:x.st, phone:x.ph, email:x.em,
    source:x.src, channel:x.ch, utm:x.utm, registeredAt:iso(d(x.reg)), ownerId:x.own,
    status:x.s, stage:x.stg, attempts:x.at||0, quiet:x.q||0,
    nextAt: (x.nx===null||x.nx===undefined)?null:iso(d(x.nx)),
    walkthrough: x.wt===undefined?null:{at:iso(new Date(d(x.wt).getTime()+11*HOUR)), mode:x.wtm},
    activatedAt: x.act===undefined?null:iso(d(x.act)),
    firstOrderAt: x.order===undefined?null:iso(d(x.order)),
    intent:x.intent, volume:x.vol, notes:'', handoff:null, checks:{},
    waitingCapacity:!!x.wait, waitReason: x.wait?'Registered 22:40 — outside business hours':null,
    assignedAt: x.own?iso(d(x.reg)):null,
    color:['#DC2626','#0E7490','#7C3AED','#2B8A3E','#B45309','#2563EB'][i%6],
    msgs:[], tl:[]
  };
  CHECKS.forEach(c=>L.checks[c.k]=false);
  const done = L.stage==='activated';
  if(done||['qualified','prequalified'].includes(L.status)){ L.checks.real=true; L.checks.intent=true; }
  if(done){ CHECKS.forEach(c=>L.checks[c.k]=true);
    L.handoff={am:AMS[i%3], profile:`${x.n} — ${x.ct}, ${x.c}. ${x.st}.`, intent:x.intent,
      services:'Fulfilment + call-center confirmation + COD collection',
      objections:'Fee level — resolved on the calculator with his own numbers',
      commitments:'AM welcome call within 24h; first sourcing quote in 48h', risk:'None flagged'};
  }
  // messages
  (x.msgs||[]).forEach(t=>{
    const [dir,ch,h,kind,body,state]=t;
    L.msgs.push({dir,ch,at:iso(hrs(h)),kind,body,state:state||(dir==='out'?'read':null)});
  });
  const lastIn = [...L.msgs].reverse().find(m=>m.dir==='in');
  L.lastInboundAt = lastIn ? lastIn.at : null;
  // timeline
  const T=(off,type,title,body)=>L.tl.push({at:iso(d(off)),type,title,body,by:x.own?oa(x.own).name:'System'});
  T(x.reg,'reg','Registered — '+x.src, `Contact ${L.contactCode} created · conversation ${L.conv} opened`);
  if(x.own) T(x.reg,'assign','Assigned to '+oa(x.own).name,`Rule r1 · most free minutes on the ${x.c} queue`);
  else T(x.reg,'assign','Held — arrived outside business hours','Registered at 22:40. Queued to the 08:30 triage block, then assigned automatically. Nobody picks leads by hand.');
  for(let a=1;a<=(x.at||0);a++){
    const off=x.reg+a, last=a===(x.at||0);
    if(last && (['qualified','prequalified','junk'].includes(L.status)||done))
      T(off,'call',`Attempt ${a} — answered`, L.status==='junk'?'Number not in service. Marked Junk Lead.':`Discovery done. Status set to ${STATUS[L.status].label}.`);
    else T(off,'noanswer',`Attempt ${a} of ${NO_ANSWER_MAX} — no answer`, a===1?'Called. WhatsApp intro template sent.':'Called at a different hour of day.');
  }
  for(let f=1;f<=(x.q||0);f++) T(x.reg+(x.at||1)+f*QUIET_GAP,'quiet',`Follow-up ${f} of ${QUIET_MAX} — no reply`,'Template oa_nudge_v2 sent.');
  if(L.walkthrough) T(x.reg+(x.at||1),'book','Walkthrough booked — '+x.wtm, fmtT(L.walkthrough.at));
  if(L.stage==='hub') T(x.reg+(x.at||1),'hub','Resource Hub sent — walkthrough declined','Went-quiet cadence started.');
  if(x.s==='cold') T(x.reg+(x.at>=5?x.at+1:(x.at||1)+x.q*QUIET_GAP+1),'cold','Moved to Cold Lead',
      x.at>=NO_ANSWER_MAX?`${NO_ANSWER_MAX} daily attempts, no answer — cadence cutoff.`:`${QUIET_MAX} follow-ups, no reply — cadence cutoff.`);
  if(done) T(x.act,'activate','Activated — handed off to '+L.handoff.am,'Handoff record complete.');
  if(L.firstOrderAt) T(x.order,'order','First order placed','Counts toward the shared first-order-in-7-days KPI.');
  L.tl.sort((a,b)=>new Date(b.at)-new Date(a.at));
  return L;
}

const KEY='mdm-oa-v2';
let S={leads:SEED.map(build), view:'mine', q:'', sort:'due', openAcc:null, compTab:'reply', draft:'', tplSel:null};
try{const raw=localStorage.getItem(KEY); if(raw){const p=JSON.parse(raw); if(p&&p.leads&&p.leads.length) S.leads=p.leads;}}catch(e){}

/* =============== shared UI =============== */
function toast(msg,kind=''){ const t=document.createElement('div'); t.className='toast '+kind;

  const o=oa(id); return `<span class="av ${cls}" style="background:${o.color}" title="${o.name}">${o.init}</span>`; }

function stageChip(l){ return `<span class="stage-chip">${STAGE[l.stage].label}</span>`; }

function flagInline(c){ return `<span style="display:inline-flex;align-items:center;gap:4px;vertical-align:-2px">${flag(c)}${c}</span>`; }
function chDot(ch){ const c=CHAN[ch]||CHAN.whatsapp; return `<span class="chdot ${c.cls}" title="${c.label}">${ic(c.ico,10)}</span>`; }
function renderTpl(key,l,extra={}){ const t=tpl(key); if(!t) return '';

function openModal(html,wide){ const r=document.getElementById('modal-root');

/* =============== metrics (own scope only) =============== */
const isOpen = l => !['cold','junk'].includes(l.status) && l.stage!=='activated';
const myLeads = () => S.leads.filter(mine);
function metrics(){ const M=myLeads();
  return {
    due:  M.filter(l=>isOpen(l)&&l.nextAt&&days(l.nextAt)===0).length,
    over: M.filter(l=>isOpen(l)&&l.nextAt&&days(l.nextAt)<0).length,
    newToday: M.filter(l=>days(l.registeredAt)===0).length,
    uncontacted: M.filter(l=>l.status==='new').length,
    booked: M.filter(l=>l.stage==='booked').length,
    activated: M.filter(l=>l.stage==='activated').length,
    cold: M.filter(l=>l.status==='cold').length,
    waiting: S.leads.filter(l=>!l.ownerId&&isOpen(l)).length,
    newlyAssigned: M.filter(l=>l.assignedAt&&days(l.assignedAt)===0).length,
    shutWindows: M.filter(l=>isOpen(l)&&winState(l)==='shut').length,
    total: M.length, all: S.leads.length,

      <span class="nav-ico" style="background:#EEF2FF;color:#4F46E5">${ic('chat',15)}</span> OmniDesk

    <button class="nav-item dim" onclick="toast('Sellers — read-only for the Onboarding Agent role')">

    <button class="nav-item dim" onclick="toast('Knowledge base — read-only; articles are authored by the Senior OA')">

  document.getElementById('cap').innerHTML=`${ic('spark',12)} Available

/* =============== router =============== */
function go(h){ if(location.hash===h) render(); else location.hash=h; window.scrollTo({top:0,behavior:'instant'}); }
function render(){
  const h=location.hash||'#/', v=document.getElementById('view');
  let html;
  if(h.startsWith('#/lead/')) html=viewLead(h.split('/')[2]);
  else if(h==='#/queue') html=viewQueue();
  else if(h==='#/reminders') html=viewReminders();
  else if(h==='#/walkthroughs') html=viewWalkthroughs();
  else if(h==='#/hub/how-it-works') html=viewArticle();
  else if(h==='#/hub') html=viewHub();
  else if(h==='#/playbook') html=viewPlaybook();
  else if(h==='#/kpis') html=viewKpis();
  else html=viewDay();
  v.innerHTML=html; renderSidebar();
  const th=document.getElementById('thread'); if(th) th.scrollTop=th.scrollHeight;
}
window.addEventListener('hashchange',()=>render());
</script>
<script>
/* =============== time model =============== */
/* Every number here is configuration. Nothing is measured by a stopwatch —
   handle time is derived from what is already recorded on the ticket. */
function T(k){ return CFG[k]; }
function parseCall(body){ const m=/(\d+):(\d{2})/.exec(body||''); return m? (+m[1] + (+m[2])/60) : 0; }

function leadTime(l){
  let msg=0, call=0, wt=0, other=0, sent=0, recv=0, tplN=0, callN=0;
  (l.msgs||[]).forEach(m=>{
    if(m.kind==='call'){ callN++;
      const d=parseCall(m.body);
      call += d>0 ? d + T('wrapMin') : T('noAnswerMin');
    } else if(m.kind==='note'){ other += T('noteMin'); }
    else if(m.kind==='tpl'){ tplN++; sent++; msg += T('templateMin'); }
    else if(m.dir==='out'){ sent++; msg += T('composeMin'); }
    else { recv++; msg += T('readMin'); }
  });
  // touches recorded on the ticket but not present as a thread message
  if((l.attempts||0) > callN) call += ((l.attempts||0)-callN) * (T('noAnswerMin')+T('wrapMin')/2);
  if((l.quiet||0) > tplN)     { msg += ((l.quiet||0)-tplN) * T('templateMin'); sent += (l.quiet||0)-tplN; }
  const wtDone = l.walkthrough && (l.stage==='activated' || new Date(l.walkthrough.at) < Date.now());
  if(wtDone) wt = T('walkthroughMin') + T('wtBufferMin');
  if(l.stage==='activated') other += T('activationMin');
  const total = msg+call+wt+other;
  return {msg:+msg.toFixed(1), call:+call.toFixed(1), wt, other:+other.toFixed(1),
          total:Math.round(total), sent, recv, tplN, callN};
}
const mins = n => n>=60 ? `${Math.floor(n/60)}h ${Math.round(n%60)}m` : `${Math.round(n)}m`;

/* =============== availability =============== */
/* assignable minutes = shift − reserved blocks
   committed        = today's walkthroughs + first contacts due + cadence touches due
   free             = assignable − committed;  a lead is assignable to an agent while
                      free ≥ the cost of taking one on, and open items < the cap.        */
function availability(id){
  const open = S.leads.filter(l=>l.ownerId===id && isOpen(l));
  const wtToday = open.filter(l=>l.stage==='booked' && l.walkthrough && days(l.walkthrough.at)===0);
  const fcDue   = open.filter(l=>l.status==='new');
  const cadDue  = open.filter(l=>l.status!=='new' && l.stage!=='booked' && l.nextAt && days(l.nextAt)<=0);
  const assignable = CFG.shiftMin - CFG.reservedMin;
  const cWt = wtToday.length * (CFG.walkthroughMin + CFG.wtBufferMin);
  const cFc = fcDue.length   * (CFG.firstContactMin + CFG.wrapMin);
  const cCd = cadDue.length  * CFG.followupMin;
  const committed = cWt + cFc + cCd;
  const free = Math.max(0, assignable - committed);
  const onCall = id==='oa3';                       // demo: Noor is on a call right now
  /* Taking a lead on is not one call. It is the first contact plus the cadence tail
     that follows it, so the cost of accepting one is priced across its life.        */
  const cost = CFG.firstContactMin + CFG.wrapMin + CFG.followupMin*2;
  const byMinutes = Math.floor(free/cost);
  const byCeiling = CFG.maxOpenLeads - open.length;
  const slots = onCall ? 0 : Math.max(0, Math.min(byMinutes, byCeiling));
  const canTake = !onCall && slots > 0;
  const pct = Math.round(free/assignable*100);
  const binding = byCeiling <= byMinutes ? 'ceiling' : 'minutes';
  return {open:open.length, assignable, committed, free, pct, cWt, cFc, cCd, onCall, canTake, cost,
          slots, byMinutes, byCeiling, binding,
          state: onCall?'call' : !canTake?'full' : (pct<25||slots<=2)?'tight' : 'free',
          wtToday:wtToday.length, fcDue:fcDue.length, cadDue:cadDue.length};
}
const AV_STATE={free:['s-free','Available'],tight:['s-tight','Nearly full'],full:['s-full','At capacity'],call:['s-call','On a call']};
function availBar(a){
  const p=n=>Math.max(0,n/a.assignable*100);
  return `<div class="availbar">
    <i class="wt" style="width:${p(a.cWt)}%"></i><i class="fc" style="width:${p(a.cFc)}%"></i>
    <i class="cd" style="width:${p(a.cCd)}%"></i><i class="free" style="width:${p(a.free)}%"></i></div>`;
}
function availLegend(){
  return `<div class="legend-t">
    <span><i class="t-wt" style="background:#7C3AED"></i>walkthroughs</span>
    <span><i style="background:#DC2626"></i>first contacts</span>
    <span><i style="background:#F59E0B"></i>cadence follow-ups</span>
    <span><i style="background:#D1FAE5"></i>free</span></div>`;
}

/* =============== automatic assignment =============== */
/* The platform assigns. An agent never picks a lead — it arrives already theirs. */
function pickAgent(l){
  let pool = TEAM.filter(t=>t.countries.includes(l.country));
  if(!pool.length) pool = TEAM.slice();
  const scored = pool.map(t=>({t, a:availability(t.id)})).filter(x=>x.a.canTake);
  if(!scored.length) return null;                       // nobody free — the lead waits
  scored.sort((x,y)=> (y.a.free-x.a.free) || (x.a.open-y.a.open));
  return scored[0].t.id;
}
const TEAM_SLOTS = () => TEAM.reduce((n,t)=>n+availability(t.id).slots,0);
function autoAssign(l, why='Auto-assigned on arrival'){
  const to = pickAgent(l);
  if(!to){ l.ownerId=null; l.waitingCapacity=true; return null; }
  l.ownerId=to; l.waitingCapacity=false; l.assignedAt=iso(new Date());
  push(l,'assign',`Assigned to ${oa(to).name}`,`${why} · most free minutes on the ${l.country} queue`);
  return to;
}
function runAssignmentSweep(silent){
  let n=0;
  S.leads.filter(l=>!l.ownerId && isOpen(l)).forEach(l=>{ if(autoAssign(l,'Capacity freed — assigned by the platform')) n++; });
  if(n){ save(); if(!silent){ render(); toast(`${n} waiting lead${n>1?'s':''} assigned automatically`,'ok'); } }
  return n;
}
function forceAssign(id){
  const l=lead(id);
  const all=TEAM.map(t=>({t,a:availability(t.id)}));
  const scored=(all.filter(x=>!x.a.onCall).length?all.filter(x=>!x.a.onCall):all).sort((x,y)=>y.a.free-x.a.free)[0];
  l.ownerId=scored.t.id; l.waitingCapacity=false; l.assignedAt=iso(new Date());
  push(l,'assign',`Assigned to ${scored.t.name} by administrator`,'Capacity override — the queue was holding this lead.');
  AUDIT.unshift({at:new Date(),who:'Haithem (Administrator)',what:`Capacity override — assigned <code>${l.ticket}</code> to ${scored.t.name}`,kind:'op'});
  save(); render(); toast(`Assigned to ${scored.t.name} over capacity`,'warn');
}
</script>
<script>
/* =============== My Day =============== */
function viewDay(){

  const due=myLeads().filter(l=>isOpen(l)&&l.nextAt&&days(l.nextAt)<=0).sort((a,b)=>new Date(a.nextAt)-new Date(b.nextAt));
  const wt=myLeads().filter(l=>l.stage==='booked'&&l.walkthrough).sort((a,b)=>new Date(a.walkthrough.at)-new Date(b.walkthrough.at));
  const av=availability(ME);
  const fresh=myLeads().filter(l=>isOpen(l)&&l.status==='new').sort((a,b)=>new Date(b.registeredAt)-new Date(a.registeredAt));
  return `
  <div class="page-head">
    <div><h1 class="page-title">My Day</h1>

    <button class="btn btn-red" onclick="go('#/queue')">${ic('list',14)} Open queue</button>
  </div>

  <div class="mini-kpi" style="margin-bottom:16px">
    ${mk('Due now', m.due+m.over, m.over?`${m.over} overdue`:'on track', m.over?'#B42318':'#2B8A3E')}
    ${mk('New today', m.newToday,'first contact within 24h','#DC2626')}
    ${mk('Template-only', m.shutWindows,'window closed — costs a send','#B45309')}
    ${mk('Walkthroughs', m.booked,'booked ahead','#7C3AED')}
    ${mk('Activated', m.activated,'handed to an AM','#2B8A3E')}
    ${mk('New in your queue', m.newlyAssigned,'assigned to you today','#4F46E5')}
  </div>

  <div class="grid2">
    <div class="card">
      <div class="card-h">${ic('bell',16)}<h3>Due now — your cadence</h3><span class="sp"></span>
        <button class="btn btn-ghost btn-sm" onclick="go('#/reminders')">See all</button></div>
      ${due.length?due.map(l=>`
        <div class="lrow own-me" style="cursor:pointer;padding-left:10px" onclick="go('#/lead/${l.id}')">
          ${avatar(l)}
          <div class="grow">
            <div class="t">${esc(l.name)} <span class="ar muted" style="font-size:12px">${esc(l.ar)}</span></div>
            <div class="s" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:3px">

          </div>

          <button class="btn btn-red btn-sm" onclick="event.stopPropagation();openMacros('${l.id}')">${ic('spark',12)} Macro</button>
        </div>`).join('')
      :`<div class="empty">${ic('check',26)}<div style="margin-top:8px">Nothing due. Queue is clean.</div></div>`}
    </div>

    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card">
        <div class="card-h">${ic('calendar',16)}<h3>Your walkthroughs</h3><span class="sp"></span><span class="chip num">${wt.length}</span></div>
        ${wt.length?wt.map(l=>`<div class="lrow" style="cursor:pointer" onclick="go('#/lead/${l.id}')">

      <div class="card">
        <div class="card-h">${ic('gauge',16)}<h3>Your capacity today</h3><span class="sp"></span>
          <span class="statechip ${AV_STATE[av.state][0]}">${ic(av.state==='call'?'phone':'check',11)} ${AV_STATE[av.state][1]}</span></div>

          <span class="chip">assigned automatically</span></div>

          <div class="lrow own-me" style="cursor:pointer;padding-left:10px" onclick="go('#/lead/${l.id}')">

        :`<div class="empty tiny">Nothing new since your last check.</div>`}
        <div class="tiny muted" style="margin-top:8px">${ic('shield',11)} You never pick leads. The platform assigns by free minutes and market, so the queue stays balanced without anyone cherry-picking.</div>

}
function mk(lbl,val,sub,col){ return `<div class="mk"><div class="lbl">${lbl}</div>
  <div class="val num" style="color:${col}">${val}</div><div class="sub">${sub}</div></div>`; }
function cadLabel(l){
  if(l.stage==='booked') return `Walkthrough — ${esc(l.walkthrough.mode)}`;
  if(l.status==='failed') return `Attempt ${l.attempts+1} of ${NO_ANSWER_MAX} · no-answer cadence`;
  if(l.quiet>0||l.stage==='hub') return `Follow-up ${l.quiet+1} of ${QUIET_MAX} · went-quiet cadence`;
  return 'First contact · within 24h of registering';
}
function claim(){ toast('Leads are assigned by the platform — agents do not pick them','warn'); }

/* =============== Queue =============== */
function filtered(){
  let L=S.leads.filter(viewDef(S.view).f);
  if(S.q){const q=S.q.toLowerCase();
    L=L.filter(l=>[l.name,l.ar,l.email,l.phone,l.store,l.city,l.country,l.contactCode,l.ticket].join(' ').toLowerCase().includes(q));}
  if(S.sort==='due') L.sort((a,b)=>(a.nextAt?new Date(a.nextAt):9e15)-(b.nextAt?new Date(b.nextAt):9e15));
  if(S.sort==='newest') L.sort((a,b)=>new Date(b.registeredAt)-new Date(a.registeredAt));
  return L;
}
function viewQueue(){
  const L=filtered();
  const grp={sys:'Standard',team:'Onboarding team',me:'Mine'};
