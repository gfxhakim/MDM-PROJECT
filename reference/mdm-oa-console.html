  <div class="page-head">
    <button class="back-btn" onclick="go('#/')">${ic('back',15)}</button>
    <div><h1 class="page-title">Onboarding Queue</h1>
      <div class="page-sub">Every lead is one contact, one conversation and one open onboarding ticket</div></div>
    <span class="head-sp"></span>
    <button class="btn btn-ghost" onclick="toast('Personal saved view — a stored filter, sort and column set')">${ic('plus',14)} Save this view</button>
  </div>

  <div class="vrail">
    ${['sys','team','me'].map((g,gi)=>`
      ${gi?'<span class="sep"></span>':''}<span class="grp">${grp[g]}</span>
      ${VIEWS.filter(v=>v.g===g).map(v=>{const n=S.leads.filter(v.f).length;
        return `<button class="${S.view===v.k?'on':''}" onclick="S.view='${v.k}';render()">${v.label}<span class="c num">${n}</span></button>`;}).join('')}
    `).join('')}
  </div>

  <div class="searchbar">
    <button class="icon-btn red" onclick="toast('Filters — country, source, channel, window state, owner')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h18l-7 8v6l-4 2v-8Z"/></svg></button>
    <button class="icon-btn grey" onclick="S.sort=S.sort==='due'?'newest':'due';render();toast('Sorted by '+(S.sort==='due'?'next action due':'newest registration'))">${ic('list',15)}</button>
    <div class="search-input">${ic('search',15)}
      <input id="q" placeholder="Name, phone, store, contact code, ticket…" value="${esc(S.q)}"
        oninput="S.q=this.value;const p=this.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)">
      <button class="btn btn-red btn-pill btn-sm" onclick="render()">Search</button></div>
  </div>

  <div class="tbl-wrap"><div class="tbl-scroll"><table class="data">
    <thead><tr><th>Lead</th><th>Channel</th><th>WhatsApp window</th><th>Status</th><th>Stage</th>
      <th>Next action</th><th>First order</th><th>Owner</th></tr></thead>
    <tbody>
    ${L.length?L.map(l=>{const own=mine(l);
      return `<tr onclick="go('#/lead/${l.id}')" class="${own?'own-me':'ro'}">
      <td><div class="cell-name">${avatar(l)}
        <div><div class="nm">${esc(l.name)}</div>
        <div style="display:flex;gap:6px;align-items:center;margin-top:3px">
          <span class="chip">${l.ticket}</span><span class="ar tiny muted">${esc(l.ar)}</span></div></div></div></td>
      <td><div style="display:flex;align-items:center;gap:7px;font-size:12px">${chDot(l.channel)} ${CHAN[l.channel].label}</div>
        <div class="tiny muted" style="margin-top:3px">${flagInline(l.country)}</div></td>
      <td>${isOpen(l)?winChip(l):'<span class="due-none">—</span>'}</td>
      <td>${statusPill(l)}</td>
      <td>${stageChip(l)}</td>
      <td>${dueChip(l)}</td>
      <td>${l.firstOrderAt?`<span class="pill st-qualified">${ic('cart',11)} ${fmt(l.firstOrderAt)}</span>`:'<span class="due-none">—</span>'}</td>
      <td><div style="display:flex;align-items:center;gap:6px">${oaAvatar(l.ownerId)}
        ${own?'<span class="chip" style="background:var(--green-soft);color:var(--green)">You</span>'
             :l.ownerId?'<span class="chip" title="Read-only for you">read</span>'
             :'<span class="chip" style="background:var(--amber-soft);color:var(--amber)">holding</span>'}</div></td>
    </tr>`;}).join('')
    :`<tr><td colspan="8"><div class="empty">${ic('search',26)}<div style="margin-top:10px">No leads in this view.</div></div></td></tr>`}
    </tbody></table></div>
    <div class="tbl-foot">Showing <b class="num">${L.length}</b> · ${S.leads.filter(mine).length} assigned to you
      <span style="flex:1"></span>
      <span class="tiny">${ic('shield',11)} You can open every lead; you can only act on your own.</span>
      <button class="btn btn-ghost btn-sm" onclick="resetDemo()">${ic('refresh',12)} Reset demo</button></div>
  </div>`;
}
</script>
<script>
function push(l,type,title,body){ l.tl.unshift({at:iso(new Date()),type,title,body,by:oa(ME).name}); }
function addMsg(l,m){ l.msgs.push(Object.assign({at:iso(new Date())},m)); if(m.dir==='in') l.lastInboundAt=iso(new Date()); }

/* =============== lead workspace =============== */
function viewLead(id){
  const l=lead(id); if(!l) return `<div class="empty">Not found. <a href="#/queue" style="color:var(--red);font-weight:600">Back to queue</a></div>`;
  const own=canEdit(l), done=l.stage==='activated', dead=['cold','junk'].includes(l.status);
  const ready=CHECKS.every(c=>l.checks[c.k]);
  return `
  <div class="page-head">
    <button class="back-btn" onclick="go('#/queue')">${ic('back',15)}</button>
    <div><h1 class="page-title">${esc(l.name)}</h1>
      <div class="page-sub">${l.contactCode} · onboarding ticket ${l.ticket} · conversation ${l.conv} · registered ${rel(l.registeredAt).toLowerCase()}</div></div>
    <span class="head-sp"></span>
    ${statusPill(l)} ${stageChip(l)}
  </div>

  ${S.role==='admin'&&!mine(l)?`<div class="lockbar" style="margin-bottom:14px;background:#EEF2FF;color:#3730A3">${ic('shield',16)}
    <div><b>Acting as Administrator.</b> This lead belongs to ${l.ownerId?esc(oa(l.ownerId).name):'nobody'} — anything you change here is recorded against your name, not theirs.</div>
    <span style="flex:1"></span>
    <button class="btn btn-ghost btn-sm" onclick="go('#/a/monitor')">Monitor instead</button></div>`:''}
  ${own?'':`<div class="lockbar" style="margin-bottom:14px">${ic('shield',16)}
    <div><b>${l.ownerId?oa(l.ownerId).name+' was assigned this lead by the platform.':'Held in the queue — no agent had free capacity.'}</b>
      You can read everything and add an internal note. Replying, status changes and activation belong to the assignee.</div>
    <span style="flex:1"></span>
    ${l.ownerId?`<button class="btn btn-ghost btn-sm" onclick="requestTransfer('${l.id}')">Request transfer</button>`:''}</div>`}

  <div class="split">
    <!-- WORK -->
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card">
        <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
          ${avatar(l,'av-lg')}
          <div style="min-width:170px">
            <div style="font-size:16px;font-weight:700">${esc(l.name)}</div>
            <div class="ar" style="font-size:14px;color:var(--muted)">${esc(l.ar)}</div>
            <div style="display:flex;gap:6px;margin-top:7px;flex-wrap:wrap">
              <span class="chip">${flag(l.country)} ${esc(l.city)}</span>
              <span class="chip">${esc(l.store)}</span></div>
          </div>
          <span class="head-sp"></span>
          <div style="display:flex;flex-direction:column;gap:6px;font-size:12.5px">
            <span class="cc-row">${ic('phone',13)} <span class="num">${esc(l.phone)}</span></span>
            <span class="cc-row">${ic('mail',13)} ${esc(l.email)}</span></div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
          ${act(own&&!dead&&!done, `openMacros('${l.id}')`, 'btn-red', 'spark', 'Run a macro', 'lead not assigned to you')}
          ${act(own&&!dead&&!done, `openBook('${l.id}')`, 'btn-ghost', 'calendar', 'Book walkthrough', 'lead not assigned to you')}
          ${done?`<span class="pill st-activated">${ic('check',12)} Handed to ${esc(l.handoff.am)}</span>`
            :act(own&&ready&&!dead, `openActivate('${l.id}')`, 'btn-green', 'check', 'Activate account',
                 !own?'lead not assigned to you':`${CHECKS.filter(c=>!l.checks[c.k]).length} qualification criteria still unmet`)}
        </div>
      </div>

      ${dead?`<div class="banner ${l.status==='junk'?'bn-red':'bn-slate'}">${ic(l.status==='junk'?'trash':'snow',16)}
        <div><b>${STATUS[l.status].label}.</b> ${l.status==='junk'?'Out of the queue and excluded from every metric.'
          :'Cadence exhausted. One win-back template is scheduled for day 30, then the ticket closes.'}
        ${own?`<button class="btn btn-sm btn-ghost" style="margin-left:8px" onclick="reopen('${l.id}')">Reopen</button>`:''}</div></div>`:''}

      ${(l.attempts>0||l.status==='failed')?cadenceCard(l):''}
      ${(l.quiet>0||l.stage==='hub')?quietCard(l):''}

      ${l.walkthrough&&!done?`<div class="banner bn-blue">${ic('calendar',16)}
        <div><b>Walkthrough — ${esc(l.walkthrough.mode)}</b><br>${fmtT(l.walkthrough.at)} · 30–45 minutes</div></div>`:''}

      <div class="card">
        <div class="card-h">${ic('check',16)}<h3>Qualification checklist</h3><span class="sp"></span>
          <span class="chip" style="${ready?'background:var(--green-soft);color:var(--green)':''}">${CHECKS.filter(c=>l.checks[c.k]).length}/${CHECKS.length}</span></div>
        ${CHECKS.map(c=>`<div class="chk ${l.checks[c.k]?'on':''} ${own?'':'ro'}" ${own?`onclick="toggleCheck('${l.id}','${c.k}')"`:''}
           role="checkbox" aria-checked="${l.checks[c.k]}" ${own?'tabindex="0"':''}>
          <span class="box">${l.checks[c.k]?ic('check',12,3):''}</span>
          <span><span class="t">${c.t}</span><br><span class="s">${c.s}</span></span></div>`).join('')}
      </div>

      ${l.firstOrderAt?`<div class="card"><div class="card-h">${ic('cart',16)}<h3>Order card</h3><span class="sp"></span>
          <span class="tiny muted">live from the order domain</span></div>
        <div class="kv"><span class="k">First order</span><span class="v">${fmt(l.firstOrderAt)} · ${rel(l.firstOrderAt)}</span></div>
        <div class="kv"><span class="k">Status</span><span class="v">Confirmed — out for delivery</span></div>
        <div class="kv"><span class="k">COD amount</span><span class="v num">640 LYD</span></div>
        <div class="tiny muted" style="margin-top:8px">${ic('shield',11)} Cost and margin fields are withheld from the Onboarding Agent role.</div>
      </div>`:''}

      ${timeCard(l)}

      <div class="card">
        <div class="card-h">${ic('user',16)}<h3>Contact record</h3></div>
        <div class="kv"><span class="k">Contact</span><span class="v">${l.contactCode} · merchant</span></div>
        <div class="kv"><span class="k">Identity</span><span class="v">${l.channel==='portal'?'Portal session — strong':'Phone, E.164 — medium'}</span></div>
        <div class="kv"><span class="k">Source</span><span class="v">${esc(l.source)}</span></div>
        <div class="kv"><span class="k">UTM / affiliate</span><span class="v">${esc(l.utm)}</span></div>
        <div class="kv"><span class="k">Owner</span><span class="v" style="display:flex;gap:6px;justify-content:flex-end;align-items:center">${oaAvatar(l.ownerId)} ${l.ownerId?oa(l.ownerId).name:'Unassigned'}</span></div>
        <label class="fl">Discovery — what they sell</label>
        <p style="font-size:13px;margin:4px 0 10px;color:var(--ink3)">${esc(l.intent)} · ${esc(l.volume)}</p>
        <label class="fl">Agent notes</label>
        <textarea class="fi" ${own?'':'disabled'} placeholder="${own?'What they pushed back on, what convinced them…':'Read-only'}"
          onchange="lead('${l.id}').notes=this.value;save();toast('Note saved')">${esc(l.notes)}</textarea>
      </div>

      <div class="card">
        <div class="card-h">${ic('file',16)}<h3>Handoff record</h3></div>
        ${l.handoff?`<div class="banner bn-green tiny" style="margin-bottom:10px">${ic('check',14)}<div>Complete — counts toward clean-handoff rate.</div></div>
          <div class="kv"><span class="k">Account Manager</span><span class="v">${esc(l.handoff.am)}</span></div>
          <div class="kv"><span class="k">Commitments</span><span class="v" style="max-width:60%">${esc(l.handoff.commitments)}</span></div>
          <div class="kv"><span class="k">Risk notes</span><span class="v">${esc(l.handoff.risk)}</span></div>`
        :`<div class="banner bn-slate tiny">${ic('file',14)}<div>Written at activation. Eight fields; the AM welcome call must be scheduled within 24 hours.</div></div>`}
      </div>

      <div class="card">
        <div class="card-h">${ic('clock',16)}<h3>Ticket history</h3><span class="sp"></span><span class="tiny muted">${l.tl.length} events</span></div>
        <div class="tl">${l.tl.map(t=>{
          const map={reg:['blue','user'],assign:['blue','users'],call:['green','phone'],noanswer:['red','phone'],
            quiet:['red','clock'],book:['blue','calendar'],hub:['blue','book'],cold:['','snow'],order:['green','cart'],
            activate:['green','check'],status:['','spark'],note:['','file'],junk:['red','trash'],msg:['blue','wa']};
          const [cls,icn]=map[t.type]||['','spark'];
          return `<div class="tl-item"><span class="tl-dot ${cls}">${ic(icn,11)}</span>
            <div class="tl-t">${esc(t.title)}</div>${t.body?`<div class="tl-b">${esc(t.body)}</div>`:''}
            <div class="tl-m">${fmtT(t.at)} · ${esc(t.by)}</div></div>`;}).join('')}</div>
      </div>
    </div>

    <!-- CONVERSATION -->
    ${convPane(l,own)}
  </div>`;
}
function act(enabled,onclick,cls,icn,label,why){
  return enabled ? `<button class="btn ${cls}" onclick="${onclick}">${ic(icn,14)} ${label}</button>`
    : `<span style="display:inline-flex;flex-direction:column;gap:2px">
        <button class="btn ${cls}" disabled>${ic(icn,14)} ${label}</button>
        <span class="why">${esc(why)}</span></span>`;
}
function cadenceCard(l){
  const cold=l.attempts>=NO_ANSWER_MAX, start=new Date(l.registeredAt);
  return `<div class="card">
    <div class="card-h">${ic('phone',16)}<h3>No-answer cadence</h3><span class="sp"></span>
      <span class="chip">${l.attempts} of ${NO_ANSWER_MAX} · one a day</span></div>
    <div class="cad">
      ${Array.from({length:NO_ANSWER_MAX},(_,i)=>{const n=i+1,dn=n<=l.attempts,now=!cold&&n===l.attempts+1;
        const dt=new Date(start.getTime()+(n-1)*DAY);
        return `<div class="cad-step ${dn?'done':''} ${now?'now':''}"><span class="bub">${dn?ic('check',11,3):n}</span>
          <div class="lb">Attempt ${n}</div><div class="dt num">${dn?fmt(dt):now&&l.nextAt?fmt(l.nextAt):'—'}</div></div>`;}).join('')}
      <div class="cad-step ${cold?'cold':''}"><span class="bub">${ic('snow',11)}</span><div class="lb">Cold Lead</div><div class="dt">after ${NO_ANSWER_MAX}</div></div>
    </div>
    ${cold?`<div class="banner bn-slate" style="margin-top:14px">${ic('snow',16)}<div>All ${NO_ANSWER_MAX} attempts used — moved to Cold Lead automatically.</div></div>`
    :`<div class="banner bn-amber" style="margin-top:14px">${ic('bell',16)}
      <div><b>Attempt ${l.attempts+1} of ${NO_ANSWER_MAX} due ${l.nextAt?rel(l.nextAt).toLowerCase():'today'}.</b>
      Status stays <b>Failed to Contact</b> and the counter rises daily. Only a reply changes the status, and only by hand.</div></div>`}
  </div>`;
}
function quietCard(l){
  const cold=l.quiet>=QUIET_MAX;
  return `<div class="card">
    <div class="card-h">${ic('clock',16)}<h3>Went-quiet cadence</h3><span class="sp"></span>
      <span class="chip">${l.quiet} of ${QUIET_MAX} · every ${QUIET_GAP} days</span></div>
    <div class="cad">
      ${Array.from({length:QUIET_MAX},(_,i)=>{const n=i+1,dn=n<=l.quiet,now=!cold&&n===l.quiet+1;
        return `<div class="cad-step ${dn?'done':''} ${now?'now':''}"><span class="bub">${dn?ic('check',11,3):n}</span>
          <div class="lb">Follow-up ${n}</div><div class="dt">day ${n*QUIET_GAP}</div></div>`;}).join('')}
      <div class="cad-step ${cold?'cold':''}"><span class="bub">${ic('snow',11)}</span><div class="lb">Cold Lead</div><div class="dt">day ${QUIET_MAX*QUIET_GAP}</div></div>
    </div>
    <div class="banner ${cold?'bn-slate':'bn-blue'}" style="margin-top:14px">${ic('spark',16)}
      <div>${cold?'Three follow-ups, no reply — moved to Cold Lead.'
        :`Every follow-up here lands outside the 24-hour window, so each one is a billable template send. Ask one multiple-choice question — <em>"pricing, trust, or timing?"</em>`}</div>
  </div>`;
}
function timeCard(l){
  const t=leadTime(l), p=n=>t.total?Math.max(0,n/t.total*100):0;
  return `<div class="card">
    <div class="card-h">${ic('clock',16)}<h3>Time on this lead</h3><span class="sp"></span>
      <span class="chip" style="background:var(--slate-soft)">estimated</span>
      <span class="num" style="font-size:16px;font-weight:800">${mins(t.total)}</span></div>
    <div class="tbreak">
      <i class="t-msg" style="width:${p(t.msg)}%"></i><i class="t-call" style="width:${p(t.call)}%"></i>
      <i class="t-wt" style="width:${p(t.wt)}%"></i><i class="t-act" style="width:${p(t.other)}%"></i></div>
    <div class="legend-t" style="margin-bottom:10px">
      <span><i class="t-msg"></i>messages ${mins(t.msg)}</span><span><i class="t-call"></i>calls ${mins(t.call)}</span>
      ${t.wt?`<span><i class="t-wt"></i>walkthrough ${mins(t.wt)}</span>`:''}
      ${t.other?`<span><i class="t-act"></i>notes &amp; handoff ${mins(t.other)}</span>`:''}</div>
    <div class="kv"><span class="k">Messages sent / received</span><span class="v num">${t.sent} / ${t.recv}</span></div>
    <div class="kv"><span class="k">of which templates</span><span class="v num">${t.tplN} · billable</span></div>
    <div class="kv"><span class="k">Call attempts</span><span class="v num">${Math.max(t.callN,l.attempts||0)}</span></div>
    <div class="tiny muted" style="margin-top:8px">${ic('shield',11)} Derived from what is on the ticket — messages, calls, walkthroughs — using the minute values Operations sets. Nobody runs a stopwatch.</div>
  </div>`;
}
function toggleCheck(id,k){ const l=lead(id); if(!canEdit(l)) return; l.checks[k]=!l.checks[k]; save(); render(); }
function reopen(id){ const l=lead(id); l.status='prequalified'; l.quiet=0; l.attempts=0; l.nextAt=iso(d(0));
  push(l,'status','Queue item reopened','Returned to the active queue.'); save(); render(); toast('Reopened','ok'); }
function requestTransfer(id){ const l=lead(id);
  openModal(`<div class="modal-h">${ic('users',18)}<h3>Request transfer</h3><span style="flex:1"></span>
      <button class="tb-btn" onclick="closeModal()">${ic('x',16)}</button></div>
    <div class="modal-b">
      <div class="banner bn-slate" style="margin-bottom:14px">${ic('shield',15)}
        <div>Reassigning a lead is a shift-lead action. Your request goes to the Onboarding shift lead with the reason below.</div></div>
      <p style="font-size:13px;margin:0 0 4px"><b>${esc(l.name)}</b> — currently ${esc(oa(l.ownerId).name)}</p>
      <label class="fl">Why should this move to you?</label>
      <textarea class="fi" id="m-note" placeholder="I met this merchant at the Tripoli expo and already have the context…"></textarea>
    </div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-red" onclick="closeModal();toast('Transfer request sent to the shift lead','ok')">Send request</button></div>`);
}
</script>
<script>
/* =============== conversation pane — the OmniDesk thread, docked =============== */
function convPane(l,own){
  const st=winState(l), shut=st==='shut';
  const collide = l.id==='L5';   // demo: another agent is looking at this one
  return `<div class="pane">
    <div class="pane-h">
      <span class="chdot ${CHAN[l.channel].cls}">${ic(CHAN[l.channel].ico,10)}</span>
      <h3>Conversation ${l.conv}</h3>
      <span class="chip">${CHAN[l.channel].label}</span>
      <span class="sp"></span>
      <button class="btn btn-ghost btn-sm" onclick="toast('Opens this same conversation in the full OmniDesk workspace')">
        ${ic('link',12)} Open in OmniDesk</button>
    </div>
    ${collide?`<div class="collide">${ic('users',13)} Noor Al-Saadi is viewing this conversation right now.</div>`:''}
    <div class="conv">
      <div style="padding:10px 13px 0">
        <div class="winbar ${shut?'shut':'open'}">
          ${ic(shut?'clock':'wa',15)}
          <span>${shut?'WhatsApp window closed — free-form replies are blocked. Approved templates only.'
                     :`WhatsApp window open — ${winText(l)}. Free-form replies allowed.`}</span>
          <span class="sp"></span>
          ${shut&&own?`<button class="btn btn-sm" style="background:#78350F;color:#fff" onclick="openTemplates('${l.id}')">Choose a template</button>`:''}
        </div>
      </div>
      <div class="thread" id="thread">
        ${l.msgs.length?threadHTML(l):`<div class="empty tiny">No messages yet on this conversation.</div>`}
      </div>
      ${composer(l,own,shut)}
    </div>
  </div>`;
}
function threadHTML(l){
  let out='', lastDay=null;
  l.msgs.slice().sort((a,b)=>new Date(a.at)-new Date(b.at)).forEach(m=>{
    const dk=new Date(m.at).toDateString();
    if(dk!==lastDay){ lastDay=dk; out+=`<div class="daysep">${days(m.at)===0?'Today':days(m.at)===-1?'Yesterday':fmt(m.at)}</div>`; }
    out+=msgHTML(l,m);
  });
  return out;
}
function msgHTML(l,m){
  if(m.kind==='note') return `<div class="msg note"><div><div class="bubble">${ic('file',11)} <b>Internal note</b> — ${esc(m.body)}</div>
    <div class="meta">${fmtHM(m.at)} · ${esc(oa(ME).name)} · not visible to the merchant</div></div></div>`;
  if(m.kind==='call') return `<div class="msg call"><div><div class="bubble">${ic('phone',12)} ${esc(m.body)}</div>
    <div class="meta">${fmtHM(m.at)} · Yeastar</div></div></div>`;
  if(m.kind==='sys') return `<div class="msg sys"><div class="bubble">${esc(m.body)}</div></div>`;
  const isTpl=m.kind==='tpl';
  const body=isTpl?renderTpl(m.body,l):m.body;
  const ar=/[؀-ۿ]/.test(body);
  const st={sent:'Sent',delivered:'Delivered',read:'Read',failed:'Failed'}[m.state]||'';
  return `<div class="msg ${m.dir}">
    ${chDot(m.ch)}
    <div><div class="bubble">${isTpl?`<span class="tplmark">${ic('file',9)} template · ${esc(m.body)}</span><br>`:''}
      <span ${ar?'class="ar" dir="rtl"':''}>${esc(body)}</span></div>
      <div class="meta">${fmtHM(m.at)}${m.dir==='out'?` · ${st}${isTpl?' · billable':''}`:''}</div></div>
  </div>`;
}
function composer(l,own,shut){
  if(!own) return `<div class="composer">
    <div class="comp-tabs"><button class="on">Internal note</button></div>
    <div class="comp-box note">You can add an internal note on any lead. Public replies are limited to the lead's owner.</div>
    <div class="comp-row"><span class="sp"></span>
      <button class="btn btn-ghost btn-sm" onclick="addNote('${l.id}')">${ic('file',12)} Add note</button></div></div>`;
  const isNote=S.compTab==='note';
  return `<div class="composer">
    <div class="comp-tabs">
      <button class="${isNote?'':'on'}" onclick="S.compTab='reply';render()">Reply to merchant</button>
      <button class="${isNote?'on':''}" onclick="S.compTab='note';render()">Internal note</button>
    </div>
    ${isNote?`<div class="comp-box note">Visible to the Onboarding team only — never to the merchant.</div>
      <div class="comp-row"><span class="tiny muted">${ic('shield',11)} Notes are excluded from every customer-facing view by construction.</span>
        <span class="sp"></span><button class="btn btn-dark btn-sm" onclick="addNote('${l.id}')">${ic('file',12)} Save note</button></div>`
    : shut?`<button class="tplbtn" onclick="openTemplates('${l.id}')">${ic('file',14)} Window closed — pick an approved template</button>
        <div class="comp-row"><span class="tiny muted">${ic('shield',11)} The block is enforced server-side, not just in this composer.</span>
          <span class="sp"></span><button class="btn btn-ghost btn-sm" onclick="callNow('${l.id}')">${ic('phone',12)} Call instead</button></div>`
    :`<div class="comp-box ${S.draft?'filled':''}" contenteditable="true" role="textbox" aria-label="Reply"
         oninput="S.draft=this.textContent">${esc(S.draft)||'Write a reply…'}</div>
      <div class="comp-row">
        <button class="btn btn-ghost btn-sm" onclick="openMacros('${l.id}')">${ic('spark',12)} Macro</button>
        <button class="btn btn-ghost btn-sm" onclick="callNow('${l.id}')">${ic('phone',12)} Call</button>
        <span class="sp"></span>
        <span class="tiny muted">${winText(l)}</span>
        <button class="btn btn-red btn-sm" onclick="sendReply('${l.id}')">${ic('check',12)} Send</button>
      </div>`}
  </div>`;
}
function sendReply(id){ const l=lead(id); const body=(S.draft||'').trim();
  if(!body) return toast('Nothing to send');
  addMsg(l,{dir:'out',ch:l.channel,kind:'text',body,state:'sent'});
  push(l,'msg','Reply sent on '+CHAN[l.channel].label, body.slice(0,90));
  S.draft=''; save(); render(); toast('Sent — undo available for 10 seconds','ok'); }
function addNote(id){ const l=lead(id);
  openModal(`<div class="modal-h">${ic('file',18)}<h3>Internal note</h3><span style="flex:1"></span>
      <button class="tb-btn" onclick="closeModal()">${ic('x',16)}</button></div>
    <div class="modal-b"><textarea class="fi" id="m-note" placeholder="What you learned, what you promised…" style="min-height:110px"></textarea>
      <div class="banner bn-slate tiny" style="margin-top:12px">${ic('shield',14)}<div>Never shown to the merchant. Searchable by the team.</div></div></div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-dark" onclick="saveNote('${id}')">Save note</button></div>`); }
function saveNote(id){ const l=lead(id), v=(document.getElementById('m-note')||{}).value||'';
  if(v.trim()){ addMsg(l,{dir:'out',ch:'note',kind:'note',body:v.trim()});
    push(l,'note','Internal note added',v.slice(0,90)); save(); }
  closeModal(); render(); toast('Note saved','ok'); }
function callNow(id){ const l=lead(id);
  openModal(`<div class="modal-h">${ic('phone',18)}<h3>Call ${esc(l.name)}</h3><span style="flex:1"></span>
      <button class="tb-btn" onclick="closeModal()">${ic('x',16)}</button></div>
    <div class="modal-b">
      <div class="banner bn-blue" style="margin-bottom:14px">${ic('phone',15)}
        <div>Click-to-call dials <b class="num">${esc(l.phone)}</b> from the Onboarding line through Yeastar.
        While you are on a call your chat capacity drops to zero, and the call is attached to this conversation automatically.</div></div>
      <div class="eyebrow" style="margin-bottom:8px">Outcome</div>
      ${opt('choice','no_answer','No answer','Attempt +1, status stays Failed to Contact, reminder set for tomorrow.')}
      ${opt('choice','qualified','Answered — strong lead','Status → Qualified. Book the walkthrough next.')}
      ${opt('choice','prequalified','Answered — soft lead','Status → Pre-qualified.')}
      ${opt('choice','junk','Wrong number / not a real seller','Status → Junk Lead.')}
      <label class="fl">Wrap-up note</label>
      <textarea class="fi" id="m-note" placeholder="What was said…"></textarea>
    </div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-red" id="modal-go" disabled onclick="saveCall('${id}')">Log outcome</button></div>`);
  M={choice:null}; }
function saveCall(id){ const l=lead(id), note=(document.getElementById('m-note')||{}).value||'';
  const outcome=M.choice;
  addMsg(l,{dir:'out',ch:'voice',kind:'call',body:outcome==='no_answer'?'Outbound call · 0:00 · no answer':'Outbound call · answered'});
  applyOutcome(l,outcome,note); closeModal(); render(); }
</script>
<script>
/* =============== actions =============== */
let M={};
function pick(k,v){ M[k]=v; const r=document.getElementById('modal-root');
  r.querySelectorAll(`[data-g="${k}"]`).forEach(e=>e.classList.toggle('on',e.dataset.v===String(v)));
  const b=document.getElementById('modal-go'); if(b) b.disabled=!(M.ready?M.ready():!!M.choice); }
function opt(g,v,t,s){ return `<div class="opt" data-g="${g}" data-v="${v}" onclick="pick('${g}','${v}')">
  <span class="radio"></span><span><span class="t">${t}</span><br><span class="s">${s}</span></span></div>`; }

function applyOutcome(l,outcome,note){
  l.attempts=Math.min(l.attempts+1,NO_ANSWER_MAX);
  if(l.stage==='registered') l.stage='contacted';
  if(outcome==='no_answer'){
    l.status='failed';
    if(l.attempts>=NO_ANSWER_MAX){
      l.status='cold'; l.nextAt=null;
      push(l,'noanswer',`Attempt ${l.attempts} of ${NO_ANSWER_MAX} — no answer`,note||'Called, no answer.');
      push(l,'cold','Moved to Cold Lead',`${NO_ANSWER_MAX} daily attempts with no answer — cadence cutoff.`);
      toast(`${l.name} moved to Cold Lead after ${NO_ANSWER_MAX} attempts`,'warn');
    } else {
      l.nextAt=iso(d(1));
      push(l,'noanswer',`Attempt ${l.attempts} of ${NO_ANSWER_MAX} — no answer`,note||'Called, no answer.');
      toast(`Attempt ${l.attempts} logged. Attempt ${l.attempts+1} is due tomorrow.`,'ok');
    }
  } else if(outcome==='junk'){
    l.status='junk'; l.nextAt=null;
    push(l,'junk','Marked Junk Lead',note||'Not a real seller.');
    toast('Marked Junk Lead — excluded from your metrics');
  } else {
    l.status=outcome; l.checks.real=true; l.nextAt=iso(d(0));
    push(l,'call',`Attempt ${l.attempts} — answered`,note||`Status set to ${STATUS[outcome].label}.`);
    toast(`Set to ${STATUS[outcome].label} — book the walkthrough next`,'ok');
  }
  if(note) addMsg(l,{dir:'out',ch:'note',kind:'note',body:note});
  save();
}

/* --- macros --- */
function openMacros(id){ const l=lead(id);
  openModal(`<div class="modal-h">${ic('spark',18)}<h3>Macros — ${esc(l.name)}</h3><span style="flex:1"></span>
      <button class="tb-btn" onclick="closeModal()">${ic('x',16)}</button></div>
    <div class="modal-b">
      <div class="banner bn-slate" style="margin-bottom:14px">${ic('shield',15)}
        <div>A macro applies changes and inserts text. It never sends a message on its own — every macro states what it will do before it runs.</div></div>
      ${MACROS.map(m=>`<div class="macro" onclick="runMacro('${id}','${m.key}')">
        <span class="mi">${ic(m.ico,15)}</span>
        <div><div class="t">${m.title}</div>
          <div class="does">${m.does.map(d=>`<span>${d}</span>`).join('')}</div></div>
      </div>`).join('')}
    </div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">Close</button></div>`,true); }
function runMacro(id,key){ const l=lead(id), m=MACROS.find(x=>x.key===key);
  closeModal();
  if(key==='m_no_answer') applyOutcome(l,'no_answer',m.note);
  else if(key==='m_answered_strong') applyOutcome(l,'qualified',m.note);
  else if(key==='m_answered_soft') applyOutcome(l,'prequalified',m.note);
  else if(key==='m_junk') applyOutcome(l,'junk',m.note);
  else if(key==='m_book') return openBook(id);
  else if(key==='m_hub') return sendHub(id);
  render();
}

/* --- templates --- */
function openTemplates(id){ const l=lead(id); M={choice:null,ready:()=>!!M.choice};
  openModal(`<div class="modal-h">${ic('file',18)}<h3>Approved templates</h3><span style="flex:1"></span>

      ${TEMPLATES.map(t=>`<div class="tpl-item" data-g="choice" data-v="${t.key}" onclick="pick('choice','${t.key}');previewTpl('${id}','${t.key}')">
        <span class="radio"></span>
        <div style="flex:1"><div class="t" style="font-size:13px;font-weight:600">${t.title}</div>

      <div id="tpl-preview"></div>
    </div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-red" id="modal-go" disabled onclick="sendTemplate('${id}')">${ic('wa',13)} Send template</button></div>`,true); }
function previewTpl(id,key){ const l=lead(id);
  const body=renderTpl(key,l).replace(/(app\.mdm\.express\/hub)/,'<span class="var">$1</span>');
  document.getElementById('tpl-preview').innerHTML=`<label class="fl">Preview — variables filled from the contact record</label>
    <div class="tpl-body ar" dir="auto">${body}</div>

function sendTemplate(id){ const l=lead(id);
  addMsg(l,{dir:'out',ch:'whatsapp',kind:'tpl',body:M.choice,state:'sent'});
  push(l,'msg','Template sent — '+M.choice,'Outside the 24-hour window · billable send');
  if(M.choice==='oa_nudge_v2'||M.choice==='oa_hub_share_v1'){ l.quiet=Math.min(l.quiet+1,QUIET_MAX);
    l.nextAt=l.quiet>=QUIET_MAX?null:iso(d(QUIET_GAP));
    if(l.quiet>=QUIET_MAX){ l.status='cold'; push(l,'cold','Moved to Cold Lead',`${QUIET_MAX} follow-ups, no reply.`); } }
  save(); closeModal(); render(); toast('Template sent','ok'); }

/* --- book walkthrough --- */
function openBook(id){ const l=lead(id);
  const s1=new Date(d(1).getTime()+10*HOUR), s2=new Date(d(1).getTime()+15*HOUR), s3=new Date(d(2).getTime()+11*HOUR);
  M={choice:'slot1',mode:'Phone call',ready:()=>true,slots:{slot1:s1,slot2:s2,slot3:s3}};
  openModal(`<div class="modal-h">${ic('calendar',18)}<h3>Book the walkthrough</h3><span style="flex:1"></span>
      <button class="tb-btn" onclick="closeModal()">${ic('x',16)}</button></div>
    <div class="modal-b">
      <div class="banner bn-blue" style="margin-bottom:14px">${ic('spark',15)}
        <div>A <b>${CFG.walkthroughMin}-minute</b> call. Offer two slots, never an open question — the confirmation goes out on ${CHAN[l.channel].label} with the Resource Hub link attached.</div></div>
      <div class="eyebrow" style="margin-bottom:8px">Slot</div>
      <div class="slots">${Object.entries(M.slots).map(([k,v],i)=>`<button class="slot ${i===0?'on':''}" data-g="choice" data-v="${k}" onclick="pick('choice','${k}')">${fmtT(v)}</button>`).join('')}</div>
      <label class="fl">Format</label>
      <div class="slots">${['Phone call','Google Meet','WhatsApp video'].map((m,i)=>`<button class="slot ${i===0?'on':''}" data-g="mode" data-v="${m}" onclick="pick('mode','${m}')">${m}</button>`).join('')}</div>
    </div>
    <div class="modal-f">
      <button class="btn btn-ghost" onclick="closeModal();sendHub('${id}')">They declined a call</button>
      <span style="flex:1"></span>
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-green" onclick="saveBook('${id}')">Confirm booking</button></div>`); }
function saveBook(id){ const l=lead(id), at=M.slots[M.choice];
  l.walkthrough={at:iso(at),mode:M.mode}; l.stage='booked'; l.nextAt=iso(at);
  if(['failed','new'].includes(l.status)) l.status='qualified';
  const shut=winState(l)==='shut';
  addMsg(l, shut?{dir:'out',ch:'whatsapp',kind:'tpl',body:'oa_slot_proposal_v3',state:'sent'}
               :{dir:'out',ch:l.channel,kind:'text',body:`Booked — ${fmtT(at)} · ${M.mode}, ${CFG.walkthroughMin} minutes. I'll send the Resource Hub link now so you can look at pricing first.`,state:'sent'});
  push(l,'book',`Walkthrough booked — ${M.mode}`,fmtT(at));
  save(); closeModal(); render(); toast('Booked for '+fmtT(at),'ok'); }
function sendHub(id){ const l=lead(id);
  l.stage='hub'; l.quiet=0; l.nextAt=iso(d(QUIET_GAP));
  addMsg(l,{dir:'out',ch:'whatsapp',kind:'tpl',body:'oa_hub_share_v1',state:'sent'});
  push(l,'hub','Resource Hub sent — walkthrough declined',`Went-quiet cadence started · follow-up 1 of ${QUIET_MAX} in ${QUIET_GAP} days`);
  save(); closeModal(); render(); toast(`Hub sent. Follow-up 1 of ${QUIET_MAX} in ${QUIET_GAP} days`,'ok'); }

/* --- activate --- */
function openActivate(id){ const l=lead(id); M={ready:()=>true};
  openModal(`<div class="modal-h">${ic('check',18)}<h3>Activate &amp; write the handoff record</h3><span style="flex:1"></span>

function saveActivate(id){ const l=lead(id), g=x=>(document.getElementById(x)||{}).value||'—';
  l.handoff={am:g('h-am'),profile:g('h-profile'),intent:g('h-intent'),services:g('h-services'),
    objections:g('h-obj'),commitments:g('h-com'),risk:g('h-risk')};

  push(l,'activate',`Activated — handed off to ${l.handoff.am}`,'Handoff record complete. Contact ownership moved to the AM.');

</script>
<script>
/* =============== reminders =============== */
function viewReminders(){
  const open=myLeads().filter(l=>isOpen(l)&&l.nextAt);
  const g={over:[],today:[],tom:[],week:[]};
  open.forEach(l=>{const n=days(l.nextAt);(n<0?g.over:n===0?g.today:n===1?g.tom:g.week).push(l);});
  Object.values(g).forEach(a=>a.sort((x,y)=>new Date(x.nextAt)-new Date(y.nextAt)));
  const block=(title,arr,tone,note)=>`<div class="card" style="margin-bottom:16px">
    <div class="card-h"><span style="width:8px;height:8px;border-radius:50%;background:${tone}"></span>
      <h3>${title}</h3><span class="sp"></span><span class="chip num">${arr.length}</span></div>
    ${note?`<div class="banner bn-slate tiny" style="margin-bottom:12px">${ic('spark',14)}<div>${note}</div></div>`:''}
    ${arr.length?arr.map(l=>`<div class="lrow own-me" style="cursor:pointer;padding-left:10px" onclick="go('#/lead/${l.id}')">
      ${avatar(l)}
      <div class="grow"><div class="t">${esc(l.name)} <span class="ar muted" style="font-size:12px">${esc(l.ar)}</span></div>
        <div class="s" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:3px">${flagInline(l.country)} · ${cadLabel(l)} ${winChip(l)}</div></div>
      ${statusPill(l)} ${dueChip(l)}
      ${l.stage==='booked'?'':`<button class="btn btn-red btn-sm" onclick="event.stopPropagation();openMacros('${l.id}')">${ic('spark',12)} Macro</button>`}
    </div>`).join('') : `<div class="empty tiny">Nothing here.</div>`}</div>`;
  return `
  <div class="page-head">
    <button class="back-btn" onclick="go('#/')">${ic('back',15)}</button>
    <div><h1 class="page-title">Reminders</h1>
      <div class="page-sub">Created automatically the morning after every failed contact, and every ${QUIET_GAP} days for sellers who went quiet</div></div>
  </div>
  ${block('Overdue',g.over,'#DC2626','Zero overdue items at the close of every day — 15% of your scorecard.')}
  ${block('Due today',g.today,'#F59E0B','')}
  ${block('Tomorrow',g.tom,'#3B82F6','')}
  ${block('Later this week',g.week,'#94A3B8','')}`;
}

/* =============== walkthroughs =============== */
const BLOCKS=[
  ['Their story','0–3','Recap discovery in one line and let them correct you. What does success look like in 90 days?'],
  ['Services mapped','3–7','Only the services that serve their goal. Name two, not seven.'],
  ['Pricing, live','7–13','Open the calculator with THEIR product and THEIR volumes. The longest block, because it is the trust moment.'],
  ['Process end to end','13–16','Sourcing request to COD payout, at headline level. Detail lives in the Resource Hub.'],
  ['After activation','16–18','"Your Account Manager calls within 24 hours and stays with you daily for your first month."'],
  ['Close','18–20','Ready → activate on the call. Hesitant → handle the objection, then ONE dated next step.'],
];
function viewWalkthroughs(){
  const booked=myLeads().filter(l=>l.stage==='booked'&&l.walkthrough).sort((a,b)=>new Date(a.walkthrough.at)-new Date(b.walkthrough.at));
  const hub=myLeads().filter(l=>l.stage==='hub');
  return `
  <div class="page-head">
    <button class="back-btn" onclick="go('#/')">${ic('back',15)}</button>
    <div><h1 class="page-title">Walkthroughs</h1>
      <div class="page-sub">${CFG.walkthroughMin} minutes, six blocks. The first call books it; this call earns the activation.</div></div>
    <span class="head-sp"></span>
    <button class="btn btn-ghost" onclick="go('#/hub/how-it-works')">${ic('book',14)} Resource Hub</button>
  </div>

    <button class="nav-item dim" onclick="toast('Platform administration — outside the onboarding module')">
      <span class="nav-ico">${ic('cog',15)}</span> Platform Settings</button>
    ${Object.keys(S.cfgDraft).length?`<div class="side-card" style="background:var(--amber-soft);color:#78350F;cursor:pointer" onclick="go('#/a/config')">
        ${ic('clock',16)} Unpublished change <span class="chip" style="margin-left:auto;background:#fff;color:#78350F">${Object.keys(S.cfgDraft).length}</span></div>`
      :`<div class="side-card" style="background:#EEF2FF;color:#3730A3">${ic('shield',16)} Administrator
        <span class="chip" style="margin-left:auto;background:#fff;color:#4F46E5">role</span></div>`}`;
  document.getElementById('due-badge').textContent=o.dueToday;
  document.getElementById('overdue-badge').textContent=o.overdue;
  document.getElementById('cap').innerHTML=`${ic('users',12)} ${TEAM.length} agents online
    <span class="bars">${TEAM.map(()=>'<i class="on"></i>').join('')}</span>`;
  renderWho();
}

/* =============== ops metrics (whole team) =============== */
function ops(){
  const all=S.leads;
  const open=all.filter(isOpen);
  const overdue=open.filter(l=>l.nextAt&&days(l.nextAt)<0).length;
  const dueToday=open.filter(l=>l.nextAt&&days(l.nextAt)===0).length;
  const unclaimed=all.filter(l=>!l.ownerId&&isOpen(l)).length;   // held for capacity, never 'unclaimed by choice'
  const uncontacted=all.filter(l=>l.status==='new').length;
  const shut=open.filter(l=>winState(l)==='shut').length;
  const oldest=open.filter(l=>l.status==='new').map(l=>(Date.now()-new Date(l.registeredAt))/HOUR).sort((a,b)=>b-a)[0]||0;
  return {overdue,dueToday,unclaimed,waiting:unclaimed,uncontacted,shut,oldest,
    openConv:open.length, activated:all.filter(l=>l.stage==='activated').length,
    cold:all.filter(l=>l.status==='cold').length,
    alerts:(overdue?1:0)+(unclaimed?1:0)+(oldest>CFG.firstContactH?1:0),
    tplLeft:CFG.tplBudgetMonth-A.tplUsed};
}

/* =============== router =============== */
function render(){
  const h=location.hash||'#/', v=document.getElementById('view');
  let html;
  if(h.startsWith('#/a/')){
    if(S.role!=='admin') S.role='admin';
    const k=h.slice(4);
    html = k==='performance'?viewPerf() : k==='leads'?viewAdminLeads() : k==='monitor'?viewMonitor()
      : k==='automation'?viewAutomation() : k==='templates'?viewAdminTemplates() : k==='config'?viewConfig()
      : k==='audit'?viewAudit() : viewOps();
  }
  else if(h.startsWith('#/lead/')) html=viewLead(h.split('/')[2]);
  else if(h==='#/queue') html=viewQueue();
  else if(h==='#/reminders') html=viewReminders();
  else if(h==='#/walkthroughs') html=viewWalkthroughs();
  else if(h==='#/hub/how-it-works') html=viewArticle();
  else if(h==='#/hub') html=viewHub();
  else if(h==='#/playbook') html=viewPlaybook();
  else if(h==='#/kpis') html=viewKpis();
  else html=viewDay();
  v.innerHTML=html; renderSidebar();
  const th=document.getElementById('thread'); if(th) th.scrollTop=th.scrollHeight;
}
</script>
<script>
/* =============== chart helpers =============== */
function meter(val,max,color,suffix='%'){
  const p=Math.max(2,Math.min(100,val/max*100));
  return `<div class="meter"><span class="track"><i style="width:${p}%;background:${color}"></i></span>
    <span class="v" style="color:${color}">${val}${suffix}</span></div>`;
}
const GRAMP=['#ECFDF5','#D1FAE5','#A7F3D0','#6EE7B7','#34D399','#10B981'];
function hmCell(v){ const i=Math.min(GRAMP.length-1,Math.floor(v/100*GRAMP.length));
  return `<span class="hm" style="background:${GRAMP[i]};color:${i>3?'#064E3B':'#065F46'}">${v}%</span>`; }
function ctip(id){ return `<div class="ctip" id="tip-${id}"></div>`; }
function showTip(id,x,y,t,s){ const e=document.getElementById('tip-'+id); if(!e) return;
  e.innerHTML=t+(s?`<span class="s">${s}</span>`:''); e.style.left=x+'px'; e.style.top=y+'px'; e.classList.add('on'); }
function hideTip(id){ const e=document.getElementById('tip-'+id); if(e) e.classList.remove('on'); }

/* activation-rate trend: one series, a target line, dated config marks */
function trendChart(){
  const W=760,H=250,PL=42,PR=16,PT=18,PB=34;
  const pts=A.weeks.map(w=>({...w,rate:Math.round(w.act/w.reg*100)}));
  const maxY=100, x=i=>PL+i*((W-PL-PR)/(pts.length-1)), y=v=>PT+(1-v/maxY)*(H-PT-PB);
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(p.rate).toFixed(1)}`).join(' ');
  const area=`${line} L${x(pts.length-1).toFixed(1)} ${y(0)} L${x(0)} ${y(0)} Z`;
  return `<div class="chartwrap">${ctip('trend')}
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly activation rate over twelve weeks against the 70 percent target, with two configuration changes marked.">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DC2626" stop-opacity=".16"/><stop offset="100%" stop-color="#DC2626" stop-opacity="0"/></linearGradient></defs>
    ${[0,25,50,75,100].map(v=>`<line x1="${PL}" y1="${y(v)}" x2="${W-PR}" y2="${y(v)}" stroke="#EEF1F4" stroke-width="1"/>
      <text x="${PL-8}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="#9CA3AF">${v}%</text>`).join('')}
    <line x1="${PL}" y1="${y(70)}" x2="${W-PR}" y2="${y(70)}" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${PL+6}" y="${y(70)-7}" text-anchor="start" font-size="10.5" fill="#64748B">target 70%</text>
    ${A.marks.map(mk=>{const i=pts.findIndex(p=>p.w===mk.w); if(i<0) return '';
      return `<line x1="${x(i)}" y1="${PT}" x2="${x(i)}" y2="${H-PB}" stroke="#B45309" stroke-width="1" stroke-dasharray="3 3"/>
        <text x="${x(i)+5}" y="${PT+11}" font-size="10" fill="#B45309">${mk.t}</text>`;}).join('')}
    <path d="${area}" fill="url(#ag)"/>
    <path d="${line}" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.rate)}" r="4.5" fill="#fff" stroke="#DC2626" stroke-width="2"/>
      <circle cx="${x(i)}" cy="${y(p.rate)}" r="13" fill="transparent" style="cursor:pointer"
        onmouseenter="showTip('trend',${x(i)},${y(p.rate)},'${p.rate}% activated','${p.w} · ${p.act} of ${p.reg} registrants')"
        onmouseleave="hideTip('trend')"/>`).join('')}
    ${pts.map((p,i)=>i%2===0?`<text x="${x(i)}" y="${H-12}" text-anchor="middle" font-size="10" fill="#9CA3AF">${p.w}</text>`:'').join('')}
  </svg>
  <div class="legendline"><span><i></i>Weekly activation rate</span><span><i class="dash"></i>Target</span>
    <span style="color:#B45309">▏dated configuration change</span></div></div>`;
}

function statTile(cls,icon,label,val,sub){
  return `<div class="stat ${cls}"><div class="ico">${ic(icon,20)}</div>
    <div><div class="lbl">${label}</div><div class="val num">${val}</div>
    <div style="font-size:10.5px;opacity:.9">${sub}</div></div></div>`;
}

  <div class="alert al-blue"><span class="ai">${ic('file',14)}</span>

          </div>
          ${availBar(a)}
          <div class="tiny muted" style="margin-top:6px;display:flex;gap:12px;flex-wrap:wrap">
            <span>${a.wtToday} walkthrough${a.wtToday===1?'':'s'} · ${mins(a.cWt)}</span>

            <span style="flex:1"></span>

      ${availLegend()}
      <div class="banner bn-slate" style="margin-top:12px">${ic('shield',15)}
        <div><b>How assignment picks.</b> Free minutes = ${mins(CFG.shiftMin)} shift − ${mins(CFG.reservedMin)} reserved for triage and close,

function overdueBlame(){
  const od=S.leads.filter(l=>isOpen(l)&&l.nextAt&&days(l.nextAt)<0);
  const by={}; od.forEach(l=>{const n=l.ownerId?oa(l.ownerId).name:'Unassigned'; by[n]=(by[n]||0)+1;});
  return Object.entries(by).map(([k,v])=>`${k}: ${v}`).join(' · ');
}
function assignAll(){
  const held=S.leads.filter(l=>!l.ownerId&&isOpen(l));
  if(!held.length){ toast('Nothing is being held right now'); return; }
  held.forEach(l=>forceAssignSilent(l));
  AUDIT.unshift({at:new Date(),who:'Haithem (Administrator)',what:`Capacity override — assigned <code>${held.length}</code> held lead(s)`,kind:'op'});
  save(); render(); toast(`${held.length} held lead(s) assigned over capacity`,'warn'); }
function forceAssignSilent(l){
  const all=TEAM.map(t=>({t,a:availability(t.id)}));
  const best=(all.filter(x=>!x.a.onCall).length?all.filter(x=>!x.a.onCall):all).sort((x,y)=>y.a.free-x.a.free)[0];
  l.ownerId=best.t.id; l.waitingCapacity=false; l.assignedAt=iso(new Date());
  l.nextAt=l.nextAt||iso(d(0));
  push(l,'assign',`Assigned to ${best.t.name} by administrator`,'Capacity override from Operations.'); }

<script>

<script>

function admFiltered(){

  return L.sort((a,b)=>(a.nextAt?new Date(a.nextAt):9e15)-(b.nextAt?new Date(b.nextAt):9e15));
}

      <td>${dueChip(l)}</td>

          :`<button class="btn btn-ghost btn-sm" onclick="forceAssign('${l.id}')">${ic('users',12)} Assign now</button>
            <div class="tiny muted" style="margin-top:3px">held for capacity</div>`}</td>

    </tbody></table></div>
    <div class="tbl-foot">Showing <b class="num">${L.length}</b> of ${S.leads.length}

}
function reassign(id,to){ const l=lead(id), from=l.ownerId?oa(l.ownerId).name:'Unassigned';
  l.ownerId=to||null;
  push(l,'assign',`Reassigned by administrator`,`${from} → ${to?oa(to).name:'Unassigned'}`);
  AUDIT.unshift({at:new Date(),who:'Haithem (Administrator)',what:`Reassigned <code>${l.ticket}</code>: ${from} → ${to?oa(to).name:'Unassigned'}`,kind:'op'});
  save(); render(); toast(`${l.name} → ${to?oa(to).name:'unassigned'}`,'ok'); }
function bulkAssign(){ M={choice:null,ready:()=>!!M.choice};
  openModal(`<div class="modal-h">${ic('users',18)}<h3>Reassign ${S.sel.length} tickets</h3><span style="flex:1"></span>
      <button class="tb-btn" onclick="closeModal()">${ic('x',16)}</button></div>
    <div class="modal-b">
      ${TEAM.map(t=>opt('choice',t.id,t.name,`${t.countries.join(', ')} · ${S.leads.filter(l=>l.ownerId===t.id&&isOpen(l)).length} open now`)).join('')}
      ${opt('choice','balance','Balance by least open items','Spreads the selection across the team automatically.')}
      <div class="banner bn-slate tiny" style="margin-top:12px">${ic('shield',14)}
        <div>Per-ticket permissions are checked individually. Anything that fails is reported, not silently skipped.</div></div></div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-red" id="modal-go" disabled onclick="doBulkAssign()">Reassign</button></div>`); }
function doBulkAssign(){ const to=M.choice; let n=0;
  S.sel.forEach(id=>{const l=lead(id);
    const t = to==='balance' ? TEAM.map(x=>({x,c:S.leads.filter(y=>y.ownerId===x.id&&isOpen(y)).length})).sort((a,b)=>a.c-b.c)[0].x.id : to;
    l.ownerId=t; push(l,'assign','Reassigned by administrator','Bulk action'); n++;});
  AUDIT.unshift({at:new Date(),who:'Haithem (Administrator)',what:`Bulk reassigned <code>${n}</code> tickets — one audit entry, reversible`,kind:'op'});
  S.sel=[]; save(); closeModal(); render(); toast(`${n} tickets reassigned`,'ok'); }
function bulkStatus(){ M={choice:null,ready:()=>!!M.choice};
  openModal(`<div class="modal-h">${ic('spark',18)}<h3>Change status on ${S.sel.length} tickets</h3><span style="flex:1"></span>
      <button class="tb-btn" onclick="closeModal()">${ic('x',16)}</button></div>
    <div class="modal-b">
      ${['qualified','prequalified','failed','cold','junk'].map(k=>opt('choice',k,STATUS[k].label,statusHint(k))).join('')}
      <label class="fl">Reason — required, written to the audit log</label>
      <textarea class="fi" id="m-note" placeholder="Why is this batch changing?"></textarea></div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-red" id="modal-go" disabled onclick="doBulkStatus()">Apply to ${S.sel.length}</button></div>`); }
function statusHint(k){ return {qualified:'Strong lead, ready for the walkthrough.',prequalified:'Interested, not committed.',
  failed:'Back into the no-answer cadence from attempt 1.',cold:'Leaves the active queue.',junk:'Excluded from every metric.'}[k]; }
function doBulkStatus(){ const s=M.choice, note=(document.getElementById('m-note')||{}).value||'No reason given';
  S.sel.forEach(id=>{const l=lead(id); const from=STATUS[l.status].label; l.status=s;
    if(['cold','junk'].includes(s)) l.nextAt=null; else if(!l.nextAt) l.nextAt=iso(d(0));
    push(l,'status',`Status changed by administrator: ${from} → ${STATUS[s].label}`,note);});
  AUDIT.unshift({at:new Date(),who:'Haithem (Administrator)',what:`Bulk status → <code>${STATUS[s].label}</code> on ${S.sel.length} tickets — reason: ${esc(note)}`,kind:'op'});
  const n=S.sel.length; S.sel=[]; save(); closeModal(); render(); toast(`${n} tickets set to ${STATUS[s].label}`,'ok'); }

<script>
/* =============== OmniDesk Monitor =============== */
function lastMsg(l){ return l.msgs.length? l.msgs.slice().sort((a,b)=>new Date(b.at)-new Date(a.at))[0] : null; }
function waiting(l){ const m=lastMsg(l); return !!m && m.dir==='in'; }
function ageH(x){ return (Date.now()-new Date(x))/HOUR; }
function agoTxt(x){ const h=ageH(x); return h<1?`${Math.round(h*60)}m`:h<48?`${Math.round(h)}h`:`${Math.round(h/24)}d`; }
const MON_F=[['attention','Needs attention'],['all','All open'],['unassigned','Held in queue'],['shut','Template-only'],['activated','Activated']];
function monList(){
  let L=S.leads.filter(l=>l.msgs.length);
  const f=S.monF||'attention';
  if(f==='attention') L=L.filter(l=>isOpen(l)&&(waiting(l)||(l.nextAt&&days(l.nextAt)<0)));
  else if(f==='all') L=L.filter(isOpen);
  else if(f==='unassigned') L=L.filter(l=>!l.ownerId&&isOpen(l));
  else if(f==='shut') L=L.filter(l=>isOpen(l)&&winState(l)==='shut');
  else if(f==='activated') L=L.filter(l=>l.stage==='activated');
  return L.sort((a,b)=>{const A2=lastMsg(a),B=lastMsg(b); return new Date(B?B.at:0)-new Date(A2?A2.at:0);});
}
function viewMonitor(){
  const L=monList();
  const sel = S.monSel && lead(S.monSel) ? lead(S.monSel) : L[0];
  if(sel) S.monSel=sel.id;
  const o=ops();
  const att=S.leads.filter(l=>l.msgs.length&&isOpen(l)&&waiting(l)).length;
  return `
  <div class="page-head">
    <div><h1 class="page-title">OmniDesk Monitor</h1>
      <div class="page-sub">Every onboarding conversation, live · you can read all of them, and take one over when you need to</div></div>
    <span class="head-sp"></span>
    <button class="btn btn-ghost" onclick="toast('Opens the full OmniDesk workspace with the shift-lead view')">${ic('link',14)} Full OmniDesk</button>
  </div>

  <div class="mini-kpi" style="margin-bottom:16px">
    ${mk('Merchant waiting',att,'last message was theirs',att?'#B42318':'#2B8A3E')}
    ${mk('Open conversations',o.openConv,'onboarding line',"#111827")}
    ${mk('Template-only',o.shut,'24h window closed','#B45309')}
    ${mk('Held in queue',o.waiting,'awaiting the next sweep',o.waiting?'#B45309':'#2B8A3E')}
    ${mk('Longest wait',Math.round(o.oldest)+'h',`first-contact SLA ${CFG.firstContactH}h`,o.oldest>CFG.firstContactH?'#B42318':'#2B8A3E')}
  </div>

  <div class="mon">
    <div class="pane">
      <div class="pane-h"><h3>Conversations</h3><span class="sp"></span><span class="chip num">${L.length}</span></div>
      <div style="display:flex;gap:5px;padding:9px 10px;flex-wrap:wrap;border-bottom:1px solid var(--line)">
        ${MON_F.map(([k,lb])=>`<button class="btn btn-sm ${(S.monF||'attention')===k?'btn-dark':'btn-ghost'}"
          onclick="S.monF='${k}';S.monSel=null;render()">${lb}</button>`).join('')}
      </div>
      <div style="max-height:min(64vh,700px);overflow-y:auto">
        ${L.length?L.map(l=>{const m=lastMsg(l), w=waiting(l);
          return `<div class="convrow ${sel&&sel.id===l.id?'on':''}" onclick="S.monSel='${l.id}';render()">
            ${avatar(l)}
            <div style="flex:1;min-width:0">
              <div class="t">${esc(l.name)} ${w?'<span class="pill st-junk" style="padding:1px 7px;font-size:9px">waiting</span>':''}</div>
              <div class="s">${chDot(l.channel)} ${oaAvatar(l.ownerId)} ${isOpen(l)?winChip(l):'<span class="chip">closed</span>'}</div>
              <div class="tiny muted" style="margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                ${m?esc((m.kind==='tpl'?renderTpl(m.body,l):m.body||'').slice(0,60)):'—'}</div>
            </div>
            <div class="tiny muted num" style="flex:0 0 auto">${m?agoTxt(m.at):''}</div>
          </div>`;}).join('')
        :`<div class="empty tiny">Nothing in this filter.</div>`}
      </div>
    </div>

    ${sel?`<div class="pane">
      <div class="pane-h">
        <span class="chdot ${CHAN[sel.channel].cls}">${ic(CHAN[sel.channel].ico,10)}</span>
        <h3>${esc(sel.name)} · ${sel.conv}</h3>
        ${statusPill(sel)}
        <span class="sp"></span>
        <button class="btn btn-ghost btn-sm" onclick="go('#/lead/${sel.id}')">${ic('file',12)} Open ticket</button>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 13px;background:#EEF2FF;border-bottom:1px solid var(--line);font-size:12px;color:#3730A3">
        ${ic('shield',14)} <b>Monitoring.</b> ${sel.ownerId?`Assigned to ${esc(oa(sel.ownerId).name)} by the platform.`:`Held in the queue — ${esc(sel.waitReason||'no agent had free capacity')}.`}
        <span class="sp"></span>
        <button class="btn btn-sm btn-dark" onclick="takeOver('${sel.id}')">${ic('users',12)} Take over</button>
        <button class="btn btn-sm btn-ghost" onclick="addNote('${sel.id}')">${ic('file',12)} Internal note</button>
        <button class="btn btn-sm btn-ghost" onclick="blockContact('${sel.id}')">${ic('shield',12)} Block contact</button>
      </div>
      <div style="padding:10px 13px 0">
        <div class="winbar ${winState(sel)==='shut'?'shut':'open'}">${ic(winState(sel)==='shut'?'clock':'wa',15)}
          <span>${winState(sel)==='shut'?'Window closed — the agent can only send an approved template.':`Window open — ${winText(sel)}.`}</span>
          <span class="sp"></span><span class="tiny">last message ${lastMsg(sel)?agoTxt(lastMsg(sel).at)+' ago':'—'}</span></div>
      </div>
      <div class="thread" id="thread" style="max-height:min(52vh,560px)">${threadHTML(sel)}</div>
      <div class="composer">
        <div class="comp-box" style="background:var(--surface2);color:var(--muted)">
          ${ic('shield',12)} Administrators monitor and take over. Replying as yourself would break the merchant's single point of contact — take the ticket over first, or leave an internal note for the owner.</div>
      </div>
    </div>`:`<div class="pane"><div class="empty">Select a conversation.</div></div>`}
  </div>`;
}
function takeOver(id){ const l=lead(id), from=l.ownerId?oa(l.ownerId).name:'Unassigned';
  openModal(`<div class="modal-h">${ic('users',18)}<h3>Take over this conversation</h3><span style="flex:1"></span>
      <button class="tb-btn" onclick="closeModal()">${ic('x',16)}</button></div>
    <div class="modal-b">
      <div class="banner bn-amber" style="margin-bottom:14px">${ic('spark',15)}
        <div>Ownership moves from <b>${esc(from)}</b> to you. They are notified, the merchant is not, and the conversation is unbroken.</div></div>
      <label class="fl">Reason — written to the audit log</label>
      <textarea class="fi" id="m-note" placeholder="Escalated by the merchant · agent is on leave · quality intervention…"></textarea></div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-red" onclick="doTakeOver('${id}')">Take over</button></div>`); }
function doTakeOver(id){ const l=lead(id), from=l.ownerId?oa(l.ownerId).name:'Unassigned';
  const note=(document.getElementById('m-note')||{}).value||'No reason given';
  l.ownerId=ME; push(l,'assign','Taken over by administrator',`${from} → Haithem · ${note}`);
  AUDIT.unshift({at:new Date(),who:'Haithem (Administrator)',what:`Took over <code>${l.ticket}</code> from ${from} — reason: ${esc(note)}`,kind:'op'});
  save(); closeModal(); render(); toast('You own this conversation now','ok'); }
function blockContact(id){ const l=lead(id);
  openModal(`<div class="modal-h">${ic('shield',18)}<h3>Block ${esc(l.name)}</h3><span style="flex:1"></span>

      <div class="banner bn-red" style="margin-bottom:14px">${ic('flame',15)}
        <div>Inbound messages are still stored, but no ticket is created and nothing goes out. Existing tickets stay readable. Reversible, and both actions are audited.</div></div>

<script>
/* =============== Automation & Cadence =============== */
function draftVal(k){ return k in S.cfgDraft ? S.cfgDraft[k] : CFG[k]; }
function setDraft(k,v){ v=Math.round(parseFloat(v)*10)/10; if(isNaN(v)||v<0) return;
  if(v===CFG[k]) delete S.cfgDraft[k]; else S.cfgDraft[k]=v; render(); }
function discardDraft(){ S.cfgDraft={}; render(); toast('Draft discarded — the live engine never evaluated it'); }

function simulate(){
  const rows=[];
  if('noAnswerMax' in S.cfgDraft){
    const n=S.cfgDraft.noAnswerMax, hit=S.leads.filter(l=>l.status==='failed'&&l.attempts>=n);
    rows.push([`no_answer_max ${CFG.noAnswerMax} → ${n}`,
      n<CFG.noAnswerMax ? `${hit.length} open lead(s) would move to Cold Lead immediately. Over the last 90 days, ${Math.round(A.cold*0.22)} leads that eventually activated were still being called at attempt ${n+1} or later — they would have been lost.`
      : `${hit.length} open lead(s) get more attempts. Adds up to ${S.leads.filter(l=>l.status==='failed').length*(n-CFG.noAnswerMax)} more call slots per cycle and no extra template cost.`]);
  }
  if('quietMax' in S.cfgDraft || 'quietGapD' in S.cfgDraft){
    const qm=draftVal('quietMax'), qg=draftVal('quietGapD');
    const perLead=qm, month=Math.round(perLead*S.leads.filter(l=>l.quiet>0||l.stage==='hub').length*(30/A.windowDays)*10);
    rows.push([`quiet cadence ${CFG.quietMax}×${CFG.quietGapD}d → ${qm}×${qg}d`,
      `Each follow-up is a billable template. Projected onboarding template spend moves to roughly ${A.tplUsed + (qm-CFG.quietMax)*40} of ${draftVal('tplBudgetMonth')} per month.`]);
  }
  if('firstContactH' in S.cfgDraft){
    const h=S.cfgDraft.firstContactH;
    const breach=S.leads.filter(l=>l.status==='new'&&ageH(l.registeredAt)>h).length;
    rows.push([`first_contact_sla ${CFG.firstContactH}h → ${h}h`,
      `${breach} lead(s) in the queue right now would be flagged as breaching. Rule r2 fires on the new threshold from the next evaluation.`]);
  }
  if('tplBudgetMonth' in S.cfgDraft){
    const b=S.cfgDraft.tplBudgetMonth;
    rows.push([`template_budget ${CFG.tplBudgetMonth} → ${b}`,
      b<A.tplUsed ? `Already over: ${A.tplUsed} sends used this month. Rule r5 would stop sending immediately.`
      : `Headroom of ${b-A.tplUsed} sends for the rest of the month at the current rate.`]);
  }
  if('walkthroughMin' in S.cfgDraft || 'shiftMin' in S.cfgDraft || 'reservedMin' in S.cfgDraft){
    const w=draftVal('walkthroughMin')+draftVal('wtBufferMin'), a=draftVal('shiftMin')-draftVal('reservedMin');
    const before=CFG.walkthroughMin+CFG.wtBufferMin, aBefore=CFG.shiftMin-CFG.reservedMin;
    rows.push([`walkthrough ${CFG.walkthroughMin}m → ${draftVal('walkthroughMin')}m`,
      `A walkthrough slot moves from ${mins(before)} to ${mins(w)} including notes. An agent day holds about
       ${Math.floor(aBefore/before)} → <b>${Math.floor(a/w)}</b> walkthroughs, or frees
       ${mins(Math.max(0,(before-w)*3))} a day across the team for calls and follow-ups.
       Assignment recalculates immediately — agents at capacity today may start receiving leads again.`]);
  }
  Object.keys(S.cfgDraft).filter(k=>!['noAnswerMax','quietMax','quietGapD','firstContactH','tplBudgetMonth','walkthroughMin','shiftMin','reservedMin'].includes(k))
    .forEach(k=>{const f=CFG_FIELDS.find(x=>x[0]===k);
      rows.push([`${k} ${CFG[k]} → ${S.cfgDraft[k]}`,`${f?f[2]:'Configuration change'} — no retroactive effect on tickets already closed.`]);});

  openModal(`<div class="modal-h">${ic('spark',18)}<h3>Simulation — replayed against the last 30 days</h3><span style="flex:1"></span>
      <button class="tb-btn" onclick="closeModal()">${ic('x',16)}</button></div>
    <div class="modal-b">
      <div class="banner bn-blue" style="margin-bottom:14px">${ic('shield',15)}
        <div>Nothing has changed yet. The live engine never evaluates a draft — this is what would have been different.</div></div>
      ${rows.map(([h,b])=>`<div style="padding:12px 0;border-bottom:1px solid var(--line2)">
        <div class="cond trg" style="margin-bottom:7px">${esc(h)}</div>
        <div style="font-size:13px;color:var(--ink3);line-height:1.6">${b}</div></div>`).join('')}
      <div class="diff" style="margin-top:16px">
        ${Object.keys(S.cfgDraft).map(k=>`<div class="minus">− ${k}: ${CFG[k]}</div><div class="plus">+ ${k}: ${S.cfgDraft[k]}</div>`).join('')}
      </div>
    </div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">Back to draft</button>
      <button class="btn btn-green" onclick="publishCfg()">${ic('check',14)} Publish</button></div>`,true);
}
function publishCfg(){
  const diff=Object.keys(S.cfgDraft).flatMap(k=>[['-',`${k}: ${CFG[k]}`],['+',`${k}: ${S.cfgDraft[k]}`]]);
  const notes=Object.keys(S.cfgDraft).map(k=>{const f=CFG_FIELDS.find(x=>x[0]===k);
    return `${f?f[1]:k} ${CFG[k]} → ${S.cfgDraft[k]}`;}).join('; ');
  Object.assign(CFG,S.cfgDraft);
  NO_ANSWER_MAX=CFG.noAnswerMax; QUIET_MAX=CFG.quietMax; QUIET_GAP=CFG.quietGapD;
  VERSIONS.forEach(v=>v.live=false);
  VERSIONS.unshift({v:VERSIONS[0].v+1,at:new Date(),by:'Haithem',note:notes,live:true,diff,state:{...CFG}});
  AUDIT.unshift({at:new Date(),who:'Haithem (Administrator)',what:`Published config <code>v${VERSIONS[0].v}</code> — ${esc(notes)}`,kind:'cfg'});
  S.cfgDraft={}; closeModal(); render();
  toast(`Published v${VERSIONS[0].v}. The agent view is already using it.`,'ok');
}
function rollback(v){ const ver=VERSIONS.find(x=>x.v===v); if(!ver) return;
  /* A version is a full snapshot, not a patch — restoring it is atomic and total. */
  if(ver.state) Object.assign(CFG, ver.state);
  else ver.diff.forEach(([sign,txt])=>{ if(sign!=='+') return;
    const [k,val]=txt.split(': '); const n=parseFloat(val);
    if(k in CFG && !isNaN(n)) CFG[k]=n; });
  NO_ANSWER_MAX=CFG.noAnswerMax; QUIET_MAX=CFG.quietMax; QUIET_GAP=CFG.quietGapD;
  VERSIONS.forEach(x=>x.live=false); ver.live=true;
  AUDIT.unshift({at:new Date(),who:'Haithem (Administrator)',what:`Rolled back to <code>v${v}</code> — atomic, one click`,kind:'cfg'});
  render(); toast(`Rolled back to v${v}`,'warn'); }
function toggleRule(id){ const r=RULES.find(x=>x.id===id); r.on=!r.on;
  AUDIT.unshift({at:new Date(),who:'Haithem (Administrator)',what:`${r.on?'Enabled':'Disabled'} rule <code>${r.id}</code> — ${esc(r.name)}`,kind:'cfg'});
  render(); toast(`${r.name} — ${r.on?'enabled':'disabled'}`,r.on?'ok':'warn'); }

function pendingBar(){
  const n=Object.keys(S.cfgDraft).length; if(!n) return '';
  return `<div class="pending">${ic('clock',16)}
    <b>${n} unpublished change${n>1?'s':''}.</b> The live engine is still running the published version.
    <span class="sp"></span>
    <button class="btn btn-ghost btn-sm" onclick="discardDraft()">Discard</button>
    <button class="btn btn-dark btn-sm" onclick="simulate()">${ic('spark',12)} Simulate</button>
    <button class="btn btn-green btn-sm" onclick="simulate()">${ic('check',12)} Review &amp; publish</button></div>`;
}
function cfgRow(k){
  const f=CFG_FIELDS.find(x=>x[0]===k); if(!f) return '';
  const [key,title,sub,unit]=f, v=draftVal(key), changed=key in S.cfgDraft;
  return `<div class="cfgrow">
    <div class="k"><div class="t">${title}</div><div class="s">${sub}</div></div>
    ${changed?`<span class="tiny" style="color:#B45309;font-weight:700">was ${CFG[key]}</span>`:''}
    <input class="num-in ${changed?'changed':''}" type="number" value="${v}" onchange="setDraft('${key}',this.value)" aria-label="${title}">
    <span class="tiny muted" style="width:56px">${unit}</span></div>`;
}
function viewAutomation(){
  return `
  <div class="page-head">
    <div><h1 class="page-title">Automation &amp; Cadence</h1>
      <div class="page-sub">The rules that replaced the CRM · every one is configuration, changed here, never in code</div></div>
    <span class="head-sp"></span>
    <button class="btn btn-ghost" onclick="toast('New rule — composed from the condition and action catalogue')">${ic('plus',14)} New rule</button>
  </div>
  ${pendingBar()}

  <div class="grid2">
    <div class="card">
      <div class="card-h">${ic('clock',16)}<h3>Cadence parameters</h3><span class="sp"></span>
        <span class="chip">changes here move the agent view immediately</span></div>
      ${['firstContactH','noAnswerMax','noAnswerGapD','quietMax','quietGapD','stalledDay','winbackDay'].map(cfgRow).join('')}
      <div class="banner bn-amber" style="margin-top:14px">${ic('file',15)}
        <div><b>The quiet cadence has a bill attached.</b> ${draftVal('quietMax')} follow-ups every ${draftVal('quietGapD')} days all land outside
        the 24-hour window, so each one is a billable template. Raising either number raises template spend before it raises activations —
        the cohort table shows almost nothing activates after day 14.</div></div>
    </div>

    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card">
        <div class="card-h">${ic('dollar',16)}<h3>Template budget</h3></div>
        ${['tplBudgetMonth','tplPerContact','unclaimedReofferMin'].map(cfgRow).join('')}
        <div style="margin-top:14px">
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">
            <span style="font-weight:600">Used this month</span>
            <span class="num muted">${A.tplUsed} of ${draftVal('tplBudgetMonth')}</span></div>
          <div class="bar" style="height:9px"><i style="width:${Math.min(100,A.tplUsed/draftVal('tplBudgetMonth')*100)}%;background:${A.tplUsed/draftVal('tplBudgetMonth')>.8?'#B42318':'#B45309'}"></i></div>
          <div class="tiny muted" style="margin-top:5px">Karim has sent 118 of those; Noor 49. Spend follows the quiet cadence, not the workload.</div>
        </div>
      </div>

      <div class="card">
        <div class="card-h">${ic('gauge',16)}<h3>Capacity &amp; the time model</h3><span class="sp"></span>
          <span class="chip">drives automatic assignment</span></div>
        <p class="tiny muted" style="margin:0 0 10px">Assignment picks the agent with the most free minutes on the lead's market.
          These minute values are what "free" means, and they are also how handle time per lead is estimated — nobody runs a stopwatch.</p>
        ${['shiftMin','reservedMin','maxOpenLeads','walkthroughMin','wtBufferMin','firstContactMin','wrapMin','followupMin'].map(cfgRow).join('')}
        <div class="acc ${S.openAcc===99?'open':''}" style="margin-top:10px">
          <button class="acc-h" onclick="S.openAcc=${S.openAcc===99?'null':99};render()">
            ${ic('clock',14)} Per-message minute values<span class="ch">${ic('chev',14)}</span></button>
          ${S.openAcc===99?`<div class="acc-b" style="padding-top:0">
            ${['composeMin','readMin','templateMin','noteMin','noAnswerMin','activationMin'].map(cfgRow).join('')}</div>`:''}
        </div>
        <div class="banner bn-blue" style="margin-top:12px">${ic('users',15)}
          <div>An agent day is <b>${mins(draftVal('shiftMin')-draftVal('reservedMin'))}</b> of assignable time.
          A walkthrough costs <b>${mins(draftVal('walkthroughMin')+draftVal('wtBufferMin'))}</b>, a first contact <b>${mins(draftVal('firstContactMin')+draftVal('wrapMin'))}</b> —
          so a day of ${Math.floor((draftVal('shiftMin')-draftVal('reservedMin'))/(draftVal('walkthroughMin')+draftVal('wtBufferMin')))} walkthroughs leaves nothing for calls.
          That trade-off is the whole reason the number is here rather than in code.</div></div>
      </div>

      <div class="card">
        <div class="card-h">${ic('refresh',16)}<h3>Config versions</h3><span class="sp"></span>
          <span class="tiny muted">versioned, attributed, reversible</span></div>
        ${VERSIONS.map(v=>`<div class="ver ${v.live?'live':''}">
          <span class="dot">${v.live?ic('check',11,3):'v'+v.v}</span>
          <div style="flex:1;min-width:0">
            <div style="font-size:12.5px;font-weight:600">v${v.v} — ${esc(v.note)}</div>
            <div class="tiny muted">${fmtT(v.at)} · ${v.by}${v.live?' · live':''}</div>
            <div class="diff" style="margin-top:7px">${v.diff.map(([s,t])=>`<div class="${s==='-'?'minus':'plus'}">${s} ${esc(t)}</div>`).join('')}</div>
          </div>
          ${v.live?'':`<button class="btn btn-ghost btn-sm" onclick="rollback(${v.v})">Roll back</button>`}
        </div>`).join('')}
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <div class="card-h">${ic('spark',16)}<h3>Rules</h3><span class="sp"></span>
      <span class="chip">${RULES.filter(r=>r.on).length} of ${RULES.length} enabled</span></div>
    ${RULES.map(r=>`<div class="rule">
      <div class="rule-h">
        <span class="cond">${r.id}</span>
        <h4>${esc(r.name)}</h4>
        <span class="sp"></span>
        <span class="tiny muted">${r.runs} runs · 90d</span>
        <span class="sw ${r.on?'on':''}" role="switch" aria-checked="${r.on}" tabindex="0"
          onclick="toggleRule('${r.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleRule('${r.id}')}"></span>
      </div>
      <div class="rule-b">
        <span class="lb">When</span><div><span class="cond trg">${esc(r.trg)}</span></div>
        <span class="lb">And</span><div>${r.cond.map(c=>`<span class="cond">${esc(c)}</span>`).join('')}</div>
        <span class="lb">Then</span><div>${r.act.map(a=>`<span class="cond act">${esc(a)}</span>`).join('')}</div>
      </div>
    </div>`).join('')}
    <div class="banner bn-slate" style="margin-top:6px">${ic('shield',16)}
      <div>Conditions and actions are composed from the platform's catalogue. Adding a <em>new kind</em> of condition is engineering work;
      rearranging the ones above is not — which is the whole reason the onboarding process can change without a release.</div></div>
  </div>`;
}
</script>
<script>
/* =============== Templates & Macros (admin) =============== */
let TPL_STATE={oa_intro_v2:{on:true,used:96},oa_slot_proposal_v3:{on:true,used:64},
  oa_hub_share_v1:{on:true,used:48},oa_nudge_v2:{on:true,used:47},oa_winback_d30:{on:false,used:8}};
function toggleTpl(k){ TPL_STATE[k].on=!TPL_STATE[k].on;
  AUDIT.unshift({at:new Date(),who:'Haithem (Administrator)',what:`${TPL_STATE[k].on?'Enabled':'Disabled'} template <code>${k}</code>`,kind:'cfg'});
  render(); toast(`${k} ${TPL_STATE[k].on?'enabled':'disabled'}`,TPL_STATE[k].on?'ok':'warn'); }
function viewAdminTemplates(){

  return `
  <div class="page-head">
    <div><h1 class="page-title">Templates &amp; Macros</h1>

    <div class="banner bn-amber" style="margin-top:14px">${ic('spark',16)}
      <div><b>oa_nudge_v2 is 18% of spend and sits in the quiet cadence.</b> The cohort table says activations after day 14 are close to zero —

  <div class="grid2">

      ${MACROS.map((m,i)=>`<div class="macro" style="cursor:default">

        <div style="flex:1"><div style="display:flex;align-items:center;gap:8px">
            <span class="t">${m.title}</span><span class="chip">${i<4?'team':'global'}</span>
            <span class="sp" style="flex:1"></span><span class="tiny muted num">${[212,88,61,74,33,19][i]} uses</span></div>
          <div class="does">${m.does.map(x=>`<span>${x}</span>`).join('')}</div></div>

      <div class="banner bn-slate tiny" style="margin-top:6px">${ic('shield',14)}

      <div class="kv"><span class="k">Per-contact hard stop</span><span class="v num">${CFG.tplPerContact}</span></div>
      <div class="kv"><span class="k">Marketing templates</span><span class="v">Blocked on the onboarding number</span></div>
      <div class="kv"><span class="k">Quality rating</span><span class="v" style="color:#2B8A3E">Green — Company line</span></div>
      <div class="banner bn-red" style="margin-top:14px">${ic('flame',15)}
        <div>A rule that sends outside the window without a budget check will exhaust the ceiling silently.
        Rule r5 carries <span class="cond">template_budget.remaining &gt; 0</span> as a condition — keep it there.</div></div>
      <div class="card-h" style="margin-top:20px">${ic('shield',16)}<h3>What agents cannot do</h3></div>

}

/* =============== Configuration =============== */
const PERMS=[
  ['View own tickets',1],['View all onboarding tickets',1],['Public reply to contact',1],['Internal note',1],
  ['Edit ticket properties (own)',1],['Reassign / transfer',0],['Merge / split',0],['Create on behalf of contact',1],
  ['Activate seller (accept)',1],['Reject seller',0],['Override eligibility rule',0],['Listen to call recordings (own)',1],
  ['Export contact data',0],['Manage automation / SLA',0],['Manage roles & permissions',0],['View reports (own only)',1],
  ['View audit log',0],['Bulk outbound messaging',0],
];
let PERM_STATE=PERMS.map(p=>p[1]===1);
function togPerm(i){ PERM_STATE[i]=!PERM_STATE[i];
  AUDIT.unshift({at:new Date(),who:'Haithem (Administrator)',what:`${PERM_STATE[i]?'Granted':'Revoked'} <code>${esc(PERMS[i][0])}</code> on the Onboarding Agent role`,kind:'perm'});
  render(); toast(`${PERMS[i][0]} — ${PERM_STATE[i]?'granted':'revoked'}`); }
const CFG_TABS=[['type','Ticket type & fields'],['status','Statuses & transitions'],['team','Team & capacity'],
  ['chan','Channels & numbers'],['perm','Roles & permissions']];
function viewConfig(){
  return `
  <div class="page-head">
    <div><h1 class="page-title">Configuration</h1>
      <div class="page-sub">Administrator only · everything here changes behaviour without a deployment</div></div>
    <span class="head-sp"></span>
    <button class="btn btn-ghost" onclick="go('#/a/audit')">${ic('shield',14)} Who changed what</button>
  </div>
  ${pendingBar()}
  <div class="tabs">${CFG_TABS.map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';render()">${l}</button>`).join('')}</div>
  ${S.tab==='status'?cfgStatuses():S.tab==='team'?cfgTeam():S.tab==='chan'?cfgChan():S.tab==='perm'?cfgPerm():cfgType()}`;
}
function cfgType(){
  const F=[['stage','select','required','first_contact · walkthrough · documents · activation · done'],
    ['due_date','datetime','required','drives the reminder engine'],
    ['attempt_no','number','auto','incremented by the agent action, read by rules r3 and r4'],
    ['followup_no','number','auto','incremented by rule r5'],
    ['cadence_reset','boolean','auto','so a reply resets the clock once, not repeatedly'],
    ['first_order_at','datetime','auto','written by the order domain, never by this module'],
    ['source_utm','text','optional','carried from the registration or the affiliate link'],
    ['handoff_record','composite','required to activate','the eight fields the AM inherits']];
  return `<div class="grid2">
    <div class="card">
      <div class="card-h">${ic('box',16)}<h3>onboarding_task</h3><span class="sp"></span>
        <span class="chip" style="background:var(--green-soft);color:var(--green)">live</span></div>

    ${rows.map(r=>`<div style="padding:15px 0;border-bottom:1px solid var(--line2)">
      <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
        <span style="font-size:13.5px;font-weight:700">${r.name}</span>
        <span class="chip">${r.w}% of score</span><span class="tiny muted">${r.sub}</span>
        <span style="flex:1"></span>
        <span class="num" style="font-size:19px;font-weight:800;color:${r.c}">${r.val}${r.u}</span>
        <span class="pill" style="background:${r.c}1A;color:${r.c}">${ic(r.icn,11)} ${r.lbl}</span></div>
      <div class="kpi-bar"><i style="width:${r.pct}%;background:${r.c}"></i>
        <span class="mark" style="left:${r.lower?0:r.tgt/r.exc*100}%"></span></div>
      <div style="display:flex;gap:16px;margin-top:6px" class="tiny muted num">
        <span>Threshold ${r.lower?'≤':'≥'}${r.thr}${r.u}</span><span>Target ${r.lower?'':'≥'}${r.tgt}${r.u}</span>
        <span>Exceptional ${r.lower?'':'≥'}${r.exc}${r.u}</span><span style="flex:1"></span>
        <span>▏marker = target · onboarding team median ${r.lower?'6%':(r.tgt-4)+'%'}</span></div>
    </div>`).join('')}
    <div class="banner bn-amber" style="margin-top:14px">${ic('users',16)}
      <div><b>Why one KPI is shared.</b> First order within 7 days is shared with the Account Manager. You cannot win a quarter by
      activating unready sellers, and the AM cannot win one by letting your handoffs sit.</div></div>
  </div>

  <div class="grid2">
    <div class="card">
      <div class="card-h">${ic('target',16)}<h3>This month</h3></div>
      ${[['Leads worked',myLeads().length],['Activated',myLeads().filter(l=>l.stage==='activated').length],
         ['Walkthroughs delivered',6],['Average time to first contact','6.4h'],['Template sends used','38 of 120']]
        .map(([k,v])=>`<div class="kv"><span class="k">${k}</span><span class="v num">${v}</span></div>`).join('')}
    </div>
    <div class="card">
      <div class="card-h">${ic('check',16)}<h3>Your quality reviews</h3><span class="sp"></span><span class="chip">you can reply to these</span></div>
      ${[['Walkthrough — Khaled Bouzid',4.6,'Excellent pricing walkthrough. Commitments captured verbatim in the handoff.'],
         ['First contact — Rami Khoury',3.8,'Two attempts logged without a wrap-up note. Write the note at the time, not at 16:30.']]
        .map(([t,s,c])=>`<div class="qa">
          <div style="display:flex;align-items:center;gap:10px"><span style="font-size:12.5px;font-weight:600">${t}</span>
            <span class="sp" style="flex:1"></span><span class="sc num" style="color:${s>=4.2?'#2B8A3E':'#B45309'}">${s}</span></div>
          <p class="tiny muted" style="margin:6px 0 8px">${c}</p>
          <button class="btn btn-ghost btn-sm" onclick="toast('Reply sent to your shift lead')">Respond</button>
        </div>`).join('')}
    </div>
  </div>`;
}

/* =============== boot =============== */
render();
</script>
